          <h2 class="display mt">${preferredAfter ? 'Eligió tu versión actual' : 'Eligió tu versión anterior'}</h2>
          <p class="muted mt">La grabación actual era la <b>${afterKey}</b>.</p>
          <table class="cmp mt" style="max-width:520px;margin:18px auto 0"><thead><tr><th>Criterio</th><th>Antes</th><th>Ahora</th></tr></thead><tbody>
            ${P().BLIND_CRITERIA.map(c => { const b = scores[beforeKey][c.id], a = scores[afterKey][c.id]; return `<tr><td>${esc(c.label)}</td><td>${b}</td><td class="delta ${a > b ? 'up' : a < b ? 'down' : ''}"><b>${a}</b></td></tr>`; }).join('')}
            <tr><td><b>Promedio</b></td><td>${fmt.num(avgBefore, 1)}</td><td><b>${fmt.num(avgAfter, 1)}</b></td></tr></tbody></table>
          ${preferredAfter ? '' : '<p class="small muted mt">No es un fracaso: revisa qué criterio bajó y llévalo a tu foco de la próxima semana.</p>'}
          <div class="row mt-lg" style="justify-content:center"><button class="btn ghost" data-other>Otro oyente</button><a class="btn primary" href="#/escenario">Terminar</a></div></div>`;
        $('[data-other]', el).onclick = setup;
      };
    }

    setup();
  }

  E.views.escenario = {
    render(el, route) {
      const [sub, id] = route.params;
      if (sub === 'preguntas') return questions(el);
      if (sub === 'presentaciones') return presList(el);
      if (sub === 'presentacion') return presEditor(el, id);
      if (sub === 'ensayo') return rehearsal(el, id);
      if (sub === 'video') return video(el);
      if (sub === 'ciegas') return blind(el);
      return hub(el);
    }
  };
})(window.EVCS);

</script>
  <script>/* js/views/session.js */
/* EVCS Web · Vista: sesión guiada */
(function (E) {
  'use strict';
  E.views = E.views || {};
  const { esc, $, $$, fmt } = E.ui;

  function saveActive(fn) { E.store.update(s => { if (s.activeSession) fn(s.activeSession); }); }

  function handlePain(sess) {
    const today = E.store.dayKey();
    E.store.update(s => {
      s.dailyLogs[today] = Object.assign({}, s.dailyLogs[today], { pain: true });
      s.sessions.push({ id: sess.id, date: new Date().toISOString(), day: today, block: sess.block, minutes: sess.plan.minutes, soft: sess.plan.soft, completed: false, pain: true, items: sess.plan.items });
      s.activeSession = null;
    });
    const st = E.store.get();
    const weekAgo = new Date(); weekAgo.setDate(weekAgo.getDate() - 7);
    const painCount = Object.entries(st.dailyLogs).filter(([d, v]) => v.pain && new Date(d + 'T12:00:00') >= weekAgo).length;
    const repeated = painCount >= 2;
    if (repeated) E.store.update(s => { s.profile.gentle = true; });
    E.ui.modal({
      title: 'Detuvimos la sesión',
      body: `<div class="stack"><p>Hiciste bien en parar. La voz es tejido vivo y el dolor es una señal para descansar.</p>
        <div class="callout warn small">${repeated ? '<b>Reportaste dolor dos veces en 7 días.</b> Activamos el modo suave y te recomendamos consultar a un otorrinolaringólogo o foniatra.' : 'Hoy descansa la voz: silencio relativo, agua y nada de gritar. Tu racha queda protegida 7 días.'}</div>
        <p class="small muted">Consulta a un especialista si tienes ronquera más de 2–3 semanas, dolor al hablar o tragar, pérdida de voz repetida o dificultad para respirar.</p></div>`,
      actions: [{ label: 'Entendido', cls: 'primary', onClick: () => { E.app.go('#/hoy'); } }]
    });
  }

  E.views.sesion = {
    render(el) {
      const st = E.store.get();
      const sess = st.activeSession;
      if (!sess) {
        el.innerHTML = '<div class="empty"><span class="e-ico">🧘</span>No hay una sesión en curso.<div class="mt"><a class="btn primary" href="#/hoy">Elegir sesión</a></div></div>';
        return;
      }
      const plan = sess.plan, items = plan.items;
      let timer = null, running = false, panel = null, metro = null;
      let left = 0;

      E.app.setTitle(`<div class="eyebrow">${plan.soft ? 'Modo suave' : `Protocolo de ${plan.minutes} min · ${esc(plan.protocolName)}`} · Semana ${plan.week}</div><h1 class="display" style="margin-top:6px">Sesión de ${E.planner.BLOCK_LABEL[sess.block] ? E.planner.BLOCK_LABEL[sess.block].toLowerCase() : 'práctica'}</h1>`);

      const stopAll = () => { clearInterval(timer); running = false; metro && metro.stop(); };

      function progressBar() {
        return `<div class="session-progress">${items.map((it, i) => `<span class="${it.done ? 'done' : i === sess.index ? 'cur' : ''}"></span>`).join('')}<span class="${sess.index === items.length ? 'cur' : ''}"></span></div>`;
      }

      function queue() {
        const rem = items.slice(sess.index).reduce((a, i) => a + i.seconds, 0) + plan.record.seconds;
        return `<div class="card"><div class="card-head"><div class="card-title">Tu sesión</div><span class="small muted">${fmt.clock(rem)} restantes</span></div>
          <div class="queue">${items.map((it, i) => { const ex = E.data.EX[it.code], f = E.data.FAMILIES[ex.family]; return `<div class="queue-item ${i === sess.index ? 'cur' : ''} ${it.done ? 'done' : ''}" data-jump="${i}" style="cursor:pointer"><span class="ex-code" style="background:${f.color}">${it.code}</span><div class="grow"><b class="small">${esc(ex.name)}</b><div class="tiny muted">${fmt.clock(it.seconds)}</div></div>${it.done ? '✓' : ''}</div>`; }).join('')}
          <div class="queue-item ${sess.index === items.length ? 'cur' : ''}"><span class="ex-code" style="background:var(--red)">🎙️</span><div class="grow"><b class="small">Grabación final</b><div class="tiny muted">${fmt.clock(plan.record.seconds)}</div></div></div></div></div>`;
      }

      function drawExercise() {
        stopAll();
        const it = items[sess.index], ex = E.data.EX[it.code], f = E.data.FAMILIES[ex.family];
        left = it.remaining !== undefined ? it.remaining : it.seconds;
        metro = ex.metronome ? E.library.metronome(ex.metronome) : null;
        el.innerHTML = `${progressBar()}<div class="player">
          <div class="card raised stack">
            <div class="row between"><div class="row" style="flex-wrap:nowrap"><span class="ex-code" style="background:${f.color}">${ex.code}</span><div><div class="eyebrow" style="color:${f.color}">${esc(f.name)} · ${sess.index + 1} de ${items.length}</div><h2 class="display" style="font-size:26px">${esc(ex.name)}</h2></div></div>
              <button class="btn danger sm" data-pain>Me duele</button></div>
            <p class="muted">${esc(ex.summary)}</p>
            <div class="grid grid-2">
              <div><ol class="steps-list">${ex.steps.map(s => `<li><span class="small">${esc(s)}</span></li>`).join('')}</ol>
                <div class="callout small mt"><b>✓</b> ${esc(ex.success)}</div><div class="callout err small mt"><b>✕</b> ${esc(ex.error)}</div></div>
              <div class="stack" style="align-items:center">
                <div data-timer>${E.library.timerRing(left, it.seconds)}</div>
                ${metro ? `<button class="btn sm" data-metro>🎵 Metrónomo ${metro.bpm}</button>` : ''}
              </div>
            </div>
            ${E.library.exerciseText(ex)}
            <div class="row between mt"><button class="btn ghost" data-prev ${sess.index === 0 ? 'disabled' : ''}>← Anterior</button>
              <div class="row"><button class="btn" data-play>${it.remaining !== undefined && it.remaining < it.seconds ? '▶ Continuar' : '▶ Comenzar'}</button><button class="btn go" data-next>Hecho →</button></div></div>
          </div>
          ${queue()}</div>`;
        bindCommon();
        $('[data-play]', el).onclick = e => {
          running = !running;
          e.target.textContent = running ? '⏸ Pausa' : '▶ Continuar';
          if (running) {
            if (metro && !metro.on) metro.start();
            timer = setInterval(() => {
              left--;
              it.remaining = left;
              $('[data-timer]', el).innerHTML = E.library.timerRing(left, it.seconds);
              if (left <= 0) { stopAll(); E.ui.chime(); complete(true); }
            }, 1000);
          } else { stopAll(); saveActive(a => { a.plan.items[sess.index].remaining = left; }); }
        };
        $('[data-next]', el).onclick = () => { stopAll(); complete(false); };
        const prev = $('[data-prev]', el);
        if (prev) prev.onclick = () => { stopAll(); go(sess.index - 1); };
        if (metro) $('[data-metro]', el).onclick = () => { if (metro.on) metro.stop(); else metro.start(); };
      }

      function bindCommon() {
        $$('[data-jump]', el).forEach(q => q.onclick = () => { stopAll(); go(+q.dataset.jump); });
        const pain = $('[data-pain]', el);
        if (pain) pain.onclick = () => { stopAll(); if (panel) panel.destroy(); handlePain(E.store.get().activeSession); };
      }

      function complete(autoAdvance) {
        items[sess.index].done = true;
        delete items[sess.index].remaining;
        const nextIdx = sess.index + 1;
        go(nextIdx, autoAdvance);
      }

      function go(i, autoStart) {
        sess.index = Math.max(0, Math.min(items.length, i));
        saveActive(a => { a.index = sess.index; a.plan.items = items; });
        if (sess.index >= items.length) drawRecord();
        else {
          drawExercise();
          if (autoStart) setTimeout(() => { const p = $('[data-play]', el); if (p) p.click(); }, 1200);
        }
      }

      function drawRecord() {
        stopAll();
        const r = plan.record, W = E.data.WEEKS[plan.week - 1];
        el.innerHTML = `${progressBar()}<div class="player"><div class="card raised">
          <div class="row between"><div><div class="eyebrow">Cierre medible</div><h2 class="display" style="font-size:26px;margin-top:4px">Grabación final</h2></div><button class="btn danger sm" data-pain>Me duele</button></div>
          <p class="muted mt">${r.kind === 'reading' ? 'Lee el Texto Base aplicando lo que entrenaste hoy.' : 'Habla sobre el tema aplicando lo que entrenaste hoy.'} Métrica foco: <b>${esc(E.data.METRICS[r.metric].label)}</b>.</p>
          <div class="mt" data-rec></div></div>${queue()}</div>`;
        bindCommon();
        panel = E.ui.recordPanel($('[data-rec]', el), {
          kind: r.kind, source: 'session', label: `Sesión · ${W.title}`, textId: r.textId, refText: r.textId === 'base' ? E.data.TEXTS.base : null,
          promptHtml: r.textId === 'base' ? esc(E.data.TEXTS.base) : null, promptClass: 'reading', topic: r.topic, prep: r.topic ? 10 : 0,
          maxSec: Math.max(r.seconds, 60), minSec: r.minSeconds, question: r.question, focusMetric: r.metric,
          continueLabel: 'Terminar sesión', onContinue: res => summary(res)
        });
      }

      function summary(res) {
        const today = E.store.dayKey();
        const s2 = E.store.get();
        const otherBlockToday = s2.sessions.some(x => x.day === today && x.completed && x.block !== sess.block);
        let xp = E.game.award('session', E.game.sessionXP(plan.minutes, plan.soft), sess.id);
        if (otherBlockToday) xp += E.game.award('block', 10, sess.id);
        xp += E.game.award('recording', 5, res.rec && res.rec.id);
        const metricVal = res.metrics[plan.record.metric];
        xp += E.game.checkImprovement(plan.record.metric, metricVal);
        const minutesDone = Math.round(items.filter(i => i.done).reduce((a, i) => a + i.seconds, 0) / 60 + (res.durationMs || 0) / 60000);
        E.store.update(s => {
          items.filter(i => i.done).forEach(i => {
            s.exerciseLog[i.code] = s.exerciseLog[i.code] || [];
            if (!s.exerciseLog[i.code].includes(today)) s.exerciseLog[i.code].push(today);
          });
          s.sessions.push({ id: sess.id, date: new Date().toISOString(), day: today, block: sess.block, minutes: plan.minutes, minutesDone, soft: plan.soft, completed: true, pain: false, items, recId: res.rec && res.rec.id, fatigue: sess.fatigue, week: plan.week });
          s.activeSession = null;
        });
        if (panel) { panel.destroy(); panel = null; }
        el.innerHTML = `<div class="card raised center" style="max-width:640px;margin:0 auto">
          <div style="font-size:64px">${plan.soft ? '🌙' : '🎉'}</div>
          <h2 class="display mt">${plan.soft ? 'Sesión suave completada' : '¡Sesión completada!'}</h2>
          <p class="muted mt">${minutesDone} minutos · ${items.filter(i => i.done).length} ejercicios</p>
          <div class="row mt" style="justify-content:center"><span class="pill gem" style="font-size:18px">+${xp} XP</span><span class="pill fire" style="font-size:18px">🔥 ${E.game.streak().current}</span></div>
          <div class="mt-lg" style="text-align:left">${E.ui.metricsBlock(res.metrics, { focus: plan.record.metric, keys: [plan.record.metric, 'wpm', 'f0SdSt', 'longPausesPerMin', 'fillersPerMin', 'fallingPct', 'accuracy'] })}</div>
          <label class="field mt" style="text-align:left">Nota de una línea (opcional)<input type="text" data-note maxlength="160" placeholder="¿Qué notaste hoy?"></label>
          <button class="btn go big block mt-lg" data-finish>Terminar</button></div>`;
        $('[data-finish]', el).onclick = () => {
          const note = $('[data-note]', el).value.trim();
          if (note) E.store.update(s => { const x = s.sessions.find(y => y.id === sess.id); if (x) x.note = note; });
          E.app.go('#/hoy');
          setTimeout(() => E.app.rewards({}), 200);
        };
        E.app.refreshChrome();
      }

      if (sess.index >= items.length) drawRecord(); else drawExercise();
      return () => { stopAll(); if (panel) panel.destroy(); };
    }
  };
})(window.EVCS);

        });
      });

    }
  };

        <div class="grid grid-4">
          <div class="card kpi"><span class="kpi-label">Índice EVCS</span><span class="kpi-value">${last && isNum(last.index) ? Math.round(last.index) : '—'}</span>
            <span class="small">${delta !== null ? `<b class="delta ${delta >= 0 ? 'up' : 'down'}">${delta >= 0 ? '▲ +' : '▼ '}${fmt.num(delta, 1)}</b> vs. línea base` : last ? esc(E.scoring.band(last.index) ? E.scoring.band(last.index).name : '') : '<a href="#/diagnostico">Haz tu diagnóstico</a>'}</span></div>
          <div class="card kpi"><span class="kpi-label">Nivel</span><span class="kpi-value">${lv.level}</span><span class="small muted">${esc(lv.name)} · ${fmt.num(lv.xp)} XP</span></div>
          <div class="card kpi"><span class="kpi-label">Racha</span><span class="kpi-value">🔥 ${streak.current}</span><span class="small muted">Mejor: ${streak.best} días</span></div>
          <div class="card kpi"><span class="kpi-label">Práctica total</span><span class="kpi-value">${fmt.num(totalMin)}</span><span class="small muted">minutos · ${sessions.length} sesiones</span></div>
        </div>

        <div class="grid grid-2 mt">
          <div class="card"><div class="card-head"><div class="card-title">Índice EVCS-100</div><span class="small muted">${list.length} evaluaciones</span></div>
            ${list.length ? E.ui.lineChart(list.map(a => ({ label: labelFor(a), y: a.index }))) : '<div class="empty"><span class="e-ico">📏</span>Sin evaluaciones aún.</div>'}</div>
          <div class="card"><div class="card-head"><div class="card-title">9 dimensiones</div><div class="legend">${base && last && base.id !== last.id ? '<span><i style="background:var(--blue)"></i>Línea base</span>' : ''}<span><i style="background:var(--accent)"></i>Actual</span></div></div>
            ${last ? E.ui.radar([...(base && base.id !== last.id ? [{ values: values(base), color: 'var(--blue)', fill: 0.06, dash: true }] : []), { values: values(last), color: 'var(--accent)' }], { size: 300 }) : '<div class="empty"><span class="e-ico">🕸️</span>Aparecerá tras tu diagnóstico.</div>'}</div>
        </div>

        <div class="section-title"><h2 class="display">Tendencias semanales</h2><span class="small muted">Promedio de tus grabaciones, últimas 12 semanas</span></div>
        <div class="grid grid-3">${trendKeys.map(k => {
          const vals = weeklyAverages(k), def = E.data.METRICS[k];
          const lastVal = [...vals].reverse().find(isNum);
          const target = def.better === 'range' ? (def.target[0] + def.target[1]) / 2 : def.target;
          return `<div class="card"><div class="row between"><b class="small">${def.label} ${E.ui.helpBtn(k)}</b><span class="tag ${E.ui.metricStatus(k, lastVal)}">${E.ui.targetText(k)}</span></div>
            <div class="kpi-value mt" style="font-size:26px">${isNum(lastVal) ? fmt.metric(k, lastVal) : '—'}</div>
            <div class="mt">${E.ui.spark(vals, { target })}</div></div>`;
        }).join('')}</div>

        <div class="grid grid-2 mt">
          <div class="card"><div class="card-head"><div class="card-title">Mapa de práctica</div><span class="small muted">13 semanas</span></div>
            ${E.ui.heatmap(minutesByDay)}
            <div class="legend mt"><span><i style="background:var(--surface-3)"></i>0</span><span><i style="background:color-mix(in srgb,var(--green) 35%,var(--surface-3))"></i>1–14 min</span><span><i style="background:color-mix(in srgb,var(--green) 65%,var(--surface-3))"></i>15–29</span><span><i style="background:var(--green)"></i>30+</span></div></div>
          <div class="card"><div class="card-head"><div class="card-title">Exposiciones reales</div><span class="small muted">${expos.length} registradas</span></div>
            ${expos.length ? `<div class="row"><div class="grow"><div class="small muted">Nervios antes</div>${E.ui.spark(expos.map(e => e.nervesBefore), { color: 'var(--red)' })}</div><div class="grow"><div class="small muted">Nervios después</div>${E.ui.spark(expos.map(e => e.nervesAfter), { color: 'var(--green)' })}</div></div>
              <div class="list mt">${expos.slice(-4).reverse().map(e => `<div class="list-item"><div class="avatar">🎤</div><div class="grow"><b class="small">${esc(e.situation)}</b><div class="tiny faint">${fmt.date(e.date)} · ${esc(e.goal)}</div></div><span class="tag">${e.nervesBefore} → ${e.nervesAfter}</span></div>`).join('')}</div>`
              : '<div class="empty"><span class="e-ico">🎤</span>Registra tu primera exposición desde Hoy o Plan.</div>'}</div>
        </div>

        ${(() => {
          const pp = st.practice || { qa: [], presence: [], blind: [], presentations: [] };
          const reh = pp.presentations.reduce((a, p) => a + p.rehearsals.length, 0);
          if (!pp.qa.length && !pp.presence.length && !pp.blind.length && !reh) return '';
          return `<div class="section-title"><h2 class="display">Escenario</h2><a class="link-btn small" href="#/escenario">Practicar</a></div>
          <div class="grid grid-4">
            <div class="card kpi"><span class="kpi-label">Preguntas difíciles</span><span class="kpi-value">${pp.qa.length}</span><div class="mt">${E.ui.spark(pp.qa.map(q => q.score), { target: 70 })}</div></div>
            <div class="card kpi"><span class="kpi-label">Presencia en video</span><span class="kpi-value">${pp.presence.length ? Math.round(pp.presence[pp.presence.length - 1].score) : '—'}</span><div class="mt">${E.ui.spark(pp.presence.map(x => x.score), { target: 70 })}</div></div>
            <div class="card kpi"><span class="kpi-label">Ensayos de presentaciones</span><span class="kpi-value">${reh}</span><span class="small muted">${pp.presentations.length} presentaciones</span></div>
            <div class="card kpi"><span class="kpi-label">Evaluación a ciegas</span><span class="kpi-value">${pp.blind.length ? `${pp.blind.filter(b => b.preferredAfter).length}/${pp.blind.length}` : '—'}</span><span class="small muted">oyentes prefirieron tu versión actual</span></div>
          </div>`;
        })()}

        <div class="section-title"><h2 class="display">Insignias</h2><span class="small muted">${Object.keys(st.badges).length} de ${E.data.BADGES.length}</span></div>
        <div class="badges">${E.data.BADGES.map(b => `<div class="badge ${st.badges[b.code] ? 'on' : ''}" title="${esc(b.desc)}"><div class="b-ico">${b.icon}</div><div class="b-name">${esc(b.name)}</div><div class="tiny faint" style="margin-top:4px">${st.badges[b.code] ? fmt.date(st.badges[b.code]) : esc(b.desc)}</div></div>`).join('')}</div>

        <div class="section-title"><h2 class="display">Niveles</h2></div>
        <div class="card"><div class="list">${E.data.LEVELS.map(l => `<div class="list-item"><div class="avatar">${l.level <= lv.level ? '👑' : '🔒'}</div><div class="grow"><b>Nivel ${l.level} · ${esc(l.name)}</b><div class="tiny faint">${fmt.num(l.minXp)} XP${l.minIndex ? ` y EVCS ≥ ${l.minIndex}` : ''}</div></div>${l.level === lv.level ? '<span class="tag ok">Actual</span>' : ''}</div>`).join('')}</div></div>

        <div class="section-title"><h2 class="display">Evaluaciones</h2><a class="btn sm" href="#/diagnostico?tipo=reevaluacion">Nueva evaluación</a></div>
        <div class="card"><div class="list">${list.length ? list.slice().reverse().map(a => `<div class="list-item"><div class="avatar">📏</div><div class="grow"><b>${a.kind === 'baseline' ? 'Línea base' : `Reevaluación · semana ${a.week}`}</b><div class="tiny faint">${fmt.date(a.completedAt || a.date)}${a.provisional ? ' · provisional' : ''}</div></div><b class="kpi-value" style="font-size:24px">${isNum(a.index) ? Math.round(a.index) : '—'}</b><a class="btn sm ghost" href="#/resultado/${a.id}">Ver</a></div>`).join('') : '<div class="empty">Sin evaluaciones.</div>'}</div></div>`;
    }
  };
})(window.EVCS);

</script>
  <script>/* js/views/profile.js */
/* EVCS Web · Vista: perfil, preferencias, salud vocal y datos */
(function (E) {
  'use strict';
  E.views = E.views || {};
  E.forms = E.forms || {};
  const { esc, $, $$, fmt } = E.ui;

  function download(name, text) {
    const blob = new Blob([text], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  function healthCheck(onDone) {
    const ans = E.data.HEALTH_QUESTIONS.map(() => false);
    E.ui.modal({
      title: 'Chequeo de salud vocal',
      body: `<div class="stack">${E.data.HEALTH_QUESTIONS.map((q, i) => `<label class="check"><input type="checkbox" data-h="${i}"><span>${esc(q)}</span></label>`).join('')}</div>`,
      actions: [{ label: 'Cancelar', cls: 'ghost' }, {
        label: 'Guardar', cls: 'primary', onClick: () => {
          const caution = ans.some(Boolean);
          E.store.update(s => { s.health = { answers: ans, result: caution ? 'caution' : 'ok', date: new Date().toISOString() }; if (caution) s.profile.gentle = true; });
          E.ui.toast(caution ? 'Modo suave activado. Considera consultar a un especialista.' : 'Sin señales de alarma', caution ? '' : 'ok');
          onDone && onDone();
        }
      }],
      onMount: m => $$('[data-h]', m).forEach(c => c.onchange = () => { ans[+c.dataset.h] = c.checked; c.closest('.check').classList.toggle('on', c.checked); })
    });
  }

  // Archivo de calendario (.ics) con los 3 bloques diarios y la revisión semanal
  function calendarFile(schedule) {
    const pad = n => String(n).padStart(2, '0');
    const t = new Date(); t.setDate(t.getDate() + 1);
    const date = `${t.getFullYear()}${pad(t.getMonth() + 1)}${pad(t.getDate())}`;
    const now = new Date(), stamp = `${now.getUTCFullYear()}${pad(now.getUTCMonth() + 1)}${pad(now.getUTCDate())}T${pad(now.getUTCHours())}${pad(now.getUTCMinutes())}00Z`;
    const hm = s => (s || '07:30').replace(':', '') + '00';
    const sunday = new Date(t); sunday.setDate(t.getDate() + ((7 - t.getDay()) % 7));
    const sDate = `${sunday.getFullYear()}${pad(sunday.getMonth() + 1)}${pad(sunday.getDate())}`;
    const ev = (uid, start, rule, minutes, title, desc) => ['BEGIN:VEVENT', `UID:evcs-${uid}-${Date.now()}@evcs.local`, `DTSTAMP:${stamp}`, `DTSTART:${start}`, `DURATION:PT${minutes}M`, `RRULE:${rule}`,
      `SUMMARY:${title}`, `DESCRIPTION:${desc}`, 'BEGIN:VALARM', 'TRIGGER:PT0M', 'ACTION:DISPLAY', `DESCRIPTION:${title}`, 'END:VALARM', 'END:VEVENT'];
    const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//EVCS//Elite Vocal Communication System//ES', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH',
      ...ev('manana', `${date}T${hm(schedule.morning)}`, 'FREQ=DAILY', 15, 'EVCS · Bloque de mañana', 'Prepara el instrumento: popote\\, zumbido y articulación. Abre EVCS.html.'),
      ...ev('mediodia', `${date}T${hm(schedule.midday)}`, 'FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR', 10, 'EVCS · Mediodía: transfiere', 'Antes de tu junta: rutina de 90 s y un objetivo técnico. Practica una pregunta difícil.'),
      ...ev('noche', `${date}T${hm(schedule.night)}`, 'FREQ=DAILY', 20, 'EVCS · Bloque de noche', 'Práctica deliberada\\, grabación y registro. Sonido del día en Modo Dicción.'),
      ...ev('revision', `${sDate}T180000`, 'FREQ=WEEKLY;BYDAY=SU', 10, 'EVCS · Revisión semanal', 'Cierra la semana en el Plan y define tu objetivo.'),
      'END:VCALENDAR'];
    return lines.join('\r\n');
  }

  // ---------- Respaldo: formularios compartidos ----------
  const CONSENT = 'Acepto que mi avance (métricas, sesiones, progreso y textos; nunca audios ni videos) se guarde en una hoja de Google administrada por quien me compartió la app.';

  function urlField() {
    return E.cloud.embeddedUrl() ? '' : `<label class="field">Enlace del servicio de respaldo<input type="text" data-curl value="${esc(E.cloud.url())}" placeholder="https://script.google.com/macros/s/…/exec"><span class="tiny faint">Te lo da quien administra la app.</span></label>`;
  }

  // Activar respaldo en la nube (con detección de avance ya guardado con ese código)
  E.forms.cloudEnable = function (onDone) {
    E.ui.modal({
      title: 'Respaldo en la nube',
      body: `<div class="stack">
        <p class="muted small">Tu avance se respaldará solo cada vez que practiques. Si cambias de teléfono o se borra el navegador, lo recuperas con tu código.</p>
        ${urlField()}
        <label class="field">Tu código personal<input type="text" data-code maxlength="40" placeholder="Ej. isai2580" autocomplete="off"><span class="tiny faint">Tu nombre y 4 números que recuerdes. Es tu llave: anótalo, sin él no podrás recuperar tu avance.</span></label>
        <label class="check"><input type="checkbox" data-ok><span class="small">${CONSENT}</span></label>
        <div class="small" data-msg></div></div>`,
      actions: [{ label: 'Cancelar', cls: 'ghost' }, {
        label: 'Activar', cls: 'go', onClick: m => {
          const code = $('[data-code]', m.el).value.trim(), urlIn = $('[data-curl]', m.el), msg = $('[data-msg]', m.el);
          const endpoint = urlIn ? urlIn.value.trim() : E.cloud.url();
          if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(endpoint) && !E.cloud.embeddedUrl()) { msg.innerHTML = '<span class="tag bad">Pega el enlace del servicio (empieza con https://script.google.com/…)</span>'; return false; }
          if (code.length < 6) { msg.innerHTML = '<span class="tag bad">El código debe tener al menos 6 caracteres</span>'; return false; }
          if (!$('[data-ok]', m.el).checked) { msg.innerHTML = '<span class="tag bad">Necesitas aceptar para activar el respaldo</span>'; return false; }
          msg.innerHTML = '<span class="muted">Conectando…</span>';
          E.cloud.enable(code, urlIn ? endpoint : null).then(async remote => {
            m.close();
            const d = remote.found ? E.cloud.describe(remote.data) : null;
            if (d && (d.sessions > 0 || d.week > 1)) {
              const restore = await E.ui.confirmDialog(`Encontramos un avance guardado con este código: <b>${esc(d.name)}</b>, semana ${d.week}, ${d.sessions} sesiones. ¿Quieres recuperarlo en este dispositivo? Si eliges "Conservar el de aquí", el de la nube se reemplazará con el de este dispositivo.`, { okLabel: 'Recuperar el de la nube', title: 'Avance encontrado' });
              if (restore) { await E.cloud.applyRemote(remote.data); E.ui.toast('Avance recuperado', 'ok'); location.hash = '#/hoy'; location.reload(); return; }
            }
            await E.cloud.push();
            E.ui.toast('Respaldo en la nube activado', 'ok');
            onDone && onDone();
          }).catch(err => { msg.innerHTML = `<span class="tag bad">No se pudo conectar: ${esc(err.message)}</span>`; });
          return false;
        }
      }]
    });
  };

  // Recuperar el avance en un dispositivo nuevo
  E.forms.cloudRestore = function () {
    E.ui.modal({
      title: 'Recuperar mi avance',
      body: `<div class="stack"><p class="muted small">Escribe el código personal con el que activaste tu respaldo.</p>${urlField()}
        <label class="field">Tu código personal<input type="text" data-code maxlength="40" autocomplete="off"></label><div class="small" data-msg></div></div>`,
      actions: [{ label: 'Cancelar', cls: 'ghost' }, {
        label: 'Recuperar', cls: 'go', onClick: m => {
          const code = $('[data-code]', m.el).value.trim(), urlIn = $('[data-curl]', m.el), msg = $('[data-msg]', m.el);
          const endpoint = urlIn ? urlIn.value.trim() : E.cloud.url();
          if (!endpoint) { msg.innerHTML = '<span class="tag bad">Falta el enlace del servicio</span>'; return false; }
          if (code.length < 6) { msg.innerHTML = '<span class="tag bad">Código demasiado corto</span>'; return false; }
          msg.innerHTML = '<span class="muted">Buscando…</span>';
          if (urlIn) E.cloud.setUrl(endpoint);
          E.cloud.load(code).then(async remote => {
            if (!remote.found) { msg.innerHTML = '<span class="tag bad">No hay avance guardado con ese código</span>'; return; }
            await E.cloud.applyRemote(remote.data);
            await E.cloud.enable(code);
            E.cloud.push();
            m.close();
            E.ui.toast('Avance recuperado', 'ok');
            location.hash = '#/hoy'; location.reload();
          }).catch(err => { msg.innerHTML = `<span class="tag bad">No se pudo conectar: ${esc(err.message)}</span>`; });
          return false;
        }
      }]
    });
  };

  // Enviar comentario (a la pestaña "Comentarios" de la hoja; si no hay hoja, compartir o copiar)
  E.forms.feedback = function (preType) {
    const st = E.store.get();
    const route = E.app.parse();
    const screen = route.name + (route.params.length ? '/' + route.params.join('/') : '');
    const device = E.cloud.summary().device + ' · ' + (navigator.userAgent.match(/(Edg|Chrome|Firefox|Safari)\/[\d.]+/) || [''])[0];
    let type = preType || 'Algo falló';
    const types = [['Algo falló', '🐞'], ['Duda', '❓'], ['Idea', '💡'], ['Me gustó', '❤️']];
    E.ui.modal({
      title: 'Enviar comentario',
      body: `<div class="stack"><p class="muted small">Tu opinión decide qué se mejora. Cuéntalo como se lo dirías a un amigo.</p>
        <div class="chips">${types.map(([t, i]) => `<button class="chip ${t === type ? 'on' : ''}" data-t="${t}">${i} ${t}</button>`).join('')}</div>
        <label class="field">Comentario<textarea data-msg rows="5" maxlength="2000" placeholder="Ej. En el diagnóstico, la prueba de pa-ta-ka se detuvo antes de tiempo…"></textarea></label>
        <label class="check on"><input type="checkbox" data-name checked><span class="small">Incluir mi nombre (${esc((st.profile || {}).name || '')})</span></label>
        <p class="tiny faint">Se envía también la pantalla donde estás (${esc(screen)}), tu semana y tu tipo de dispositivo, para entender el contexto. Nunca audios ni datos de tus grabaciones.</p>
        <div class="small" data-out></div></div>`,
      actions: [{ label: 'Cancelar', cls: 'ghost' }, {
        label: 'Enviar', cls: 'go', onClick: m => {
          const msg = $('[data-msg]', m.el).value.trim(), out = $('[data-out]', m.el);
          if (msg.length < 3) { out.innerHTML = '<span class="tag bad">Escribe tu comentario</span>'; return false; }
          const payload = { type, message: msg, name: $('[data-name]', m.el).checked ? (st.profile || {}).name : '', screen, week: st.program.week, device, version: E.VERSION };
          E.store.update(s => { s.feedback = (s.feedback || []).concat({ date: new Date().toISOString(), type, message: msg, sent: false }); });
          if (E.cloud.url()) {
            out.innerHTML = '<span class="muted">Enviando…</span>';
            E.cloud.feedback(payload).then(() => {
              E.store.update(s => { s.feedback[s.feedback.length - 1].sent = true; });
              m.close(); E.ui.toast('¡Gracias! Comentario enviado', 'ok');
            }).catch(err => { out.innerHTML = `<span class="tag bad">No se pudo enviar (${esc(err.message)}). Revisa tu conexión e inténtalo de nuevo.</span>`; });
          } else {
            const text = `Comentario EVCS (${type})\n${msg}\n— ${payload.name || 'Anónimo'} · pantalla ${screen} · semana ${payload.week} · ${device} · v${E.VERSION}`;
            m.close();
            if (navigator.share) navigator.share({ title: 'Comentario EVCS', text }).catch(() => {});
            else if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => E.ui.toast('Comentario copiado: pégalo en un mensaje a quien te compartió la app', 'ok'));
            else E.ui.modal({ title: 'Copia tu comentario', body: `<textarea rows="6" readonly style="width:100%">${esc(text)}</textarea>` });
          }
          return false;
        }
      }],
      onMount: m => $$('[data-t]', m).forEach(b => b.onclick = () => { type = b.dataset.t; $$('[data-t]', m).forEach(x => x.classList.toggle('on', x === b)); })
    });
  };

  function ago(iso) {
    if (!iso) return 'nunca';
    const min = Math.round((Date.now() - new Date(iso)) / 60000);
    if (min < 1) return 'hace un momento';
    if (min < 60) return `hace ${min} min`;
    const h = Math.round(min / 60);
    if (h < 24) return `hace ${h} h`;
    return fmt.date(iso);
  }

  function backupCard(box) {
    if (!box) return;
    const c = E.cloud.config(), persisted = E.cloud.persisted;
    box.innerHTML = `<div class="card-title">Respaldo de tu avance</div>
      <div class="row between small"><span>Protección del navegador</span><span class="tag ${persisted ? 'ok' : 'warn'}">${persisted ? 'Activa' : persisted === false ? 'No concedida' : 'Revisando…'}</span></div>
      <div class="row between small"><span>Último respaldo en archivo</span><b>${ago(E.cloud.lastBackup())}</b></div>
      <div class="row"><button class="btn sm" data-export>⬇ Descargar respaldo</button><label class="btn sm ghost" style="cursor:pointer">⬆ Restaurar archivo<input type="file" accept="application/json" data-import hidden></label></div>
      <hr style="border:0;border-top:1px solid var(--line);width:100%;margin:6px 0">
      <div class="row between"><b>☁️ Respaldo en la nube</b><span class="tag ${c.enabled ? (c.lastError ? 'warn' : 'ok') : ''}">${c.enabled ? (c.lastError ? 'Pendiente' : 'Activo') : 'Apagado'}</span></div>
      ${c.enabled ? `<div class="small muted">Código ${esc(c.hint || '')} · último respaldo ${ago(c.lastSync)}</div>
          ${c.lastError ? `<div class="callout warn small">No se pudo respaldar: ${esc(c.lastError)}. Se reintentará solo.</div>` : ''}
          <div class="row"><button class="btn sm info" data-sync>Respaldar ahora</button><button class="btn sm ghost" data-off>Desactivar</button></div>`
        : `<p class="small muted">Guarda tu avance en la nube con un código personal para no perderlo nunca.</p>
          <div class="row"><button class="btn sm info" data-on>Activar</button><button class="btn sm ghost" data-restore>Recuperar con mi código</button></div>`}
      <p class="tiny faint">Los respaldos incluyen métricas, sesiones, progreso y textos. Los audios y videos se quedan sólo en este dispositivo.</p>`;
    const redraw = () => backupCard(box);
    $('[data-export]', box).onclick = () => { E.cloud.downloadBackup(); E.ui.toast('Respaldo descargado', 'ok'); redraw(); };
    $('[data-import]', box).onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      if (!(await E.ui.confirmDialog('Restaurar reemplazará todos tus datos actuales con los del archivo (los audios de este dispositivo no se borran).', { okLabel: 'Restaurar' }))) return;
      try { await E.cloud.applyRemote(await f.text()); E.app.applyTheme(); E.ui.toast('Respaldo restaurado', 'ok'); E.cloud.schedule(2000); E.app.go('#/hoy'); }
      catch (err) { E.ui.toast(err.message, 'error'); }
    };
    const on = $('[data-on]', box); if (on) on.onclick = () => E.forms.cloudEnable(redraw);
    const rs = $('[data-restore]', box); if (rs) rs.onclick = () => E.forms.cloudRestore();
    const sy = $('[data-sync]', box); if (sy) sy.onclick = async () => { sy.disabled = true; const ok = await E.cloud.push(); E.ui.toast(ok ? 'Respaldado en la nube' : 'No se pudo respaldar ahora', ok ? 'ok' : 'error'); redraw(); };
    const off = $('[data-off]', box); if (off) off.onclick = async () => { if (await E.ui.confirmDialog('Dejarás de respaldar en la nube desde este dispositivo. Lo ya guardado se conserva.', { okLabel: 'Desactivar' })) { E.cloud.disable(); redraw(); } };
    if (persisted === null) setTimeout(redraw, 800);
  }

  E.views.perfil = {
    render(el) {
      const st = E.store.get(), p = st.profile;
      E.app.setTitle(`<div class="eyebrow">Configuración</div><h1 class="display" style="margin-top:6px">Perfil</h1>`);
      const draft = Object.assign({}, p);
      el.innerHTML = `
        <div class="grid grid-2">
          <div class="card raised stack">
            <div class="card-title">Tus datos</div>
            <label class="field">Nombre<input type="text" data-name value="${esc(p.name)}" maxlength="40"></label>
            <div><div class="small" style="font-weight:800">Objetivo</div><div class="chips" style="margin-top:8px">${E.data.GOALS.map(g => `<button class="chip ${g === p.goal ? 'on' : ''}" data-goal="${g}">${g}</button>`).join('')}</div></div>
            <div><div class="small" style="font-weight:800">Tiempo diario por defecto</div><div class="chips" style="margin-top:8px">${[5, 15, 30, 60, 90].map(m => `<button class="chip ${m === p.minutes ? 'on' : ''}" data-min="${m}">${m} min</button>`).join('')}</div></div>
            <div><div class="small" style="font-weight:800">Normas de referencia de voz</div><div class="chips" style="margin-top:8px">${[['f', 'Femenina'], ['m', 'Masculina'], ['na', 'Sin especificar']].map(([k, t]) => `<button class="chip ${k === p.sex ? 'on' : ''}" data-sex="${k}">${t}</button>`).join('')}</div></div>
            <div><div class="small" style="font-weight:800">Tema</div><div class="chips" style="margin-top:8px"><button class="chip ${p.theme !== 'light' ? 'on' : ''}" data-theme="dark">🌙 Oscuro</button><button class="chip ${p.theme === 'light' ? 'on' : ''}" data-theme="light">☀️ Claro</button></div></div>
            <div><div class="small" style="font-weight:800">Horarios de tus bloques</div>
              <div class="grid grid-3" style="margin-top:8px;gap:10px">${[['morning', 'Mañana'], ['midday', 'Mediodía'], ['night', 'Noche']].map(([k, t]) => `<label class="field"><span class="small muted">${t}</span><input type="time" data-time="${k}" value="${(p.schedule || {})[k] || { morning: '07:30', midday: '13:00', night: '20:30' }[k]}"></label>`).join('')}</div></div>
            <button class="btn primary" data-save>Guardar cambios</button>
            <div class="callout info small"><b>Recordatorios en tu teléfono.</b> Descarga el archivo y ábrelo: agrega a tu calendario (Google, iPhone u Outlook) tus 3 bloques diarios y la revisión del domingo, con aviso.
              <div class="mt"><button class="btn sm info" data-ics>📅 Descargar recordatorios</button></div></div>
          </div>
          <div class="stack">
            <div class="card stack">
              <div class="card-title">Ayuda y comentarios</div>
              <div class="row"><button class="btn sm info" data-fb>💬 Enviar comentario</button><button class="btn sm ghost" data-install>📲 Instalar app</button>${p.firstStepsDismissed ? '<button class="btn sm ghost" data-steps>Ver primeros pasos</button>' : ''}</div>
              <p class="tiny faint">Versión ${E.VERSION}${E.app.isStandalone() ? ' · app instalada' : ''}</p>
            </div>
            <div class="card stack">
              <div class="card-title">Salud vocal</div>
              <div class="row between"><span class="small">Último chequeo: ${st.health ? fmt.date(st.health.date) : '—'}</span><span class="tag ${st.health && st.health.result === 'caution' ? 'warn' : 'ok'}">${st.health && st.health.result === 'caution' ? 'Precaución' : 'Sin alarmas'}</span></div>
              <label class="check ${p.gentle ? 'on' : ''}"><input type="checkbox" data-gentle ${p.gentle ? 'checked' : ''}><span>Modo suave<br><span class="small muted">Sesiones de 5 minutos sin potencia ni proyección.</span></span></label>
              <button class="btn ghost" data-health>Repetir chequeo</button>
              <p class="tiny faint">Consulta a un otorrinolaringólogo o foniatra si tienes ronquera más de 2–3 semanas, dolor al hablar o tragar, pérdida de voz repetida o dificultad para respirar. EVCS es entrenamiento, no terapia.</p>
            </div>
            <div class="card stack" data-backup-card></div>
            <div class="card stack">
              <div class="card-title">Tus datos en este navegador</div>
              <p class="small muted">${st.recordings.length} grabaciones · ${st.sessions.length} sesiones · ${st.assessments.filter(a => a.status === 'completed').length} evaluaciones</p>
              <p class="small muted" data-usage>Calculando espacio…</p>
              <button class="btn danger sm" data-reset>Borrar todo</button>
            </div>
            <div class="card stack">
              <div class="card-title">Compatibilidad</div>
              <div class="row between small"><span>Grabación de audio</span><span class="tag ${E.audio.canRecord() ? 'ok' : 'bad'}">${E.audio.canRecord() ? 'Disponible' : 'No disponible'}</span></div>
              <div class="row between small"><span>Reconocimiento de voz (transcripción)</span><span class="tag ${E.audio.srAvailable() ? 'ok' : 'warn'}">${E.audio.srAvailable() ? 'Disponible' : 'No disponible'}</span></div>
              <div class="row between small"><span>Contexto seguro (micrófono)</span><span class="tag ${window.isSecureContext ? 'ok' : 'bad'}">${window.isSecureContext ? 'Sí' : 'No: usa localhost'}</span></div>
              <p class="tiny faint">El análisis acústico ocurre en tu equipo. El reconocimiento de voz del navegador (Chrome, Edge) puede enviar audio a los servidores de su proveedor para transcribir.</p>
            </div>
          </div>
        </div>`;

      const pick = (sel, key, num) => $$(sel, el).forEach(b => b.onclick = () => { draft[key] = num ? +b.dataset[Object.keys(b.dataset)[0]] : b.dataset[Object.keys(b.dataset)[0]]; $$(sel, el).forEach(x => x.classList.toggle('on', x === b)); });
      pick('[data-goal]', 'goal'); pick('[data-min]', 'minutes', true); pick('[data-sex]', 'sex'); pick('[data-theme]', 'theme');
      $('[data-save]', el).onclick = () => {
        draft.name = $('[data-name]', el).value.trim() || p.name;
        draft.schedule = {}; $$('[data-time]', el).forEach(i => { draft.schedule[i.dataset.time] = i.value; });
        E.store.update(s => { s.profile = Object.assign(s.profile, draft); });
        E.app.applyTheme(); E.ui.toast('Perfil guardado', 'ok'); E.app.render();
      };
      $('[data-gentle]', el).onchange = e => { E.store.update(s => { s.profile.gentle = e.target.checked; }); e.target.closest('.check').classList.toggle('on', e.target.checked); E.ui.toast(e.target.checked ? 'Modo suave activado' : 'Modo suave desactivado'); };
      $('[data-health]', el).onclick = () => healthCheck(() => E.app.render());
      $('[data-ics]', el).onclick = () => {
        const sched = {}; $$('[data-time]', el).forEach(i => { sched[i.dataset.time] = i.value; });
        E.store.update(s => { s.profile.schedule = sched; });
        const blob = new Blob([calendarFile(sched)], { type: 'text/calendar' });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'EVCS-recordatorios.ics';
        document.body.appendChild(a); a.click(); a.remove();
        E.ui.toast('Abre el archivo descargado para agregarlo a tu calendario', 'ok');
      };
      backupCard($('[data-backup-card]', el));
      $('[data-fb]', el).onclick = () => E.forms.feedback();
      $('[data-install]', el).onclick = () => E.app.showInstall();
      const stp = $('[data-steps]', el); if (stp) stp.onclick = () => { E.store.update(s => { s.profile.firstStepsDismissed = false; }); E.app.go('#/hoy'); };
      $('[data-reset]', el).onclick = async () => {
        if (!(await E.ui.confirmDialog('Se borrarán tu perfil, progreso, evaluaciones y todos los audios de este navegador.', { okLabel: 'Sí, borrar todo', danger: true }))) return;
        if (!(await E.ui.confirmDialog('Última confirmación: esta acción no se puede deshacer.', { okLabel: 'Borrar definitivamente', danger: true }))) return;
        await E.store.resetAll();
        location.hash = '#/bienvenida';
        location.reload();
      };
      E.store.audio.usage().then(u => {
        const box = $('[data-usage]', el);
        if (box) box.textContent = u ? `Espacio usado: ${(u.used / 1048576).toFixed(1)} MB de ${(u.quota / 1073741824).toFixed(1)} GB disponibles` : '';
      }).catch(() => {});
    }
  };
})(window.EVCS);

</script>
  <script>/* js/app.js */
/* EVCS Web · Arranque y enrutador
 * Rutas por hash: #/hoy, #/diagnostico, #/resultado/:id, #/plan, #/semana/:n, #/compuerta/:n,
 * #/biblioteca, #/sesion, #/grabaciones, #/comparar?a=&b=, #/progreso, #/perfil, #/bienvenida
 */
(function (E) {
  'use strict';
  const { esc } = E.ui;

  const NAV = [
    { route: 'hoy', icon: '🏠', label: 'Hoy' },
    { route: 'plan', icon: '🗺️', label: 'Plan' },
    { route: 'biblioteca', icon: '📚', label: 'Entrenar' },
    { route: 'diccion', icon: '🗣️', label: 'Dicción' },
    { route: 'escenario', icon: '🎤', label: 'Escenario' },
    { route: 'grabaciones', icon: '🎙️', label: 'Grabaciones', short: 'Audios' },
    { route: 'progreso', icon: '📈', label: 'Progreso' },
    { route: 'perfil', icon: '👤', label: 'Perfil', desktopOnly: true }
  ];
  const NAV_PARENT = { sesion: 'hoy', diagnostico: 'hoy', resultado: 'progreso', semana: 'plan', compuerta: 'plan', comparar: 'grabaciones' };
  const FULLSCREEN = new Set(['bienvenida']);

  let cleanup = null;

  function parse() {
    const raw = (location.hash || '#/hoy').slice(2);
    const [path, qs] = raw.split('?');
    const parts = path.split('/').filter(Boolean);
    const query = {};
    (qs || '').split('&').filter(Boolean).forEach(kv => { const [k, v] = kv.split('='); query[decodeURIComponent(k)] = decodeURIComponent(v || ''); });
    return { name: parts[0] || 'hoy', params: parts.slice(1), query };
  }

  function applyTheme() {
    const p = E.store.get().profile;
    document.documentElement.dataset.theme = p && p.theme === 'light' ? 'light' : 'dark';
  }

  function shellHtml(active) {
    const link = (n, short) => `<a class="nav-link ${n.route === active ? 'active' : ''}" href="#/${n.route}"><span class="nav-ico">${n.icon}</span><span>${short && n.short ? n.short : n.label}</span></a>`;
    const navLinks = NAV.map(n => link(n, false)).join('');
    const bottomLinks = NAV.filter(n => !n.desktopOnly).map(n => link(n, true)).join('');
    return `<div class="app">
      <aside class="sidebar">
        <div class="brand"><div class="brand-mark">E</div><div><div class="brand-name">EVCS</div><div class="brand-sub">Elite Vocal Communication</div></div></div>
        ${navLinks}
        <div class="sidebar-foot" data-side-foot></div>
      </aside>
      <main class="main"><div class="container">
        <div class="topbar"><div data-title></div><div class="stats-pills" data-pills></div></div>
        <div id="view"></div>
      </div></main>
      <nav class="bottom-nav">${bottomLinks}</nav>
    </div>`;
  }

  function refreshChrome() {
    const pills = document.querySelector('[data-pills]');
    if (!pills) return;
    const st = E.game.streak(), lv = E.game.level();
    pills.innerHTML = `<span class="pill fire" title="Racha de días">🔥 ${st.current}</span>
      <span class="pill gem" title="Experiencia total">💎 ${E.ui.fmt.num(lv.xp)}</span>
      <span class="pill crown" title="Nivel ${lv.level} · ${esc(lv.name)}">👑 ${lv.level}<span class="pill-text"> · ${esc(lv.name)}</span></span>
      <button class="pill" data-feedback title="Enviar comentario" style="cursor:pointer">💬</button>
      <a class="pill mobile-only" href="#/perfil" title="Perfil">👤</a>`;
    const fb = pills.querySelector('[data-feedback]'); if (fb) fb.onclick = () => E.forms.feedback();
    const foot = document.querySelector('[data-side-foot]');
    if (foot) {
      const week = E.store.get().program.week;
      const W = E.data.WEEKS[week - 1];
      foot.innerHTML = `<div class="eyebrow">Semana ${week} de 13</div><div style="font-weight:900;margin:4px 0 10px">${esc(W.title)}</div>
        <div class="bar thin accent"><span style="width:${Math.round(week / 13 * 100)}%"></span></div>`;
    }
  }

  function setTitle(html) {
    const t = document.querySelector('[data-title]');
    if (t) t.innerHTML = html || '';
  }

  function render() {
    const route = parse();
    const st = E.store.get();
    if (!st.profile && route.name !== 'bienvenida') { location.hash = '#/bienvenida'; return; }
    if (cleanup) { try { cleanup(); } catch (e) { console.error(e); } cleanup = null; }
    const root = document.getElementById('app');
    const view = E.views[route.name] || E.views.hoy;
    if (FULLSCREEN.has(route.name)) {
      root.innerHTML = '<div id="view"></div>';
    } else {
      const active = NAV_PARENT[route.name] || route.name;
      if (!document.querySelector('.app') || root.dataset.active !== active) {
        root.innerHTML = shellHtml(active);
        root.dataset.active = active;
      }
      refreshChrome();
      setTitle('');
    }
    const el = document.getElementById('view');
    el.innerHTML = '';
    window.scrollTo(0, 0);
    try {
      cleanup = view.render(el, route) || null;
    } catch (err) {
      console.error(err);
      el.innerHTML = `<div class="card"><div class="callout err"><b>Algo falló al mostrar esta pantalla.</b><br><span class="small">${esc(err.message)}</span></div></div>`;
    }
  }

  function go(hash) {
    if (location.hash === hash) render(); else location.hash = hash;
  }

  // Notifica XP e insignias nuevas tras una acción
  function rewards({ xp = 0, title, text, icon } = {}) {
    const badges = E.game.checkBadges();
    if (title || badges.length) {
      E.ui.celebrate({ icon: icon || (badges[0] ? badges[0].icon : '🎉'), title: title || '¡Nueva insignia!', text, xp, badges });
    } else if (xp > 0) {
      E.ui.toast(`+${xp} XP`, 'xp');
    }
    refreshChrome();
  }

  // ---------- instalación ----------
  let installEvent = null;
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvent = e; document.dispatchEvent(new CustomEvent('evcs:installable')); });
  window.addEventListener('appinstalled', () => { installEvent = null; E.ui.toast('¡EVCS instalada en tu pantalla de inicio!', 'ok'); });
  const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  const platform = () => /iPhone|iPad|iPod/.test(navigator.userAgent) ? 'ios' : /Android/.test(navigator.userAgent) ? 'android' : 'desktop';

  function showInstall() {
    if (isStandalone()) { E.ui.toast('Ya estás usando la app instalada', 'ok'); return; }
    if (installEvent) {
      installEvent.prompt();
      installEvent.userChoice.then(() => { installEvent = null; });
      return;
    }
    const p = platform();
    const steps = p === 'ios'
      ? ['Abre esta página en <b>Safari</b> (no funciona desde otros navegadores en iPhone).', 'Toca el botón <b>Compartir</b> (cuadro con flecha hacia arriba).', 'Elige <b>Agregar a pantalla de inicio</b> y luego <b>Agregar</b>.', 'Abre EVCS desde el ícono naranja: se verá a pantalla completa.']
      : p === 'android'
        ? ['Abre esta página en <b>Chrome</b>.', 'Toca el menú <b>⋮</b> arriba a la derecha.', 'Elige <b>Instalar app</b> o <b>Agregar a pantalla de inicio</b>.', 'Abre EVCS desde el ícono naranja.']
        : ['En Chrome o Edge, busca el ícono de <b>instalar</b> (una pantalla con flecha) al final de la barra de direcciones.', 'También está en el menú <b>⋮ → Instalar EVCS</b>.', 'Para entrenar a diario, lo ideal es instalarla en tu teléfono.'];
    E.ui.modal({
      title: 'Instala EVCS',
      body: `<div class="stack"><p class="muted small">Al instalarla tendrá su propio ícono, se abrirá a pantalla completa y tu avance queda mejor protegido.</p>
        <ol class="steps-list">${steps.map(s => `<li><span>${s}</span></li>`).join('')}</ol>
        ${location.protocol.indexOf('http') !== 0 ? '<div class="callout warn small">Estás abriendo el archivo directamente. Para instalarla, ábrela desde su enlace publicado (por ejemplo, en GitHub Pages).</div>' : ''}</div>`,
      actions: [{ label: 'Entendido', cls: 'primary', onClick: () => { E.store.update(s => { s.profile.installSeen = true; }); } }]
    });
  }

  function registerSW() {
    if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
      navigator.serviceWorker.register('sw.js').catch(err => console.warn('Sin modo sin conexión:', err.message));
    }
  }

  function init() {
    E.store.load();
    applyTheme();
    if (E.cloud) E.cloud.init();
    registerSW();
    window.addEventListener('hashchange', render);
    document.addEventListener('evcs:state', refreshChrome);
    document.addEventListener('click', e => {
      const h = e.target.closest('[data-help]');
      if (h) { e.preventDefault(); e.stopPropagation(); E.ui.showHelp(h.dataset.help); }
    }, true);
    render();
  }

  E.VERSION = '1.5.0';
  E.app = { go, render, refreshChrome, setTitle, applyTheme, rewards, parse, showInstall, isStandalone, platform, canPrompt: () => !!installEvent };
  document.addEventListener('DOMContentLoaded', init);
})(window.EVCS);

</script>
