/* EVCS Web · Estilos
 * Dirección visual: editorial y nocturna (MasterClass), cálida (Headspace) y táctil (Duolingo).
 */

:root {
  --bg: #0E0D12;
  --bg-glow: radial-gradient(1200px 600px at 85% -10%, rgba(255, 138, 61, .10), transparent 60%), radial-gradient(900px 500px at -10% 110%, rgba(162, 111, 214, .10), transparent 60%);
  --surface: #17151D;
  --surface-2: #201D28;
  --surface-3: #2A2633;
  --line: #2F2A38;
  --text: #F6F1EA;
  --muted: #A49DB0;
  --faint: #6F6879;
  --accent: #FF8A3D;
  --accent-ink: #2A1205;
  --accent-shadow: #C9621F;
  --gold: #FFC145;
  --green: #58CC02;
  --green-shadow: #3F9A00;
  --blue: #1CB0F6;
  --blue-shadow: #1185BC;
  --red: #FF4B4B;
  --red-shadow: #C73434;
  --purple: #A26FD6;
  --radius: 22px;
  --radius-sm: 14px;
  --shadow: 0 18px 50px rgba(0, 0, 0, .35);
  --font-ui: 'Nunito', ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-display: 'Fraunces', 'Iowan Old Style', Georgia, serif;
  --sidebar: 248px;
  color-scheme: dark;
}

:root[data-theme="light"] {
  --bg: #FBF6EF;
  --bg-glow: radial-gradient(1200px 600px at 85% -10%, rgba(255, 138, 61, .16), transparent 60%), radial-gradient(900px 500px at -10% 110%, rgba(162, 111, 214, .12), transparent 60%);
  --surface: #FFFFFF;
  --surface-2: #F6EFE6;
  --surface-3: #EDE4D8;
  --line: #E7DDD0;
  --text: #1F1B24;
  --muted: #6D6576;
  --faint: #A59DAE;
  --shadow: 0 18px 40px rgba(60, 40, 20, .10);
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg-glow), var(--bg);
  background-attachment: fixed;
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
img, svg { max-width: 100%; }
a { color: var(--accent); text-decoration: none; }
button { font-family: inherit; }
h1, h2, h3, h4 { margin: 0; line-height: 1.15; }
.display { font-family: var(--font-display); font-weight: 600; letter-spacing: -.01em; }
h1.display { font-size: clamp(28px, 4vw, 40px); }
h2.display { font-size: clamp(22px, 3vw, 28px); }
p { margin: 0; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
.center { text-align: center; }
.nowrap { white-space: nowrap; }
.hidden { display: none !important; }
.eyebrow { text-transform: uppercase; letter-spacing: .14em; font-size: 12px; font-weight: 800; color: var(--accent); }

/* ---------- Layout ---------- */
.app { display: flex; min-height: 100vh; }
.sidebar {
  width: var(--sidebar); flex: 0 0 var(--sidebar); position: sticky; top: 0; height: 100vh;
  padding: 28px 18px; display: flex; flex-direction: column; gap: 6px;
  border-right: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 70%, transparent);
  backdrop-filter: blur(10px);
}
.brand { display: flex; align-items: center; gap: 12px; padding: 0 10px 22px; }
.brand-mark {
  width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center;
  background: linear-gradient(135deg, var(--accent), var(--gold)); color: var(--accent-ink);
  font-family: var(--font-display); font-weight: 700; font-size: 20px; box-shadow: 0 4px 0 var(--accent-shadow);
}
.brand-name { font-family: var(--font-display); font-size: 22px; font-weight: 600; }
.brand-sub { font-size: 11px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
.nav-link {
  display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 14px;
  color: var(--muted); font-weight: 800; font-size: 15px; border: 2px solid transparent; transition: .15s;
}
.nav-link:hover { background: var(--surface-2); color: var(--text); }
.nav-link.active { color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
.nav-ico { width: 26px; text-align: center; font-size: 20px; }
.sidebar-foot { margin-top: auto; padding: 14px; border-radius: 16px; background: var(--surface-2); }

.main { flex: 1; min-width: 0; padding: 32px clamp(16px, 4vw, 48px) 120px; }
.container { max-width: 1120px; margin: 0 auto; }

.topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 26px; flex-wrap: wrap; }
.stats-pills { display: flex; gap: 10px; flex-wrap: wrap; }
.pill {
  display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px;
  background: var(--surface); border: 2px solid var(--line); font-weight: 800; font-size: 14px; white-space: nowrap;
}
.pill.fire { color: var(--accent); }
.pill.gem { color: var(--blue); }
.pill.crown { color: var(--gold); }

.bottom-nav { display: none; }

@media (max-width: 860px) {
  .sidebar { display: none; }
  .main { padding: 20px 16px 110px; }
  .bottom-nav {
    display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; justify-content: space-around;
    background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(12px);
    border-top: 1px solid var(--line); padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
  }
  .bottom-nav .nav-link { flex-direction: column; gap: 2px; padding: 6px 4px; font-size: 11px; border: 0; }
  .bottom-nav .nav-link.active { background: transparent; }
  .bottom-nav .nav-ico { font-size: 22px; }
}

/* ---------- Grid y tarjetas ---------- */
.grid { display: grid; gap: 18px; }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.span-2 { grid-column: span 2; }
@media (max-width: 1000px) { .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 640px) { .grid-2, .grid-3, .grid-4 { grid-template-columns: minmax(0, 1fr); } .span-2 { grid-column: auto; } }

.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 22px; position: relative;
}
.card.flat { box-shadow: none; }
.card.raised { box-shadow: var(--shadow); }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.card-title { font-weight: 900; font-size: 17px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.gap-lg { gap: 22px; }
.mt { margin-top: 18px; }
.mt-lg { margin-top: 30px; }
.section-title { display: flex; align-items: baseline; justify-content: space-between; margin: 34px 0 14px; gap: 12px; }

.hero {
  border-radius: 30px; padding: clamp(22px, 4vw, 36px); position: relative; overflow: hidden;
  background: linear-gradient(135deg, #2B1B12 0%, #3A2216 45%, #2A1D33 100%);
  border: 1px solid rgba(255, 138, 61, .25); color: #FFF6EC;
}
:root[data-theme="light"] .hero { background: linear-gradient(135deg, #FFE3CC 0%, #FFD3B0 50%, #EBD9F7 100%); color: #2A1205; border-color: rgba(255, 138, 61, .35); }
.hero::after {
  content: ''; position: absolute; width: 380px; height: 380px; right: -120px; top: -140px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 193, 69, .35), transparent 65%); pointer-events: none;
}
.hero .muted { color: color-mix(in srgb, currentColor 70%, transparent); }
.hero-inner { position: relative; z-index: 1; }

/* ---------- Botones estilo Duolingo ---------- */
.btn {
  --b: var(--surface-2); --bs: var(--line); --bt: var(--text);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 13px 22px; border-radius: 16px; border: 2px solid var(--bs); background: var(--b); color: var(--bt);
  font-weight: 900; font-size: 15px; letter-spacing: .04em; text-transform: uppercase; cursor: pointer;
  box-shadow: 0 4px 0 var(--bs); transition: transform .08s, box-shadow .08s, filter .15s; user-select: none;
}
.btn:hover { filter: brightness(1.06); }
.btn:active { transform: translateY(4px); box-shadow: 0 0 0 var(--bs); }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: 0 4px 0 var(--bs); }
.btn.primary { --b: var(--accent); --bs: var(--accent-shadow); --bt: var(--accent-ink); }
.btn.go { --b: var(--green); --bs: var(--green-shadow); --bt: #fff; }
.btn.info { --b: var(--blue); --bs: var(--blue-shadow); --bt: #fff; }
.btn.danger { --b: var(--red); --bs: var(--red-shadow); --bt: #fff; }
.btn.ghost { --b: transparent; --bs: var(--line); }
.btn.big { padding: 17px 28px; font-size: 17px; border-radius: 18px; }
.btn.block { width: 100%; }
.btn.sm { padding: 8px 14px; font-size: 12px; border-radius: 12px; box-shadow: 0 3px 0 var(--bs); }
.btn.icon { padding: 10px; width: 46px; height: 46px; }
.link-btn { background: none; border: 0; color: var(--accent); font-weight: 800; cursor: pointer; padding: 0; font-size: inherit; }

/* chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  padding: 8px 14px; border-radius: 999px; border: 2px solid var(--line); background: var(--surface);
  color: var(--text); font-weight: 800; font-size: 14px; cursor: pointer; transition: .12s;
}
.chip:hover { border-color: var(--faint); }
.chip.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
.chip.sm { padding: 5px 10px; font-size: 12px; }
.fatigue .chip { width: 42px; padding: 8px 0; text-align: center; }
.fatigue .chip.warn.on { border-color: var(--red); color: var(--red); background: color-mix(in srgb, var(--red) 14%, transparent); }

.tag { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; background: var(--surface-2); color: var(--muted); }
.tag.ok { background: color-mix(in srgb, var(--green) 18%, transparent); color: var(--green); }
.tag.warn { background: color-mix(in srgb, var(--gold) 18%, transparent); color: var(--gold); }
.tag.bad { background: color-mix(in srgb, var(--red) 18%, transparent); color: var(--red); }
.tag.fam { color: #fff; }

/* barra de progreso */
.bar { height: 14px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
.bar > span { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--green), #89E219); box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .15); transition: width .4s; }
.bar.accent > span { background: linear-gradient(90deg, var(--accent), var(--gold)); }
.bar.thin { height: 8px; }

/* KPI */
.kpi { display: flex; flex-direction: column; gap: 4px; }
.kpi-value { font-family: var(--font-display); font-size: 34px; font-weight: 600; line-height: 1; }
.kpi-label { color: var(--muted); font-size: 13px; font-weight: 700; }
.delta.up { color: var(--green); }
.delta.down { color: var(--red); }

/* ---------- Formularios ---------- */
label.field { display: flex; flex-direction: column; gap: 6px; font-weight: 800; font-size: 14px; }
input[type="text"], input[type="number"], select, textarea {
  width: 100%; padding: 13px 14px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface-2);
  color: var(--text); font: inherit; font-weight: 600; outline: none;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); }
textarea { min-height: 90px; resize: vertical; }
input[type="range"] { width: 100%; accent-color: var(--accent); }
.check { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border: 2px solid var(--line); border-radius: 14px; cursor: pointer; font-weight: 700; }
.check input { width: 20px; height: 20px; accent-color: var(--green); margin-top: 2px; flex: none; }
.check.on { border-color: var(--green); }
.slider-row { display: grid; grid-template-columns: 140px 1fr 44px; align-items: center; gap: 12px; }
@media (max-width: 560px) { .slider-row { grid-template-columns: 1fr 44px; } .slider-row > :first-child { grid-column: span 2; } }

/* ---------- Ejercicios ---------- */
.ex-card { cursor: pointer; transition: transform .12s, border-color .12s; display: flex; flex-direction: column; gap: 10px; }
.ex-card:hover { transform: translateY(-3px); border-color: var(--faint); }
.ex-code { font-family: var(--font-display); font-weight: 700; font-size: 15px; width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; color: #fff; flex: none; box-shadow: 0 4px 0 rgba(0, 0, 0, .25); }
.ex-card .locked { position: absolute; top: 14px; right: 14px; font-size: 18px; opacity: .7; }
.steps-list { margin: 0; padding-left: 0; list-style: none; counter-reset: s; display: flex; flex-direction: column; gap: 10px; }
.steps-list li { counter-increment: s; display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; }
.steps-list li::before { content: counter(s); width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-3); font-weight: 900; font-size: 13px; }
.callout { padding: 14px 16px; border-radius: 16px; background: var(--surface-2); border-left: 4px solid var(--green); }
.callout.err { border-left-color: var(--red); }
.callout.warn { border-left-color: var(--gold); }
.callout.info { border-left-color: var(--blue); }

/* ---------- Plan ---------- */
.phase-track { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 860px) { .phase-track { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.phase-card { border-radius: 20px; padding: 18px; background: var(--surface); border: 2px solid var(--line); }
.phase-card.current { border-color: var(--accent); }
.phase-card.done { border-color: var(--green); }
.week-pills { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.week-pill {
  width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; cursor: pointer;
  background: var(--surface-3); color: var(--muted); border: 0; box-shadow: 0 4px 0 rgba(0, 0, 0, .25);
}
.week-pill.done { background: var(--green); color: #fff; box-shadow: 0 4px 0 var(--green-shadow); }
.week-pill.current { background: var(--accent); color: var(--accent-ink); box-shadow: 0 4px 0 var(--accent-shadow); animation: pulse 2s infinite; }
.week-pill.sel { outline: 3px solid var(--text); outline-offset: 2px; }
.week-pill.gate { border-radius: 12px; }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }

/* ---------- Sesión ---------- */
.player { display: grid; grid-template-columns: 1.2fr .8fr; gap: 22px; }
@media (max-width: 900px) { .player { grid-template-columns: 1fr; } }
.timer-ring { position: relative; width: 220px; height: 220px; margin: 0 auto; }
.timer-ring svg { transform: rotate(-90deg); }
.timer-ring .t { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
.timer-ring .t b { font-family: var(--font-display); font-size: 48px; font-weight: 600; display: block; line-height: 1; }
.queue { display: flex; flex-direction: column; gap: 8px; max-height: 460px; overflow: auto; }
.queue-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; border: 2px solid transparent; }
.queue-item.cur { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
.queue-item.done { opacity: .55; }
.queue-item .ex-code { width: 36px; height: 36px; font-size: 13px; border-radius: 11px; }
.session-progress { display: flex; gap: 4px; margin: 6px 0 22px; }
.session-progress span { flex: 1; height: 10px; border-radius: 999px; background: var(--surface-3); }
.session-progress span.done { background: var(--green); }
.session-progress span.cur { background: var(--accent); }

/* ---------- Grabadora ---------- */
.recorder { display: flex; flex-direction: column; gap: 16px; }
.rec-prompt { padding: 18px 20px; border-radius: 18px; background: var(--surface-2); font-size: 17px; line-height: 1.7; max-height: 280px; overflow: auto; }
.rec-prompt.reading { font-family: var(--font-display); font-size: 19px; }
.rec-stage { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 10px 0; }
.wave { width: 100%; height: 90px; border-radius: 16px; background: var(--surface-2); display: block; }
.rec-time { font-family: var(--font-display); font-size: 40px; font-weight: 600; font-variant-numeric: tabular-nums; }
.rec-btn {
  width: 96px; height: 96px; border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center;
  background: var(--red); box-shadow: 0 6px 0 var(--red-shadow); color: #fff; font-size: 34px; transition: transform .08s;
}
.rec-btn:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--red-shadow); }
.rec-btn.stop { background: var(--surface-3); box-shadow: 0 6px 0 #000; }
.rec-btn.stop::before { content: ''; width: 30px; height: 30px; border-radius: 8px; background: var(--red); }
.rec-btn.live { animation: livering 1.4s infinite; }
@keyframes livering { 0% { box-shadow: 0 6px 0 #000, 0 0 0 0 rgba(255, 75, 75, .55); } 100% { box-shadow: 0 6px 0 #000, 0 0 0 22px rgba(255, 75, 75, 0); } }
.countdown { font-family: var(--font-display); font-size: 88px; font-weight: 700; color: var(--accent); line-height: 1; }
.pace { position: relative; height: 10px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
.pace > span { position: absolute; left: 0; top: 0; bottom: 0; background: var(--blue); border-radius: 999px; }
.spinner { width: 46px; height: 46px; border-radius: 50%; border: 5px solid var(--surface-3); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.metric-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.metric { padding: 14px; border-radius: 16px; background: var(--surface-2); border: 2px solid transparent; }
.metric.focus { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--surface-2)); }
.metric .v { font-family: var(--font-display); font-size: 26px; font-weight: 600; line-height: 1.1; }
.metric .l { font-size: 12px; font-weight: 800; color: var(--muted); }
.metric .s { font-size: 12px; margin-top: 4px; }

/* ---------- Listas ---------- */
.list { display: flex; flex-direction: column; }
.list-item { display: flex; align-items: center; gap: 14px; padding: 14px 4px; border-bottom: 1px solid var(--line); }
.list-item:last-child { border-bottom: 0; }
.list-item .grow { flex: 1; min-width: 0; }
.avatar { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; font-size: 22px; background: var(--surface-2); flex: none; }
audio { width: 100%; height: 40px; }

/* ---------- Insignias ---------- */
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 12px; }
.badge { text-align: center; padding: 16px 10px; border-radius: 18px; background: var(--surface-2); border: 2px solid var(--line); }
.badge .b-ico { font-size: 34px; width: 64px; height: 64px; margin: 0 auto 8px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-3); }
.badge.on { border-color: var(--gold); }
.badge.on .b-ico { background: radial-gradient(circle, rgba(255, 193, 69, .45), rgba(255, 138, 61, .25)); }
.badge:not(.on) .b-ico { filter: grayscale(1); opacity: .45; }
.badge .b-name { font-weight: 900; font-size: 13px; }

/* ---------- Gráficas ---------- */
.chart { width: 100%; display: block; }
.chart .grid-line { stroke: var(--line); stroke-width: 1; }
.chart .axis-text { fill: var(--muted); font-size: 11px; font-family: var(--font-ui); font-weight: 700; }
.chart .band-text { fill: var(--faint); font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; font-weight: 700; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; margin-right: 6px; vertical-align: -1px; }
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 14px); gap: 4px; overflow-x: auto; padding-bottom: 4px; }
.heat span { width: 14px; height: 14px; border-radius: 4px; background: var(--surface-3); }
.heat span.l1 { background: color-mix(in srgb, var(--green) 35%, var(--surface-3)); }
.heat span.l2 { background: color-mix(in srgb, var(--green) 65%, var(--surface-3)); }
.heat span.l3 { background: var(--green); }
.heat span.today { outline: 2px solid var(--accent); }

.ring { position: relative; display: inline-grid; place-items: center; }
.ring svg { transform: rotate(-90deg); }
.ring .ring-label { position: absolute; text-align: center; line-height: 1.05; }

/* ---------- Modal y toast ---------- */
.modal-back { position: fixed; inset: 0; background: rgba(5, 4, 8, .66); backdrop-filter: blur(6px); z-index: 80; display: grid; place-items: center; padding: 16px; animation: fade .15s; }
.modal { width: min(640px, 100%); max-height: 90vh; overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 26px; box-shadow: var(--shadow); padding: 24px; animation: pop .18s; }
.modal.wide { width: min(860px, 100%); }
.modal-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 22px; flex-wrap: wrap; }
.x-btn { background: var(--surface-2); border: 0; color: var(--text); width: 36px; height: 36px; border-radius: 12px; font-size: 18px; cursor: pointer; flex: none; }
@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { transform: translateY(14px) scale(.98); opacity: 0; } }
.toasts { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); z-index: 100; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast { padding: 12px 18px; border-radius: 14px; background: var(--surface-3); color: var(--text); font-weight: 800; box-shadow: var(--shadow); animation: pop .2s; max-width: 92vw; }
.toast.ok { background: var(--green); color: #fff; }
.toast.error { background: var(--red); color: #fff; }
.toast.xp { background: linear-gradient(135deg, var(--accent), var(--gold)); color: var(--accent-ink); }

.celebrate { text-align: center; position: relative; overflow: hidden; }
.celebrate .big-ico { font-size: 72px; animation: bounce .8s ease; display: block; }
@keyframes bounce { 0% { transform: scale(.3); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
.confetti { position: absolute; inset: 0; pointer-events: none; }
.confetti i { position: absolute; top: -10px; width: 8px; height: 14px; border-radius: 2px; animation: drop 1.6s ease-in forwards; }
@keyframes drop { to { transform: translateY(420px) rotate(540deg); opacity: 0; } }

/* ---------- Onboarding ---------- */
.onb { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
.onb-card { width: min(620px, 100%); }
.onb-dots { display: flex; gap: 6px; justify-content: center; margin-bottom: 22px; }
.onb-dots span { width: 34px; height: 8px; border-radius: 999px; background: var(--surface-3); }
.onb-dots span.on { background: var(--accent); }
.option-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.option {
  padding: 16px; border-radius: 18px; border: 2px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 900;
  box-shadow: 0 4px 0 var(--line); text-align: left; color: var(--text); font-size: 15px;
}
.option.on { border-color: var(--blue); background: color-mix(in srgb, var(--blue) 12%, var(--surface)); box-shadow: 0 4px 0 var(--blue-shadow); }
.option small { display: block; font-weight: 700; color: var(--muted); margin-top: 4px; }

.empty { text-align: center; padding: 34px 16px; color: var(--muted); }
.empty .e-ico { font-size: 42px; display: block; margin-bottom: 8px; }

.dim-row { display: grid; grid-template-columns: 120px 1fr 48px; gap: 12px; align-items: center; padding: 6px 0; }
.dim-row .bar { height: 12px; }
.transcript { font-size: 14px; color: var(--muted); padding: 12px 14px; background: var(--surface-2); border-radius: 14px; max-height: 160px; overflow: auto; }
.transcript mark { background: color-mix(in srgb, var(--red) 30%, transparent); color: var(--text); border-radius: 4px; padding: 0 2px; }
table.cmp { width: 100%; border-collapse: collapse; font-size: 14px; }
table.cmp th, table.cmp td { padding: 10px 8px; border-bottom: 1px solid var(--line); text-align: right; }
table.cmp th:first-child, table.cmp td:first-child { text-align: left; }
table.cmp th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ---------- Modo Dicción ---------- */
.wchip.fail { border-color: var(--red); background: color-mix(in srgb, var(--red) 16%, transparent); color: var(--red); text-decoration: line-through; }
.diff { line-height: 2.1; }
.dw { display: inline-block; padding: 0 4px; border-radius: 6px; }
.dw.ok { color: var(--text); }
.dw.sub, .dw.miss { background: color-mix(in srgb, var(--red) 22%, transparent); color: var(--text); text-decoration: underline wavy var(--red); text-underline-offset: 4px; }
.dw small { display: block; font-family: var(--font-ui); font-size: 11px; line-height: 1.1; color: var(--red); text-align: center; text-decoration: none; }
.kw { color: var(--accent); }
.kw.miss { color: var(--red); text-decoration: underline wavy var(--red); text-underline-offset: 4px; }

/* ---------- Escenario ---------- */
.mobile-only { display: none; }
@media (max-width: 860px) { .mobile-only { display: inline-flex; } }
input[type="time"] { width: 100%; padding: 11px 12px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface-2); color: var(--text); font: inherit; font-weight: 700; }

/* ---------- App instalada (pantalla completa) ---------- */
@media (display-mode: standalone) {
  body { padding-top: env(safe-area-inset-top); }
  .sidebar { padding-top: calc(28px + env(safe-area-inset-top)); }
}

/* ---------- Ayuda ⓘ ---------- */
.help-i { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid currentColor; background: none; color: var(--faint);
  font: 800 11px/1 Georgia, serif; font-style: italic; cursor: pointer; padding: 0; margin-left: 4px; vertical-align: 1px; }
.help-i:hover { color: var(--accent); }

button.pill { color: var(--text); font-family: inherit; }

.chip.on { background: color-mix(in srgb, var(--accent) 24%, var(--surface)); }
@media (max-width: 860px) {
  .topbar { flex-direction: column-reverse; align-items: stretch; gap: 14px; }
  .stats-pills { flex-wrap: nowrap; gap: 6px; justify-content: flex-end; }
  .stats-pills .pill { padding: 6px 9px; font-size: 13px; }
  .pill-text { display: none; }
}

  <script>/* js/core/storage.js */
/* EVCS Web · Módulo de almacenamiento
 * Estado de la app en localStorage; audios en IndexedDB.
 */
(function (E) {
  'use strict';

  const KEY = 'evcs_state_v1';
  const DB_NAME = 'evcs-audio';
  const STORE = 'recordings';

  function emptyState() {
    return {
      version: 1,
      createdAt: new Date().toISOString(),
      profile: null,          // { name, goal, minutes, sex, theme, gentle }
      health: null,           // { answers, result, date }
      program: { week: 1, weekStartedAt: new Date().toISOString(), gates: {}, reviews: {}, completedAt: null },
      assessments: [],        // { id, kind, week, date, status, steps, selfRatings, scores, index, provisional }
      sessions: [],           // { id, date, day, block, minutes, soft, completed, items, pain, recId, note, fatigue }
      recordings: [],         // { id, date, day, kind, label, source, durationMs, metrics, transcript, hasAudio, textId }
      exposures: [],          // { id, date, day, situation, goal, nervesBefore, nervesAfter, result, learning }
      dailyLogs: {},          // day -> { fatigue, pain }
      xp: [],                 // { date, day, source, points, ref }
      badges: {},             // code -> date
      exerciseLog: {},        // code -> [day]
      activeSession: null,    // sesión en curso (para reanudar)
      diction: { sounds: {}, checks: [], sessions: [] },  // Modo Dicción
      practice: { presentations: [], qa: [], presence: [], blind: [] }  // Escenario
    };
  }

  let state = null;

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      state = raw ? migrate(JSON.parse(raw)) : emptyState();
    } catch (e) {
      console.warn('No se pudo leer el estado; se inicia uno nuevo.', e);
      state = emptyState();
    }
    return state;
  }

  function migrate(s) {
    const base = emptyState();
    for (const k of Object.keys(base)) if (s[k] === undefined) s[k] = base[k];
    s.program = Object.assign(base.program, s.program || {});
    s.diction = Object.assign(base.diction, s.diction || {});
    s.practice = Object.assign(base.practice, s.practice || {});
    return s;
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(state));
      return true;
    } catch (e) {
      console.error(e);
      E.ui && E.ui.toast('No se pudo guardar: el almacenamiento del navegador está lleno.', 'error');
      return false;
    }
  }

  function get() { return state || load(); }

  function update(fn) {
    fn(get());
    save();
    document.dispatchEvent(new CustomEvent('evcs:state'));
  }

  function uid() {
    if (crypto.randomUUID) return crypto.randomUUID();
    return 'id-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  }

  // Día local en formato AAAA-MM-DD
  function dayKey(d) {
    d = d ? new Date(d) : new Date();
    const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), dd = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${dd}`;
  }

  // ---------- IndexedDB para audio ----------
  let dbPromise = null;
  function db() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
      if (!('indexedDB' in window)) return reject(new Error('IndexedDB no disponible'));
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = () => req.result.createObjectStore(STORE);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    return dbPromise;
  }

  function tx(mode, fn) {
    return db().then(d => new Promise((resolve, reject) => {
      const t = d.transaction(STORE, mode);
      const store = t.objectStore(STORE);
      const req = fn(store);
      t.oncomplete = () => resolve(req && req.result);
      t.onerror = () => reject(t.error);
    }));
  }

  const audio = {
    put: (id, blob) => tx('readwrite', s => s.put(blob, id)),
    get: id => tx('readonly', s => s.get(id)),
    del: id => tx('readwrite', s => s.delete(id)),
    clear: () => tx('readwrite', s => s.clear()),
    usage: async () => {
      if (navigator.storage && navigator.storage.estimate) {
        const est = await navigator.storage.estimate();
        return { used: est.usage || 0, quota: est.quota || 0 };
      }
      return null;
    }
  };

  // ---------- Exportar / importar ----------
  function exportJSON() {
    return JSON.stringify(get(), null, 2);
  }

  function importJSON(text) {
    const parsed = JSON.parse(text);
    if (!parsed || parsed.version !== 1 || !Array.isArray(parsed.assessments)) {
      throw new Error('El archivo no es una copia de seguridad válida de EVCS.');
    }
    // Las grabaciones importadas no traen audio
    parsed.recordings.forEach(r => { r.hasAudio = false; });
    state = migrate(parsed);
    save();
  }

  async function resetAll() {
    localStorage.removeItem(KEY);
    try { await audio.clear(); } catch (e) { /* sin IndexedDB */ }
    state = emptyState();
    save();
  }

  E.store = { load, save, get, update, uid, dayKey, audio, exportJSON, importJSON, resetAll, emptyState };
})(window.EVCS);

</script>

 * - Reconocimiento de voz opcional (Web Speech API, es-MX)
 * - Análisis acústico 100% en el navegador: energía, pausas, tono (autocorrelación),
 *   cierres descendentes, fonación máxima, pa-ta-ka, muletillas, velocidad y precisión.
 * analyzeSamples() es una función pura para poder probarla fuera del navegador.
 */
(function (E) {
  'use strict';

  // ---------- utilidades numéricas ----------
  const pct = (arr, p) => {
    if (!arr.length) return NaN;
    const s = Array.from(arr).sort((a, b) => a - b);
    const i = Math.min(s.length - 1, Math.max(0, Math.round((p / 100) * (s.length - 1))));
    return s[i];
  };
  const mean = a => a.reduce((x, y) => x + y, 0) / (a.length || 1);
  const std = a => { if (a.length < 2) return 0; const m = mean(a); return Math.sqrt(a.reduce((s, v) => s + (v - m) * (v - m), 0) / (a.length - 1)); };
  const median = a => pct(a, 50);

  function resample(x, srIn, srOut) {
    if (srIn === srOut) return Float32Array.from(x);
    const ratio = srIn / srOut;
    if (Number.isInteger(ratio)) {
      // camino rápido: promedio por bloques (paso bajo + diezmado)
      const n = Math.floor(x.length / ratio), out = new Float32Array(n);
      for (let i = 0, o = 0; i < n; i++, o += ratio) {
        let s = 0;
        for (let k = 0; k < ratio; k++) s += x[o + k];
        out[i] = s / ratio;
      }
      return out;
    }
    // filtro paso bajo simple (media móvil) antes de diezmar
    const k = Math.max(1, Math.round(ratio));
    let src = x;
    if (k > 1) {
      src = new Float32Array(x.length);
      let acc = 0;
      for (let i = 0; i < x.length; i++) {
        acc += x[i];
        if (i >= k) acc -= x[i - k];
        src[i] = acc / Math.min(i + 1, k);
      }
    }
    const n = Math.floor((x.length - 1) / ratio);
    const out = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const p = i * ratio, i0 = p | 0, f = p - i0;
      const a = src[i0], b = src[i0 + 1];
      out[i] = a + (b - a) * f;
    }
    return out;
  }

  // ---------- texto ----------
  function normalizeText(t) {
    return (t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/[^a-zñ0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();
  }
  function tokenize(t) { const n = normalizeText(t); return n ? n.split(' ') : []; }

  const FILLER_WORDS = new Set(['eh', 'ehh', 'ehhh', 'ehm', 'em', 'emm', 'mm', 'mmm', 'hmm', 'mmmm', 'osea', 'digamos']);
  function countLexicalFillers(tokens) {
    let c = 0;
    for (let i = 0; i < tokens.length; i++) {
      if (FILLER_WORDS.has(tokens[i])) c++;
      else if (tokens[i] === 'o' && tokens[i + 1] === 'sea') { c++; i++; }
    }
    return c;
  }

  function mattr(tokens, w = 50) {
    if (tokens.length < 20) return null;
    if (tokens.length < w) return new Set(tokens).size / tokens.length;
    let sum = 0, count = 0;
    for (let i = 0; i + w <= tokens.length; i++) { sum += new Set(tokens.slice(i, i + w)).size / w; count++; }
    return sum / count;

  // Precisión = 1 - distancia de edición mínima entre lo dicho y cualquier prefijo del texto de referencia
  function wordAccuracy(hypText, refText) {
    const h = tokenize(hypText), r = tokenize(refText);
    if (!h.length || !r.length) return null;
    const n = h.length, m = r.length;
    let prev = new Array(m + 1);
    for (let j = 0; j <= m; j++) prev[j] = j;
    for (let i = 1; i <= n; i++) {
      const cur = new Array(m + 1);
      cur[0] = i;
      for (let j = 1; j <= m; j++) {
        const cost = h[i - 1] === r[j - 1] ? 0 : 1;
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + cost);
      }
      prev = cur;
    }
    let best = Infinity, bestJ = 1;
    for (let j = 1; j <= m; j++) {
      const rate = prev[j] / j;
      if (rate < best || (rate === best && j > bestJ)) { best = rate; bestJ = j; }
    }
    return { accuracy: Math.max(0, 100 * (1 - best)), refWords: bestJ, errors: prev[bestJ] };
  }

  /**
   * Alineación completa palabra por palabra entre el texto de referencia y lo transcrito.
   * Devuelve cada palabra de referencia con estado 'ok' | 'sub' (se oyó otra) | 'miss' (no se oyó).
   */
  function wordDiff(hypText, refText) {
    const refOrig = (refText || '').split(/\s+/).filter(w => normalizeText(w));
    const r = refOrig.map(w => normalizeText(w).replace(/\s+/g, ''));
    const h = tokenize(hypText);
    const n = r.length, m = h.length;
    const D = Array.from({ length: n + 1 }, (_, i) => { const row = new Array(m + 1).fill(0); row[0] = i; return row; });
    for (let j = 0; j <= m; j++) D[0][j] = j;
    for (let i = 1; i <= n; i++) for (let j = 1; j <= m; j++) {
      D[i][j] = Math.min(D[i - 1][j] + 1, D[i][j - 1] + 1, D[i - 1][j - 1] + (r[i - 1] === h[j - 1] ? 0 : 1));
    }
    const out = new Array(n);
    let i = n, j = m;
    while (i > 0) {
      if (j > 0 && D[i][j] === D[i - 1][j - 1] + (r[i - 1] === h[j - 1] ? 0 : 1)) {
        out[i - 1] = { word: refOrig[i - 1], status: r[i - 1] === h[j - 1] ? 'ok' : 'sub', heard: h[j - 1] }; i--; j--;
      } else if (D[i][j] === D[i - 1][j] + 1) {
        out[i - 1] = { word: refOrig[i - 1], status: 'miss', heard: '' }; i--;
      } else { j--; }
    }
    const ok = out.filter(x => x.status === 'ok').length;
    return { words: out, accuracy: n ? 100 * ok / n : null, extra: Math.max(0, m - (n - out.filter(x => x.status === 'miss').length)) };
  }

  // ---------- análisis acústico ----------
  const HOP = 0.01; // 10 ms

  function frameDb(x, sr) {
    const hop = Math.round(sr * HOP), win = Math.round(sr * 0.03);
    const n = Math.max(0, Math.floor((x.length - win) / hop) + 1);
    const db = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      let s = 0;
      const o = i * hop;
      for (let k = 0; k < win; k++) { const v = x[o + k]; s += v * v; }
      db[i] = 10 * Math.log10(s / win + 1e-12);
    }
    return db;
  }

  function buildMask(db) {
    const n = db.length;
    const noise = pct(db, 10), loud = pct(db, 90);
    const snr = loud - noise;
    const thr = Math.max(noise + 6, noise + 0.35 * snr);
    const mask = new Uint8Array(n);
    if (loud < -65 || snr < 6) return { mask, noise, loud, snr, thr };
    for (let i = 0; i < n; i++) mask[i] = db[i] > thr ? 1 : 0;
    // rellenar huecos < 80 ms
    let i = 0;
    while (i < n) {
      if (!mask[i]) {
        let j = i; while (j < n && !mask[j]) j++;
        if (i > 0 && j < n && j - i < 8) for (let k = i; k < j; k++) mask[k] = 1;
        i = j;
      } else i++;
    }
    // quitar islas < 50 ms
    i = 0;
    while (i < n) {
      if (mask[i]) {
        let j = i; while (j < n && mask[j]) j++;
        if (j - i < 5) for (let k = i; k < j; k++) mask[k] = 0;
        i = j;
      } else i++;
    }
    return { mask, noise, loud, snr, thr };
  }

  function runs(mask, value) {
    const out = [];
    let i = 0;
    while (i < mask.length) {
      if (mask[i] === value) { let j = i; while (j < mask.length && mask[j] === value) j++; out.push([i, j]); i = j; } else i++;
    }
    return out;
  }

  // Tono por autocorrelación normalizada en 8 kHz, cada 30 ms
  function pitchTrack(x16, mask, fmin, fmax) {
    const sr = 8000;
    const x = resample(x16, 16000, sr);
    const hop = 80; // 10 ms
    const W = 240;
    const minLag = Math.floor(sr / fmax), maxLag = Math.ceil(sr / fmin);
    const pts = [];
    for (let i = 0; i < mask.length; i += 3) {
      if (!mask[i]) continue;
      const o = i * hop;
      if (o + W + maxLag >= x.length) break;
      let e0 = 0;
      for (let k = 0; k < W; k++) e0 += x[o + k] * x[o + k];
      if (e0 < 1e-7) continue;
      const r = new Float32Array(maxLag + 2);
      let rmax = 0;
      for (let l = minLag; l <= maxLag + 1; l++) {
        let c = 0, e1 = 0;
        for (let k = 0; k < W; k++) { const b = x[o + k + l]; c += x[o + k] * b; e1 += b * b; }
        r[l] = c / Math.sqrt(e0 * e1 + 1e-12);
        if (l <= maxLag && r[l] > rmax) rmax = r[l];
      }
      if (rmax < 0.5) continue;
      // primer pico local que alcance 85% del máximo (evita errores de octava hacia abajo)
      let lag = -1;
      for (let l = minLag + 1; l <= maxLag; l++) {
        if (r[l] >= 0.85 * rmax && r[l] >= r[l - 1] && r[l] >= r[l + 1]) { lag = l; break; }
      }
      if (lag < 0) continue;
      const a = r[lag - 1], b = r[lag], c = r[lag + 1];
      const den = a - 2 * b + c;
      const shift = den !== 0 ? 0.5 * (a - c) / den : 0;
      const f = sr / (lag + Math.max(-0.5, Math.min(0.5, shift)));
      if (f >= fmin && f <= fmax) pts.push({ i, t: i * HOP, f });
    }
    if (pts.length < 3) return { pts: [], med: NaN };

    let clean = pts.filter(p => p.f > med / 1.9 && p.f < med * 1.9);
    // mediana móvil de 3
    clean = clean.map((p, k) => {
      if (k === 0 || k === clean.length - 1) return p;
      const v = [clean[k - 1].f, p.f, clean[k + 1].f].sort((u, w) => u - w)[1];
      return { i: p.i, t: p.t, f: v };
    });
    return { pts: clean, med: median(clean.map(p => p.f)) };
  }

  function slope(points) {
    const n = points.length;
    const mx = mean(points.map(p => p.x)), my = mean(points.map(p => p.y));
    let num = 0, den = 0;
    for (const p of points) { num += (p.x - mx) * (p.y - my); den += (p.x - mx) * (p.x - mx); }
    return den ? num / den : 0;
  }

  // Ataques silábicos: picos de energía con prominencia y separación mínima
  function syllablePeaks(db, mask, from, to) {
    const sm = new Float32Array(db.length);
    for (let i = 0; i < db.length; i++) {

      sm[i] = (a + db[i] + b) / 3;
    }
    const peaks = [];
    let valley = Infinity, lastPeak = -100;
    for (let i = Math.max(1, from); i < Math.min(to, sm.length - 1); i++) {
      valley = Math.min(valley, sm[i]);
      if (mask[i] && sm[i] >= sm[i - 1] && sm[i] > sm[i + 1]) {
        if (sm[i] - valley >= 4 && i - lastPeak >= 7) { peaks.push(i); lastPeak = i; valley = sm[i]; }
      }
    }
    return peaks;
  }

  /**
   * @param {Float32Array} samples  audio mono
   * @param {number} sampleRate
   * @param {object} opts { sex:'m'|'f'|'na', kind, transcript, refText }
   */
  function analyzeSamples(samples, sampleRate, opts = {}) {
    const x = resample(samples, sampleRate, 16000);
    const durationSec = x.length / 16000;
    const db = frameDb(x, 16000);
    const { mask, noise, snr } = buildMask(db);

      durationSec: round(durationSec, 2), snr: round(snr, 1), noiseDb: round(noise, 1),
      speechSec: 0, mpt: 0, ddk: null, ddkPeaks: null, f0Mean: null, f0SdSt: null, fallingPct: null,
      utterancesEvaluated: 0, pauses: 0, longPauses: 0, longPausesPerMin: null,
      words: null, wpm: null, wpmEstimated: false, fillers: null, fillersLex: null, fillersAcoustic: null,
      fillersPerMin: null, mattr: null, accuracy: null, accuracyRefWords: null, transcriptAvailable: !!(opts.transcript && opts.transcript.trim())
    };

    res.speechStartSec = round(first * HOP, 2); // silencio antes de la primera palabra
    const minutes = speechSec / 60;

    // pausas
    for (const [a, b] of runs(mask, 0)) {
      if (a <= first || b >= last) continue;
      const len = b - a;
      if (len >= 25) res.pauses++;
      if (len >= 100) res.longPauses++;

    res.longPausesPerMin = minutes > 0.2 ? round(res.longPauses / minutes, 2) : null;

    // fonación máxima (tolerancia de cortes < 100 ms ya aplicada parcialmente en la máscara)
    let mpt = 0, curStart = -1, gap = 0;
    for (let i = 0; i < mask.length; i++) {
      if (mask[i]) { if (curStart < 0) curStart = i; gap = 0; mpt = Math.max(mpt, (i - curStart + 1) * HOP); }
      else if (curStart >= 0) { gap++; if (gap >= 10) { curStart = -1; gap = 0; } }

    res.ddkPeaks = ddkPeaks.length;
    res.ddk = Math.floor(ddkPeaks.length / 3);

    // tono

    const { pts, med } = pitchTrack(x, mask, fmin, fmax);

      const st = pts.map(p => 12 * Math.log2(p.f / med));
      res.f0Mean = round(mean(pts.map(p => p.f)), 1);
      res.f0SdSt = round(std(st), 2);

      // cierres descendentes: enunciados separados por silencios ≥ 400 ms
      const utterances = [];
      let segStart = first, silent = 0;
      for (let i = first; i <= last; i++) {
        if (mask[i]) { if (silent >= 40) { utterances.push([segStart, i - silent]); segStart = i; } silent = 0; }
        else silent++;
      }
      utterances.push([segStart, last]);
      let falling = 0, evaluated = 0;
      for (const [a, b] of utterances) {
        if (b - a < 30) continue;
        const endT = b * HOP;
        const tail = pts.filter(p => p.i >= a && p.i <= b && p.t >= endT - 0.3);
        if (tail.length < 4 || tail[tail.length - 1].t - tail[0].t < 0.12) continue;
        const sl = slope(tail.map(p => ({ x: p.t, y: 12 * Math.log2(p.f / med) })));
        evaluated++;
        if (sl < -2) falling++;
      }
      res.utterancesEvaluated = evaluated;
      if (evaluated >= 2) res.fallingPct = round(100 * falling / evaluated, 1);

      // pausas llenas acústicas ("eh", "em"): segmentos cortos, aislados y con tono plano
      if (opts.kind === 'spontaneous' || opts.kind === 'presentation' || opts.kind === 'exposure') {
        let acoustic = 0;
        for (const [a, b] of speech) {
          const len = b - a;
          if (len < 20 || len > 90) continue;
          const seg = pts.filter(p => p.i >= a && p.i < b);
          if (seg.length < len / 3 * 0.6) continue;
          const sd = std(seg.map(p => 12 * Math.log2(p.f / med)));
          if (sd < 0.7) acoustic++;
        }
        res.fillersAcoustic = acoustic;
      }
    }

    // transcripción
    const tokens = tokenize(opts.transcript);
    if (tokens.length) {
      res.words = tokens.length;
      res.wpm = minutes > 0.1 ? round(tokens.length / minutes, 0) : null;
      res.fillersLex = countLexicalFillers(tokens);
      const m = mattr(tokens.filter(t => !FILLER_WORDS.has(t)));
      res.mattr = m === null ? null : round(m, 3);
      if (opts.refText) {
        const acc = wordAccuracy(opts.transcript, opts.refText);
        if (acc) { res.accuracy = round(acc.accuracy, 1); res.accuracyRefWords = acc.refWords; }
      }
    } else if (minutes > 0.1) {
      const syl = syllablePeaks(db, mask, first, last).length;
      res.wpm = round((syl / 2.3) / minutes, 0);
      res.wpmEstimated = true;
    }
    if (res.fillersLex !== null || res.fillersAcoustic !== null) {
      res.fillers = (res.fillersLex || 0) + (res.fillersAcoustic || 0);
      res.fillersPerMin = minutes > 0.2 ? round(res.fillers / minutes, 2) : null;
    }
    return res;
  }

  function round(v, d) { if (v === null || v === undefined || !isFinite(v)) return null; const p = Math.pow(10, d); return Math.round(v * p) / p; }

  // ---------- decodificación ----------
  async function decode(blob) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ctx = new Ctx();
    try {
      const buf = await ctx.decodeAudioData(await blob.arrayBuffer());
      return { samples: buf.getChannelData(0).slice(0), sampleRate: buf.sampleRate };
    } finally { ctx.close && ctx.close(); }
  }

  async function analyzeBlob(blob, opts) {
    const { samples, sampleRate } = await decode(blob);
    // ceder el hilo para que la UI pinte "analizando"
    await new Promise(r => setTimeout(r, 30));
    return analyzeSamples(samples, sampleRate, opts);
  }

  // ---------- reconocimiento de voz ----------
  const SRClass = typeof window !== 'undefined' ? (window.SpeechRecognition || window.webkitSpeechRecognition) : null;

  class SpeechCapture {
    constructor() { this.finals = []; this.interim = ''; this.active = false; this.rec = null; }
    start() {
      if (!SRClass) return false;
      this.active = true;
      const rec = new SRClass();
      rec.lang = 'es-MX';
      rec.continuous = true;
      rec.interimResults = true;
      rec.onresult = ev => {
        let interim = '';
        for (let i = ev.resultIndex; i < ev.results.length; i++) {
          const r = ev.results[i];
          if (r.isFinal) this.finals.push(r[0].transcript.trim()); else interim += r[0].transcript;
        }
        this.interim = interim;
      };
      rec.onerror = ev => { if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') this.active = false; };
      rec.onend = () => {
        if (this.active) { try { rec.start(); } catch (e) { /* ya iniciado */ } }
        else if (this._resolveEnd) this._resolveEnd();
      };
      this.rec = rec;
      try { rec.start(); } catch (e) { return false; }
      return true;
    }
    stop() {
      if (!this.rec) return Promise.resolve('');
      this.active = false;
      return new Promise(resolve => {
        const done = () => resolve([...this.finals, this.interim].join(' ').replace(/\s+/g, ' ').trim());
        this._resolveEnd = done;
        try { this.rec.stop(); } catch (e) { done(); }
        setTimeout(done, 1800);
      });
    }
  }

  // ---------- grabadora ----------
  function pickMime() {
    if (typeof MediaRecorder === 'undefined') return '';

    return options.find(m => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) || '';

  class Recorder {
    constructor() { this.state = 'idle'; }

    async start({ onLevel, onTick, maxSec, onAutoStop, withSR } = {}) {

      const mime = pickMime();

        const rms = Math.sqrt(s / buf.length);

        onTick && onTick(elapsed);

      };

      cancelAnimationFrame(this.raf);
      const durationMs = performance.now() - this.t0;

      this.cleanup();

    }

    cancel() {
      if (this.state !== 'recording') return;
      cancelAnimationFrame(this.raf);
      try { this.mr.stop(); } catch (e) { /* noop */ }
      if (this.sr) this.sr.stop();
      this.cleanup();
      this.state = 'idle';
    }

    cleanup() {
      if (this.stream) this.stream.getTracks().forEach(t => t.stop());
      if (this.ctx && this.ctx.close) this.ctx.close();
    }
  }

  E.audio = {
    Recorder, SpeechCapture, analyzeSamples, analyzeBlob, decode,

/* EVCS Web · Módulo de puntuación EVCS-100
 * Implementa la sección 8 del Paquete de desarrollo:
 * D_k = 0.6·O_k + 0.4·S_k ; I = promedio de D_k (mínimo 7 dimensiones).
 */
(function (E) {
  'use strict';

  const clip = v => Math.min(100, Math.max(1, v));
  const isNum = v => typeof v === 'number' && isFinite(v);

  function interp(x, anchor) {
    const { xs, ys } = anchor;
    if (!isNum(x)) return undefined;
    if (x <= xs[0]) return clip(ys[0]);
    for (let i = 0; i < xs.length - 1; i++) {
      if (x <= xs[i + 1]) return clip(ys[i] + (x - xs[i]) * (ys[i + 1] - ys[i]) / (xs[i + 1] - xs[i]));
    }
    return clip(ys[ys.length - 1]);
  }

  function objective(parts) {
    const ok = parts.filter(p => isNum(p.score));
    if (!ok.length) return undefined;
    const w = ok.reduce((a, p) => a + p.w, 0);
    return ok.reduce((a, p) => a + p.w * p.score, 0) / w;
  }

  function finalScore(O, S) {
    if (isNum(O) && isNum(S)) return 0.6 * O + 0.4 * S;
    return isNum(O) ? O : (isNum(S) ? S : undefined);
  }

  function weighted(items, valueKey, weightKey) {
    const ok = items.filter(it => it && isNum(it[valueKey]) && isNum(it[weightKey]) && it[weightKey] > 0);
    if (!ok.length) return undefined;
    const w = ok.reduce((a, it) => a + it[weightKey], 0);
    return ok.reduce((a, it) => a + it[valueKey] * it[weightKey], 0) / w;
  }

  /** Variables crudas a partir de los 6 pasos de la batería */
  function variables(steps) {
    const s = k => (steps[k] && steps[k].metrics) || null;
    const s1 = s(1), s2 = s(2), s3 = s(3), s4 = s(4), s5 = s(5), s6 = s(6);
    const talk = [s4, s6].filter(Boolean);
    return {
      a_r: s2 ? s2.accuracy : undefined,
      a_f: s5 ? s5.accuracyFast : undefined,
      d: s3 ? s3.ddk : undefined,
      t: s1 ? s1.mpt : undefined,
      p: weighted(talk.map(m => ({ v: m.fallingPct, w: m.utterancesEvaluated })), 'v', 'w'),
      u: weighted(talk.map(m => ({ v: m.fillersPerMin, w: m.speechSec })), 'v', 'w'),
      m: s4 && isNum(s4.mattr) ? s4.mattr : (s6 ? s6.mattr : undefined),
      h: s5 ? s5.hits : undefined,
      s: s4 && isNum(s4.f0SdSt) ? s4.f0SdSt : (s6 ? s6.f0SdSt : undefined)
    };
  }

  function objectiveScores(v, sex) {
    const A = E.data.ANCHORS;
    const f = (x, a) => (isNum(x) ? interp(x, a) : undefined);
    const fAr = f(v.a_r, A.accuracy), fAf = f(v.a_f, A.accuracy);
    const speed = isNum(v.h) ? Math.min(100, A.speeds[Math.max(0, Math.min(3, v.h))] + (isNum(v.a_f) && v.a_f >= 95 ? 10 : 0)) : undefined;
    return {
      clarity: objective([{ w: 0.7, score: fAr }, { w: 0.3, score: fAf }]),
      articulation: objective([{ w: 0.6, score: f(v.d, A.ddk) }, { w: 0.4, score: fAf }]),
      resonance: f(v.t, sex === 'f' ? A.mpt_f : A.mpt_m),
      authority: objective([{ w: 0.6, score: f(v.p, A.falling) }, { w: 0.4, score: f(v.u, A.fillers) }]),
      presence: undefined,       // requiere video (v1.5)
      persuasion: undefined,     // requiere evaluadores (v1.5)
      vocabulary: f(v.m, A.mattr),
      speed,
      expressivity: f(v.s, A.f0sd)
    };
  }

  /**
   * @param steps       { 1:{metrics}, … 6:{metrics} }
   * @param selfRatings { clarity: 1..100, … }
   * @param sex         'm' | 'f' | 'na'
   */
  function compute(steps, selfRatings, sex) {
    const v = variables(steps || {});
    const O = objectiveScores(v, sex);
    const scores = {};
    let usesSelf = false;
    E.data.DIMENSIONS.forEach(({ key }) => {
      const e = selfRatings && isNum(selfRatings[key]) ? selfRatings[key] : undefined;
      const S = isNum(e) ? 0.8 * e : undefined;
      if (isNum(S)) usesSelf = true;
      const D = finalScore(O[key], S);
      scores[key] = { O: r2(O[key]), S: r2(S), D: r2(D), source: isNum(S) ? 'self' : 'none' };
    });
    const Ds = Object.values(scores).map(s => s.D).filter(isNum);
    const index = Ds.length >= 7 ? r2(Ds.reduce((a, b) => a + b, 0) / Ds.length) : null;
    return { variables: v, scores, index, dims: Ds.length, provisional: usesSelf || Ds.length < 9 };
  }

  function r2(x) { return isNum(x) ? Math.round(x * 100) / 100 : null; }

  function band(index) {
    if (!isNum(index)) return null;
    const i = Math.round(index);
    return E.data.BANDS.find(b => i >= b.min && i <= b.max) || E.data.BANDS[0];
  }

  // Fortalezas y prioridades (3 y 3)
  function ranking(scores) {
    const list = E.data.DIMENSIONS.map(d => ({ key: d.key, label: d.label, D: scores[d.key] && scores[d.key].D }))
      .filter(x => isNum(x.D)).sort((a, b) => b.D - a.D);
    return { strengths: list.slice(0, 3), priorities: list.slice(-3).reverse() };
  }

  // Cambio mínimo detectable provisional (sección 8.7)
  const MDC = { index: 5, dimension: 8 };

  E.scoring = { interp, objective, finalScore, variables, objectiveScores, compute, band, ranking, MDC };
})(window.EVCS);

/* EVCS Web · Módulo de gamificación
 * XP con topes de salud, niveles ligados al índice EVCS, racha con comodines e insignias.
 */
(function (E) {
  'use strict';

  const S = () => E.store.get();
  const today = () => E.store.dayKey();

  // Lunes de la semana ISO de un día
  function weekKey(day) {
    const d = new Date(day + 'T12:00:00');
    const dow = (d.getDay() + 6) % 7;
    d.setDate(d.getDate() - dow);
    return E.store.dayKey(d);
  }

  const SESSION_XP = { 5: 10, 15: 25, 30: 40, 60: 60, 90: 75 };

  function sessionXP(minutes, soft) { return soft ? 40 : (SESSION_XP[minutes] || 10); }

  /** Otorga XP respetando los topes. Devuelve los puntos realmente otorgados. */
  function award(source, points, ref) {
    const st = S(), day = today(), wk = weekKey(day);
    const todays = st.xp.filter(x => x.day === day);
    let p = points;
    if (source === 'session' || source === 'block') {
      const used = todays.filter(x => x.source === 'session' || x.source === 'block').reduce((a, x) => a + x.points, 0);
      p = Math.max(0, Math.min(p, 120 - used));
    } else if (source === 'diction') {
      if (todays.filter(x => x.source === 'diction').length >= 2) p = 0;
    } else if (source === 'recording') {
      if (todays.filter(x => x.source === 'recording').length >= 3) p = 0;
    } else if (source === 'exposure') {
      if (st.xp.filter(x => x.source === 'exposure' && weekKey(x.day) === wk).length >= 3) p = 0;
    } else if (source === 'review' || source === 'gate' || source === 'badge') {
      if (st.xp.some(x => x.source === source && x.ref === ref)) p = 0;
    } else if (source === 'improvement') {
      if (st.xp.some(x => x.source === 'improvement' && x.ref === ref && weekKey(x.day) === wk)) p = 0;
    }
    if (p > 0) {
      E.store.update(s => s.xp.push({ date: new Date().toISOString(), day, source, points: p, ref: ref || null }));
    }
    return p;
  }

  const totalXP = () => S().xp.reduce((a, x) => a + x.points, 0);
  const xpToday = () => S().xp.filter(x => x.day === today()).reduce((a, x) => a + x.points, 0);

  function completedAssessments() {
    return S().assessments.filter(a => a.status === 'completed').sort((a, b) => a.date.localeCompare(b.date));
  }
  const baseline = () => completedAssessments().find(a => a.kind === 'baseline') || null;
  const latestAssessment = () => { const l = completedAssessments(); return l.length ? l[l.length - 1] : null; };

  function level() {
    const xp = totalXP();
    const idx = latestAssessment() ? latestAssessment().index || 0 : 0;
    const L = E.data.LEVELS;
    let cur = L[0];
    for (const l of L) if (xp >= l.minXp && idx >= l.minIndex) cur = l;
    const next = L.find(l => l.level === cur.level + 1) || null;
    let progress = 1;
    if (next) progress = Math.max(0, Math.min(1, (xp - cur.minXp) / (next.minXp - cur.minXp)));
    const blockedByIndex = next && xp >= next.minXp && idx < next.minIndex;
    return { ...cur, xp, next, progress, blockedByIndex, index: idx };
  }

  // ---------- racha ----------
  function practicedDays() {
    return new Set(S().sessions.filter(s => s.completed).map(s => s.day));
  }

  function streak() {
    const st = S();
    const days = practicedDays();
    const t = today();
    const painDays = Object.entries(st.dailyLogs).filter(([, v]) => v.pain).map(([k]) => k);
    if (!days.size) return { current: 0, best: 0, freezesLeft: 2, todayDone: false, frozen: false };
    const sorted = Array.from(days).sort();
    let d = new Date(sorted[0] + 'T12:00:00');
    const end = new Date(t + 'T12:00:00');
    let cur = 0, best = 0, freezes = 2, wk = weekKey(sorted[0]), healthUntil = '', frozen = false;
    while (d <= end) {
      const k = E.store.dayKey(d);
      if (weekKey(k) !== wk) { wk = weekKey(k); freezes = 2; }
      if (painDays.includes(k)) { const h = new Date(d); h.setDate(h.getDate() + 7); healthUntil = E.store.dayKey(h); }
      frozen = false;
      if (days.has(k)) { cur++; best = Math.max(best, cur); }
      else if (k === t) { /* el día de hoy sigue pendiente */ }
      else if (healthUntil && k <= healthUntil) { frozen = true; }
      else if (freezes > 0) { freezes--; }
      else { cur = 0; }
      d.setDate(d.getDate() + 1);
    }
    return { current: cur, best, freezesLeft: freezes, todayDone: days.has(t), frozen: !!(healthUntil && t <= healthUntil) };
  }

  // ---------- insignias ----------
  function badgeRules(st) {
    const recs = st.recordings.slice().sort((a, b) => a.date.localeCompare(b.date));
    const m = r => r.metrics || {};
    const base = baseline();
    const baseMpt = base && base.steps && base.steps[1] && base.steps[1].metrics ? base.steps[1].metrics.mpt : null;
    const talk = recs.filter(r => ['spontaneous', 'presentation', 'exposure'].includes(r.kind) && m(r).fillersPerMin !== null && m(r).fillersPerMin !== undefined);
    let run = 0, adios = false;
    for (const r of talk) { if (m(r).fillersPerMin < 1) { run++; if (run >= 3) adios = true; } else run = 0; }

    const practiced = x => x && x.sessions >= 1 && x.mastery >= 80;
    const mastery = id => (st.diction && practiced(st.diction.sounds[id]) ? st.diction.sounds[id].mastery : 0);
    const mastered = st.diction ? Object.values(st.diction.sounds).filter(practiced).length : 0;
    return {
      primer_aliento: !!base,
      popote_oro: days('V1') >= 30,
      pulmon_acero: !!baseMpt && recs.some(r => r.kind === 'mpt' && m(r).mpt >= baseMpt * 1.3),
      cristalino: recs.some(r => m(r).accuracy >= 98),
      erre_con_erre: days('D3') >= 10 || mastery('rr') >= 80,
      mapa_sonidos: !!(st.diction && st.diction.checks.length),
      diccion_tres: mastered >= 3,
      poder_silencio: recs.filter(r => m(r).longPausesPerMin >= 4).length >= 5,
      adios_eh: adios,
      melodia: recs.some(r => ['spontaneous', 'presentation', 'exposure'].includes(r.kind) && m(r).f0SdSt >= 4),
      primera_linea: st.exposures.length >= 1,
      cara_audiencia: st.exposures.length >= 10,
      sin_red: recs.some(r => r.kind === 'presentation' && r.durationMs >= 170000 && m(r).fillersPerMin !== null && m(r).fillersPerMin < 1),
      compuerta_1: !!(st.program.gates[1] && st.program.gates[1].passed),
      compuerta_2: !!(st.program.gates[2] && st.program.gates[2].passed),
      compuerta_3: !!(st.program.gates[3] && st.program.gates[3].passed),
      compuerta_4: !!(st.program.gates[4] && st.program.gates[4].passed),
      noventa_dias: !!st.program.completedAt
    };
  }

  /** Revisa reglas y otorga insignias nuevas. Devuelve la lista de insignias nuevas. */
  function checkBadges() {
    const st = S();
    const rules = badgeRules(st);
    const fresh = E.data.BADGES.filter(b => rules[b.code] && !st.badges[b.code]);
    if (fresh.length) {
      E.store.update(s => fresh.forEach(b => { s.badges[b.code] = new Date().toISOString(); }));
      fresh.forEach(b => award('badge', 50, b.code));
    }
    return fresh;
  }

  // ---------- mejora de métricas ----------
  function checkImprovement(metricKey, value) {
    const def = E.data.METRICS[metricKey];
    if (!def || value === null || value === undefined || def.better === 'range') return 0;
    const since = new Date(); since.setDate(since.getDate() - 14);
    const prev = S().recordings.filter(r => new Date(r.date) >= since && r.metrics && typeof r.metrics[metricKey] === 'number');
    if (prev.length < 3) return 0;
    const avg = prev.reduce((a, r) => a + r.metrics[metricKey], 0) / prev.length;
    if (!avg) return 0;
    const better = def.better === 'down' ? value <= avg * 0.95 : value >= avg * 1.05;
    return better ? award('improvement', 20, metricKey) : 0;
  }

  E.game = { award, sessionXP, totalXP, xpToday, level, streak, checkBadges, checkImprovement, baseline, latestAssessment, completedAssessments, weekKey, practicedDays };
})(window.EVCS);

/* EVCS Web · Módulo de grabaciones
 * Guarda metadatos y métricas en el estado y el audio en IndexedDB.
 */
(function (E) {
  'use strict';

  const KIND_LABELS = {
    reading: 'Lectura', spontaneous: 'Habla espontánea', presentation: 'Presentación', exposure: 'Exposición',
    mpt: 'Fonación sostenida', ddk: 'Pa-ta-ka', speeds: 'Velocidades', exercise: 'Ejercicio', free: 'Libre'
  };

  async function save({ blob, durationMs, transcript, metrics, kind, source, label, textId, ref }) {
    const id = E.store.uid();
    let hasAudio = false;
    if (blob) {
      try { await E.store.audio.put(id, blob); hasAudio = true; } catch (e) { console.warn('Audio no guardado', e); }
    }
    const rec = {
      id, date: new Date().toISOString(), day: E.store.dayKey(), kind, source: source || 'free',
      label: label || KIND_LABELS[kind] || 'Grabación', durationMs: Math.round(durationMs || 0),
      metrics: metrics || {}, transcript: transcript || '', hasAudio, textId: textId || null, ref: ref || null
    };
    E.store.update(s => s.recordings.push(rec));
    return rec;
  }

  async function remove(id) {
    try { await E.store.audio.del(id); } catch (e) { /* sin audio */ }
    E.store.update(s => { s.recordings = s.recordings.filter(r => r.id !== id); });
  }

  async function url(id) {
    const blob = await E.store.audio.get(id);
    return blob ? URL.createObjectURL(blob) : null;
  }

  const get = id => E.store.get().recordings.find(r => r.id === id) || null;
  const list = () => E.store.get().recordings.slice().sort((a, b) => b.date.localeCompare(a.date));

  // Primera lectura del Texto Base (día 0) y la más reciente
  function readingPair() {
    const r = E.store.get().recordings.filter(x => x.kind === 'reading' && x.textId === 'base').sort((a, b) => a.date.localeCompare(b.date));
    if (r.length < 2) return null;
    return [r[0], r[r.length - 1]];
  }

  E.records = { save, remove, url, get, list, readingPair, KIND_LABELS };
})(window.EVCS);

/* EVCS Web · Planificador diario
 * Determinista: misma fecha + bloque + semana ⇒ mismo plan (RQ-040).
 */
(function (E) {
  'use strict';

  const CORE = ['R0', 'R1', 'R5', 'R6', 'V1', 'V2'];

  function hash(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function rng(seed) {
    let a = seed;
    return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }

  function unlocked(week) {
    const set = new Set(CORE);
    E.data.WEEKS.filter(w => w.n <= week).forEach(w => w.exercises.forEach(c => set.add(c)));
    return set;
  }

  function weakDims() {
    const a = E.game.latestAssessment();
    if (!a || !a.scores) return [];
    return E.scoring.ranking(a.scores).priorities.map(p => p.key);
  }

  function blockNow(date) {
    const h = (date || new Date()).getHours();
    if (h < 12) return 'morning';
    if (h < 17) return 'midday';
    return 'night';
  }

  const BLOCK_LABEL = { morning: 'Mañana', midday: 'Mediodía', night: 'Noche' };
  const BLOCK_PURPOSE = { morning: 'Preparar el instrumento', midday: 'Transferir a la vida real', night: 'Práctica deliberada y registro' };

  /**
   * @param {object} o { week, minutes, fatigue, soft, block, day }
   */
  function build(o) {
    const week = Math.max(1, Math.min(13, o.week || 1));
    const W = E.data.WEEKS[week - 1];
    const soft = !!(o.soft || (o.fatigue && o.fatigue > 6));
    const proto = soft ? E.data.SOFT_PROTOCOL : E.data.PROTOCOLS[o.minutes] || E.data.PROTOCOLS[15];
    const rand = rng(hash(`${o.day || E.store.dayKey()}|${o.block || 'free'}|${week}|${o.minutes}|${soft}`));
    const focusDiction = !!((E.store.get().profile || {}).dictionFocus);
    const open = unlocked(week);
    if (focusDiction) E.data.EXERCISES.filter(x => x.family === 'A' || x.family === 'D').forEach(x => open.add(x.code));
    const weak = weakDims();
    if (focusDiction) ['articulation', 'clarity'].forEach(d => { if (!weak.includes(d)) weak.unshift(d); });
    const used = new Set();

    const score = ex => {
      let s = rand();
      if (W.exercises.includes(ex.code)) s += 2;
      ex.dims.forEach(d => { if (weak.includes(d)) s += 1; });
      return s;
    };
    const pick = list => {
      const c = list.filter(ex => !used.has(ex.code) && !(soft && ex.intensity >= 3));
      if (!c.length) return null;
      c.sort((a, b) => score(b) - score(a));
      return c[0];
    };

    const items = [];
    const anyOpen = () => pick(E.data.EXERCISES.filter(x => open.has(x.code)));
    for (const slot of proto.slots) {
      let ex = null;
      if (slot.code) ex = used.has(slot.code) ? null : E.data.EX[slot.code];
      else if (slot.fam) ex = pick(E.data.EXERCISES.filter(x => x.family === slot.fam && open.has(x.code))) || anyOpen();
      else if (slot.focus) {
        ex = (focusDiction ? pick(E.data.EXERCISES.filter(x => (x.family === 'A' || x.family === 'D') && open.has(x.code))) : null)
          || pick(W.exercises.map(c => E.data.EX[c]))
          || pick(E.data.EXERCISES.filter(x => open.has(x.code) && x.dims.some(d => weak.includes(d))))
          || anyOpen();
      }
      if (!ex) {
        // sin ejercicios nuevos disponibles: se alarga el ejercicio de foco más reciente
        const target = items.slice().reverse().find(i => W.exercises.includes(i.code)) || items[items.length - 1];
        if (target) target.seconds += slot.s;
        continue;
      }
      used.add(ex.code);
      items.push({ code: ex.code, seconds: slot.s, done: false });
    }

    // Intercalado desde la semana 4: el calentamiento queda al inicio, el resto se mezcla
    if (week >= 4 && !soft) {
      const warm = items.filter(i => i.code[0] === 'R' || ['V1', 'V2', 'V3'].includes(i.code));
      const rest = items.filter(i => !warm.includes(i));
      for (let i = rest.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [rest[i], rest[j]] = [rest[j], rest[i]]; }
      items.length = 0;
      items.push(...warm, ...rest);
    }

    const topics = E.data.TEXTS.topics;
    const spontaneous = week >= 7 && !soft;
    const record = {
      kind: spontaneous ? 'spontaneous' : 'reading',
      textId: spontaneous ? null : 'base',
      topic: spontaneous ? topics[Math.floor(rand() * topics.length)] : null,
      seconds: soft ? 60 : Math.min(proto.record, spontaneous ? 120 : 75),
      minSeconds: spontaneous ? 45 : 15,
      metric: W.metric,
      question: W.question
    };

    // Ajuste fino: la sesión dura lo que el usuario eligió (±15 s)
    const targetSec = (soft ? 5 : o.minutes) * 60 - record.seconds;
    const sumEx = items.reduce((a, i) => a + i.seconds, 0);
    if (sumEx > 0 && targetSec > 0) {
      items.forEach(i => { i.seconds = Math.max(30, Math.round((i.seconds * targetSec / sumEx) / 15) * 15); });
    }
    const totalSec = items.reduce((a, i) => a + i.seconds, 0) + record.seconds;
    return { week, soft, minutes: soft ? 5 : o.minutes, protocolName: proto.name, items, record, totalSec, block: o.block || blockNow() };
  }

  E.planner = { build, blockNow, unlocked, weakDims, BLOCK_LABEL, BLOCK_PURPOSE };
})(window.EVCS);
