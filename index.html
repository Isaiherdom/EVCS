  const URL_KEY = 'evcs_cloud_url';
  const BACKUP_KEY = 'evcs_last_backup';
  const SALT = 'evcs-v1|';

  // ---------- configuración ----------
  const readCfg = () => { try { return JSON.parse(localStorage.getItem(CFG_KEY)) || {}; } catch (e) { return {}; } };
  const writeCfg = c => { localStorage.setItem(CFG_KEY, JSON.stringify(c)); document.dispatchEvent(new CustomEvent('evcs:cloud')); };

  function url() {
    const embedded = (window.EVCS_CLOUD_URL || '').trim();
    if (/^(https:\/\/|http:\/\/localhost)/.test(embedded)) return embedded;
    return (localStorage.getItem(URL_KEY) || '').trim();
  }
  const embeddedUrl = () => /^(https:\/\/|http:\/\/localhost)/.test((window.EVCS_CLOUD_URL || '').trim());
  function setUrl(u) { localStorage.setItem(URL_KEY, (u || '').trim()); }

  async function keyFor(code) {
    const norm = String(code || '').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, '');
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(SALT + norm));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  // ---------- comunicación ----------
  async function call(payload, endpoint) {
    const target = endpoint || url();
    if (!target) throw new Error('No hay enlace del servicio de respaldo configurado.');
    // text/plain evita la verificación previa de CORS con Apps Script
    const res = await fetch(target, { method: 'POST', body: JSON.stringify(payload), redirect: 'follow' });
    if (!res.ok) throw new Error(`El servicio respondió ${res.status}`);
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || 'Error del servicio');
    return json;
  }

  function summary() {
    const st = E.store.get();
    const last = E.game.latestAssessment();
    const sounds = Object.values((st.diction || {}).sounds || {}).filter(s => typeof s.mastery === 'number');
    const days = st.sessions.filter(s => s.completed).map(s => s.day).sort();
    const lv = E.game.level();
    return {
      name: (st.profile || {}).name || '',
      week: st.program.week,
      index: last && typeof last.index === 'number' ? Math.round(last.index) : null,
      sessions: st.sessions.filter(s => s.completed).length,
      streak: E.game.streak().current,
      xp: lv.xp,
      level: `${lv.level} · ${lv.name}`,
      diction: sounds.length ? Math.round(sounds.reduce((a, s) => a + s.mastery, 0) / sounds.length) : null,
      lastPractice: days[days.length - 1] || '',
      device: /iPhone|iPad/.test(navigator.userAgent) ? 'iPhone' : /Android/.test(navigator.userAgent) ? 'Android' : 'Computadora'
    };
  }

  // ---------- sincronización ----------
  let timer = null, busy = false, pending = false;

  async function push() {
    const c = readCfg();
    if (!c.enabled || !c.key || !url()) return false;
    if (busy) { pending = true; return false; }
    busy = true;
    try {
      const st = E.store.get();
      const data = JSON.stringify(Object.assign({}, st, { activeSession: null }));
      await call({ action: 'save', key: c.key, summary: summary(), data });
      writeCfg(Object.assign(readCfg(), { lastSync: new Date().toISOString(), lastError: null, dirty: false }));
      return true;
    } catch (err) {
      writeCfg(Object.assign(readCfg(), { lastError: err.message, dirty: true }));
      return false;
    } finally {
      busy = false;
      if (pending) { pending = false; schedule(5000); }
    }
  }

  function schedule(ms = 15000) {
    const c = readCfg();
    if (!c.enabled) return;
    if (!c.dirty) writeCfg(Object.assign(c, { dirty: true }));
    clearTimeout(timer);
    timer = setTimeout(push, ms);
  }

  async function load(code, endpoint) {
    const key = await keyFor(code);
    const r = await call({ action: 'load', key }, endpoint);
    return { key, found: !!r.found, data: r.found ? r.data : null, updatedAt: r.updatedAt || null };
  }

  // Reemplaza el estado local con el respaldo de la nube y revisa qué audios existen en este dispositivo
  async function applyRemote(dataText) {
    E.store.importJSON(dataText);
    const st = E.store.get();
    for (const r of st.recordings) {
      try { if (await E.store.audio.get(r.id)) r.hasAudio = true; } catch (e) { /* sin audio */ }
    }
    E.store.save();
  }

  function describe(dataText) {
    try {
      const s = JSON.parse(dataText);
      return { name: (s.profile || {}).name || '', week: s.program ? s.program.week : 1, sessions: (s.sessions || []).filter(x => x.completed).length };
    } catch (e) { return null; }
  }

  async function enable(code, endpoint) {
    if (endpoint && !embeddedUrl()) setUrl(endpoint);
    const remote = await load(code);
    writeCfg({ enabled: true, key: remote.key, hint: maskCode(code), since: new Date().toISOString(), lastSync: null, lastError: null, dirty: true });
    return remote;
  }

  function disable() { writeCfg(Object.assign(readCfg(), { enabled: false })); }

  function maskCode(code) { const c = String(code).trim(); return c.length <= 3 ? '•••' : c.slice(0, 2) + '•'.repeat(Math.max(3, c.length - 3)) + c.slice(-1); }

  // ---------- respaldo local ----------
  const lastBackup = () => localStorage.getItem(BACKUP_KEY);
  const markBackup = () => localStorage.setItem(BACKUP_KEY, new Date().toISOString());

  function downloadBackup() {
    const blob = new Blob([E.store.exportJSON()], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `evcs-respaldo-${E.store.dayKey()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1500);
    markBackup();
  }

  // ¿Conviene recordar un respaldo? Sólo si hay avance y no hay respaldo reciente (local o nube)
  function backupDue() {
    const st = E.store.get();
    if (!st.sessions.some(s => s.completed) && !st.assessments.some(a => a.status === 'completed')) return false;
    const c = readCfg();
    const recent = iso => iso && (Date.now() - new Date(iso)) < 7 * 864e5;
    if (c.enabled && recent(c.lastSync)) return false;
    return !recent(lastBackup());
  }

  let persisted = null;
  async function requestPersistence() {
    try {
      if (navigator.storage && navigator.storage.persist) {
        persisted = (await navigator.storage.persisted()) || (await navigator.storage.persist());
      }
    } catch (e) { persisted = false; }
    return persisted;
  }

  function init() {
    requestPersistence();
    document.addEventListener('evcs:state', () => schedule());
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && readCfg().dirty) push(); });
    window.addEventListener('online', () => { if (readCfg().dirty) push(); });
    const c = readCfg();
    if (c.enabled && (c.dirty || !c.lastSync || Date.now() - new Date(c.lastSync) > 36e5)) setTimeout(push, 4000);
  }

  async function feedback(payload) {
    return call(Object.assign({ action: 'feedback' }, payload));
  }

  E.cloud = {
    feedback,
    init, push, schedule, load, applyRemote, describe, enable, disable, keyFor,
    config: readCfg, url, setUrl, embeddedUrl, summary,
    lastBackup, markBackup, downloadBackup, backupDue,
    get persisted() { return persisted; }
  };
})(window.EVCS);

</script>
  <script>/* js/ui/components.js */
/* EVCS Web · Componentes de interfaz
 * Utilidades, modales, notificaciones, gráficas SVG, celebraciones y el panel de grabación.
 */
(function (E) {
  'use strict';

  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
  const esc = s => String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const isNum = v => typeof v === 'number' && isFinite(v);

  const fmt = {
    num: (v, d = 0) => (isNum(v) ? v.toLocaleString('es-MX', { minimumFractionDigits: d, maximumFractionDigits: d }) : '—'),
    clock: sec => { sec = Math.max(0, Math.round(sec)); return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`; },
    date: iso => new Date(iso).toLocaleDateString('es-MX', { weekday: 'short', day: 'numeric', month: 'short' }),
    dateTime: iso => new Date(iso).toLocaleString('es-MX', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }),
    metric(key, v) {
      const def = E.data.METRICS[key];
      if (!isNum(v)) return '—';
      return fmt.num(v, def ? def.digits : 1) + (def && def.unit ? (def.unit === '%' ? '%' : ' ' + def.unit) : '');
    }
  };

  // ---------- notificaciones ----------
  function toast(msg, type = '') {
    let box = $('.toasts');
    if (!box) { box = document.createElement('div'); box.className = 'toasts'; document.body.appendChild(box); }
    const t = document.createElement('div');
    t.className = 'toast ' + type;
    t.textContent = msg;
    box.appendChild(t);
    setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; }, 2600);
    setTimeout(() => t.remove(), 3000);
  }

  // ---------- modal ----------
  function modal({ title = '', body = '', actions = [], wide = false, onMount, onClose, dismissible = true } = {}) {
    const back = document.createElement('div');
    back.className = 'modal-back';
    back.innerHTML = `<div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true">
      <div class="modal-head"><h2 class="display">${title}</h2>${dismissible ? '<button class="x-btn" data-x aria-label="Cerrar">✕</button>' : ''}</div>
      <div class="modal-body">${body}</div>
      ${actions.length ? `<div class="modal-actions">${actions.map((a, i) => `<button class="btn ${a.cls || ''}" data-a="${i}">${a.label}</button>`).join('')}</div>` : ''}
    </div>`;
    document.body.appendChild(back);
    let closed = false;
    const api = {
      el: back.querySelector('.modal'),
      close() { if (closed) return; closed = true; back.remove(); document.removeEventListener('keydown', onKey); onClose && onClose(); }
    };
    const onKey = e => { if (e.key === 'Escape' && dismissible) api.close(); };
    document.addEventListener('keydown', onKey);
    back.addEventListener('click', e => {
      if (e.target === back && dismissible) api.close();
      if (e.target.closest('[data-x]')) api.close();
      const b = e.target.closest('[data-a]');
      if (b) { const a = actions[+b.dataset.a]; if (a.onClick) { if (a.onClick(api) !== false) api.close(); } else api.close(); }
    });
    onMount && onMount(api.el, api);
    return api;
  }

  function confirmDialog(message, { okLabel = 'Confirmar', danger = false, title = '¿Seguro?' } = {}) {
    return new Promise(resolve => {
      let answered = false;
      modal({
        title, body: `<p class="muted">${message}</p>`,
        actions: [
          { label: 'Cancelar', cls: 'ghost', onClick: () => { answered = true; resolve(false); } },
          { label: okLabel, cls: danger ? 'danger' : 'primary', onClick: () => { answered = true; resolve(true); } }
        ],
        onClose: () => { if (!answered) resolve(false); }
      });
    });
  }

  // ---------- sonido ----------
  let actx = null;
  function beep(freq = 880, ms = 140, vol = 0.12) {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = freq; o.type = 'sine';
      g.gain.setValueAtTime(vol, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + ms / 1000);
      o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + ms / 1000);
    } catch (e) { /* sin audio */ }
  }
  const chime = () => { beep(660, 120); setTimeout(() => beep(990, 180), 130); };

  // ---------- celebración ----------
  function celebrate({ icon = '🎉', title = '¡Bien hecho!', text = '', xp = 0, badges = [], cta = 'Continuar', onClose } = {}) {
    const colors = ['#FF8A3D', '#FFC145', '#58CC02', '#1CB0F6', '#A26FD6', '#E86F9B'];
    const conf = Array.from({ length: 36 }, (_, i) => `<i style="left:${(i * 97) % 100}%;background:${colors[i % colors.length]};animation-delay:${(i % 9) * 0.07}s"></i>`).join('');
    const badgeHtml = badges.length ? `<div class="mt stack">${badges.map(b => `<div class="row" style="justify-content:center"><span style="font-size:28px">${b.icon}</span><b>${esc(b.name)}</b><span class="tag warn">Nueva insignia</span></div>`).join('')}</div>` : '';
    modal({
      title: '', body: `<div class="celebrate"><div class="confetti">${conf}</div>
        <span class="big-ico">${icon}</span>
        <h2 class="display mt">${esc(title)}</h2>
        ${text ? `<p class="muted mt">${text}</p>` : ''}
        ${xp ? `<div class="mt"><span class="pill gem" style="font-size:18px">+${xp} XP</span></div>` : ''}
        ${badgeHtml}</div>`,
      actions: [{ label: cta, cls: 'go big block' }], onClose
    });
    chime();
  }

  // ---------- gráficas SVG ----------
  function lineChart(points, { min = 0, max = 100, height = 220, bands = true, color = 'var(--accent)' } = {}) {
    const W = 600, H = height, pl = 36, pr = 16, pt = 16, pb = 30;
    const x = i => pl + (points.length <= 1 ? (W - pl - pr) / 2 : i * (W - pl - pr) / (points.length - 1));
    const y = v => pt + (1 - (v - min) / (max - min)) * (H - pt - pb);
    let g = '';
    if (bands) {
      E.data.BANDS.forEach((b, i) => {
        const y1 = y(Math.min(max, b.max)), y2 = y(Math.max(min, b.min - 1));
        if (i % 2 === 0) g += `<rect x="${pl}" y="${y1}" width="${W - pl - pr}" height="${y2 - y1}" fill="var(--surface-2)" opacity=".6"/>`;
        g += `<text class="band-text" x="${W - pr - 4}" y="${y1 + 12}" text-anchor="end">${b.name}</text>`;
      });
    }
    [min, (min + max) / 2, max].forEach(v => { g += `<line class="grid-line" x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}"/><text class="axis-text" x="${pl - 8}" y="${y(v) + 4}" text-anchor="end">${v}</text>`; });
    const valid = points.filter(p => isNum(p.y));
    if (valid.length) {
      const d = points.map((p, i) => (isNum(p.y) ? `${i === 0 ? 'M' : 'L'}${x(i)},${y(p.y)}` : '')).join(' ').replace(/^ L/, 'M');
      g += `<path d="${d}" fill="none" stroke="${color}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>`;
      points.forEach((p, i) => {
        if (!isNum(p.y)) return;
        g += `<circle cx="${x(i)}" cy="${y(p.y)}" r="7" fill="var(--surface)" stroke="${color}" stroke-width="3.5"/>`;
        g += `<text class="axis-text" x="${x(i)}" y="${y(p.y) - 14}" text-anchor="middle" style="fill:var(--text);font-size:13px">${Math.round(p.y)}</text>`;
      });
    }
    points.forEach((p, i) => { g += `<text class="axis-text" x="${x(i)}" y="${H - 8}" text-anchor="middle">${esc(p.label)}</text>`; });
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución del índice">${g}</svg>`;
  }

  function radar(series, { size = 340 } = {}) {
    const dims = E.data.DIMENSIONS, n = dims.length, c = size / 2, R = size / 2 - 52;
    const pt = (i, v) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; const r = R * Math.max(0, Math.min(100, v)) / 100; return [c + r * Math.cos(a), c + r * Math.sin(a)]; };
    let g = '';
    [25, 50, 75, 100].forEach(l => { g += `<polygon points="${dims.map((_, i) => pt(i, l).join(',')).join(' ')}" fill="none" class="grid-line"/>`; });
    dims.forEach((d, i) => {
      const [x2, y2] = pt(i, 100), [lx, ly] = pt(i, 122);
      g += `<line x1="${c}" y1="${c}" x2="${x2}" y2="${y2}" class="grid-line"/>`;
      g += `<text class="axis-text" x="${lx}" y="${ly + 4}" text-anchor="middle">${d.short}</text>`;
    });
    series.forEach(s => {
      const pts = dims.map((d, i) => pt(i, isNum(s.values[d.key]) ? s.values[d.key] : 0));
      g += `<polygon points="${pts.map(p => p.join(',')).join(' ')}" fill="${s.color}" fill-opacity="${s.fill || 0.18}" stroke="${s.color}" stroke-width="2.5" ${s.dash ? 'stroke-dasharray="6 5"' : ''}/>`;
      if (!s.dash) pts.forEach(p => { g += `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="${s.color}"/>`; });
    });
    return `<svg class="chart" viewBox="0 0 ${size} ${size}" role="img" aria-label="Radar de dimensiones" style="max-width:${size + 40}px;margin:0 auto">${g}</svg>`;
  }

  function spark(values, { target = null, color = 'var(--accent)', w = 180, h = 46 } = {}) {
    const v = values.filter(isNum);
    if (v.length < 2) return `<svg class="chart" viewBox="0 0 ${w} ${h}"><text class="axis-text" x="0" y="${h / 2 + 4}">Datos insuficientes</text></svg>`;
    let lo = Math.min(...v), hi = Math.max(...v);
    if (isNum(target)) { lo = Math.min(lo, target); hi = Math.max(hi, target); }
    if (hi === lo) { hi += 1; lo -= 1; }
    const x = i => 4 + i * (w - 8) / (values.length - 1), y = val => 4 + (1 - (val - lo) / (hi - lo)) * (h - 8);
    let d = '', started = false;
    values.forEach((val, i) => { if (isNum(val)) { d += `${started ? 'L' : 'M'}${x(i)},${y(val)} `; started = true; } });
    const tl = isNum(target) ? `<line x1="0" x2="${w}" y1="${y(target)}" y2="${y(target)}" stroke="var(--green)" stroke-dasharray="4 4" stroke-width="1.5"/>` : '';
    const last = values.length - 1;
    return `<svg class="chart" viewBox="0 0 ${w} ${h}">${tl}<path d="${d}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round"/>${isNum(values[last]) ? `<circle cx="${x(last)}" cy="${y(values[last])}" r="4" fill="${color}"/>` : ''}</svg>`;
  }

  function ring(progress, { size = 120, stroke = 12, color = 'var(--accent)', label = '' } = {}) {
    const r = (size - stroke) / 2, C = 2 * Math.PI * r, p = Math.max(0, Math.min(1, progress || 0));
    return `<div class="ring" style="width:${size}px;height:${size}px">
      <svg width="${size}" height="${size}"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--surface-3)" stroke-width="${stroke}"/>
      <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - p)}" style="transition:stroke-dashoffset .6s"/></svg>
      <div class="ring-label">${label}</div></div>`;
  }

  function heatmap(minutesByDay, weeks = 13) {
    const today = new Date(); today.setHours(12, 0, 0, 0);
    const start = new Date(today); start.setDate(start.getDate() - ((today.getDay() + 6) % 7) - (weeks - 1) * 7);
    let cells = '';
    for (let i = 0; i < weeks * 7; i++) {
      const d = new Date(start); d.setDate(start.getDate() + i);
      const k = E.store.dayKey(d), m = minutesByDay[k] || 0;
      const cls = d > today ? 'style="opacity:.25"' : '';
      const lvl = m >= 30 ? 'l3' : m >= 15 ? 'l2' : m > 0 ? 'l1' : '';
      cells += `<span class="${lvl} ${k === E.store.dayKey() ? 'today' : ''}" ${cls} title="${k}: ${Math.round(m)} min"></span>`;
    }
    return `<div class="heat">${cells}</div>`;
  }

  // ---------- métricas ----------
  function metricStatus(key, v) {
    const def = E.data.METRICS[key];
    if (!def || !isNum(v)) return '';
    if (def.better === 'range') return v >= def.target[0] && v <= def.target[1] ? 'ok' : 'warn';
    if (def.better === 'down') return v <= def.target ? 'ok' : 'warn';
    return v >= def.target ? 'ok' : 'warn';
  }

  function targetText(key) {
    const def = E.data.METRICS[key];
    if (!def) return '';
    if (def.better === 'range') return `meta ${def.target[0]}–${def.target[1]}`;
    return `meta ${def.better === 'down' ? '<' : '≥'} ${def.target}${def.unit === '%' ? '%' : def.unit ? ' ' + def.unit : ''}`;
  }

  // ---------- ayuda contextual ----------
  const helpBtn = (key, kind = 'metric') => `<button class="help-i" data-help="${kind}:${key}" aria-label="¿Qué significa?" title="¿Qué significa?">i</button>`;

  function exerciseChips(codes) {
    if (!codes || !codes.length) return '';
    return `<div class="card-title mt">Ejercicios que ayudan</div><div class="chips mt">${codes.map(c => E.data.EX[c] ? `<button class="chip" data-help-ex="${c}">${c} · ${esc(E.data.EX[c].name)}</button>` : '').join('')}</div>`;
  }

  function showHelp(ref) {
    const [kind, key] = String(ref).split(':');
    let title = '', body = '';
    if (kind === 'metric') {
      const h = E.data.HELP.METRIC_HELP[key], def = E.data.METRICS[key];
      if (!h || !def) return;
      title = def.label;
      body = `<div class="stack"><div><div class="card-title">Qué es</div><p class="muted mt">${esc(h.what)}</p></div>
        <div><div class="card-title">Por qué importa</div><p class="muted mt">${esc(h.why)}</p></div>
        ${key !== 'snr' ? `<div class="row"><span class="tag ok">${targetText(key)}</span></div>` : ''}
        <div class="callout"><b>Cómo mejorarla:</b> ${esc(h.improve)}</div>${exerciseChips(h.exercises)}</div>`;
    } else {
      const h = E.data.HELP.DIMENSION_HELP[key], dim = E.data.DIMENSIONS.find(d => d.key === key);
      if (!h || !dim) return;
      title = dim.label;
      body = `<div class="stack"><div><div class="card-title">Qué mide</div><p class="muted mt">${esc(h.what)}</p></div>
        <div><div class="card-title">Cómo se calcula</div><p class="muted mt">${esc(h.how)} Puntaje final = 60% medición objetiva + 40% evaluación subjetiva.</p></div>${exerciseChips(h.exercises)}</div>`;
    }
    const m = modal({ title, body, actions: [{ label: 'Entendido', cls: 'primary' }] });
    $$('[data-help-ex]', m.el).forEach(b => b.onclick = () => { m.close(); E.forms.exercise(b.dataset.helpEx); });
  }

  const METRIC_ORDER = ['accuracy', 'mpt', 'ddk', 'fillersPerMin', 'f0SdSt', 'fallingPct', 'wpm', 'longPausesPerMin', 'mattr', 'snr'];

  function metricsBlock(m, { focus = null, keys = null } = {}) {
    if (!m) return '';
    const list = (keys || METRIC_ORDER).filter(k => isNum(m[k]) && !(k === 'mpt' && keys === null && !isNum(m.accuracy) && m.mpt < 1));
    if (focus && list.includes(focus)) { list.splice(list.indexOf(focus), 1); list.unshift(focus); }

      return `<div class="metric ${k === focus ? 'focus' : ''}"><div class="l">${E.data.METRICS[k].label}${est} ${helpBtn(k)}</div><div class="v">${fmt.metric(k, m[k])}</div>
        <div class="s">${k === 'snr' ? '' : `<span class="tag ${st}">${st === 'ok' ? '✓ ' : ''}${targetText(k)}</span>`}</div></div>`;
    }).join('')}</div>`;

  function transcriptHtml(text) {
    if (!text) return '';
    const words = text.split(/\s+/);
    const fill = new Set(['eh', 'ehh', 'ehm', 'em', 'emm', 'mm', 'mmm', 'hmm', 'digamos']);
    return words.map((w, i) => {
      const n = E.audio.text.normalizeText(w);
      const next = E.audio.text.normalizeText(words[i + 1] || '');
      const prev = E.audio.text.normalizeText(words[i - 1] || '');
      const isF = fill.has(n) || (n === 'o' && next === 'sea') || (n === 'sea' && prev === 'o');
      return isF ? `<mark>${esc(w)}</mark>` : esc(w);

  }

  // ---------- panel de grabación ----------
  /**
   * opts: { kind, source, label, textId, refText, promptHtml, promptClass, topic, prep, countdown, maxSec, minSec,
   *         autoStop, withSR, question, focusMetric, pace:{words,wpm}, allowRetry, saveRecording, showResult,
   *         onResult(result, panel), continueLabel, onContinue(result) }

  function recordPanel(el, opts = {}) {
    const o = Object.assign({ maxSec: 120, minSec: 0, allowRetry: true, saveRecording: true, showResult: true, countdown: 0, prep: 0 }, opts);
    const srWanted = o.withSR !== undefined ? o.withSR : ['reading', 'spontaneous', 'presentation', 'exposure', 'speeds'].includes(o.kind);
    let rec = null, timers = [], destroyed = false, result = null;
    const clearTimers = () => { timers.forEach(t => clearInterval(t)); timers = []; };

    function shell(stage) {
      el.innerHTML = `<div class="recorder">
        ${o.question ? `<div class="callout info"><b>Pregunta de escucha:</b> ${esc(o.question)}</div>` : ''}
        ${o.topic ? `<div class="rec-prompt"><span class="eyebrow">Tema</span><div class="display" style="font-size:22px;margin-top:6px">${esc(o.topic)}</div></div>` : ''}
        ${o.promptHtml ? `<div class="rec-prompt ${o.promptClass || ''}">${o.promptHtml}</div>` : ''}
        ${o.pace ? `<div><div class="row between small muted"><span>Guía de ritmo a ${o.pace.wpm} ppm</span><span data-pace-t></span></div><div class="pace mt" style="margin-top:6px"><span data-pace style="width:0%"></span></div></div>` : ''}
        <div class="rec-stage">${stage}</div>
        ${srWanted && !E.audio.srAvailable() ? '<p class="tiny faint center">Tu navegador no tiene reconocimiento de voz: la velocidad será estimada y las muletillas sólo acústicas. Usa Chrome o Edge para medir todo.</p>' : ''}
      </div>`;

      shell(`<div class="rec-time">${fmt.clock(0)}</div>

      $('[data-start]', el).onclick = () => (o.prep ? prep() : o.countdown ? countdown() : start());
    }

    function prep() {
      let left = o.prep;
      shell(`<div class="muted">Piensa tu respuesta</div><div class="countdown" data-c>${left}</div><button class="btn ghost sm" data-skip>Empezar ya</button>`);
      const t = setInterval(() => { left--; const c = $('[data-c]', el); if (c) c.textContent = left; if (left <= 0) { clearTimers(); o.countdown ? countdown() : start(); } }, 1000);

    }

    function countdown() {
      let left = o.countdown;
      shell(`<div class="countdown" data-c>${left}</div><div class="muted">Prepárate…</div>`);
      beep(520, 90);
      const t = setInterval(() => { left--; const c = $('[data-c]', el); if (left <= 0) { clearTimers(); beep(880, 200); start(); } else { if (c) c.textContent = left; beep(520, 90); } }, 1000);
      timers.push(t);
    }

    async function start() {
      shell(`<canvas class="wave" width="800" height="120"></canvas><div class="rec-time" data-t>0:00</div>
        <button class="rec-btn stop live" data-stop aria-label="Detener"></button>
        <div class="row"><button class="btn ghost sm" data-cancel>Cancelar</button></div><div class="small muted" data-hint></div>`);
      const canvas = $('canvas', el), ctx2 = canvas.getContext('2d');
      const styles = getComputedStyle(document.documentElement);
      const strokeColor = styles.getPropertyValue('--accent').trim() || '#FF8A3D';
      rec = new E.audio.Recorder();
      let elapsed = 0;
      try {
        await rec.start({
          withSR: srWanted && E.audio.srAvailable(),
          maxSec: o.maxSec,
          onAutoStop: () => stop(),
          onTick: s => {
            elapsed = s;
            const t = $('[data-t]', el); if (t) t.textContent = fmt.clock(o.autoStop ? Math.max(0, o.maxSec - s) : s);
            const hint = $('[data-hint]', el);
            if (hint) hint.textContent = o.minSec && s < o.minSec ? `Sigue hablando: mínimo ${o.minSec} s` : '';
            if (o.pace) {
              const p = Math.min(100, (s / 60) * o.pace.wpm / o.pace.words * 100);
              const bar = $('[data-pace]', el); if (bar) bar.style.width = p + '%';
              const pt = $('[data-pace-t]', el); if (pt) pt.textContent = `${Math.round(p)}% del texto`;
            }
          },
          onLevel: buf => {
            const w = canvas.width, h = canvas.height;
            ctx2.clearRect(0, 0, w, h);
            ctx2.lineWidth = 3; ctx2.strokeStyle = strokeColor; ctx2.beginPath();
            const step = Math.ceil(buf.length / w);
            for (let i = 0, x = 0; i < buf.length; i += step, x++) {
              const y = h / 2 + buf[i] * h * 1.6;
              if (x === 0) ctx2.moveTo(x, y); else ctx2.lineTo(x, y);
            }
            ctx2.stroke();
          }
        });
      } catch (err) {
        shell(`<div class="callout err" style="text-align:left"><b>No se pudo usar el micrófono.</b><br><span class="small">${esc(err.message || err)}</span><br><span class="small">Revisa el permiso del micrófono y abre la app con el servidor local (ver README).</span></div><button class="btn" data-retry>Reintentar</button>`);
        $('[data-retry]', el).onclick = idle;
        return;
      }
      $('[data-stop]', el).onclick = () => {
        if (o.minSec && elapsed < o.minSec) { toast(`Graba al menos ${o.minSec} segundos`); return; }
        stop();
      };
      $('[data-cancel]', el).onclick = () => { rec.cancel(); idle(); };
    }

    async function stop() {
      if (!rec || rec.state !== 'recording') return;
      shell(`<div class="spinner"></div><div class="muted">Analizando tu voz…</div>`);
      let out;
      try {
        out = await rec.stop();
        const metrics = await E.audio.analyzeBlob(out.blob, {
          sex: (E.store.get().profile || {}).sex || 'na', kind: o.kind, transcript: out.transcript, refText: o.refText
        });
        metrics.srUsed = out.srUsed;
        let saved = null;
        if (o.saveRecording) {
          saved = await E.records.save({ blob: out.blob, durationMs: out.durationMs, transcript: out.transcript, metrics, kind: o.kind, source: o.source, label: o.label, textId: o.textId, ref: o.ref });
        }
        result = { rec: saved, metrics, transcript: out.transcript, durationMs: out.durationMs, blob: out.blob };
      } catch (err) {
        console.error(err);
        shell(`<div class="callout err">No se pudo analizar la grabación: ${esc(err.message || err)}</div><button class="btn" data-retry>Reintentar</button>`);
        $('[data-retry]', el).onclick = idle;
        return;
      }
      if (destroyed) return;
      showResult();
      o.onResult && o.onResult(result, api);
    }

    function showResult() {
      if (!o.showResult) return;
      const m = result.metrics;
      const noise = isNum(m.snr) && m.snr < 15;
      const noVoice = !m.speechSec;
      el.innerHTML = `<div class="recorder">
        ${noVoice ? '<div class="callout err">No se detectó voz. Revisa el micrófono e inténtalo de nuevo.</div>' : ''}
        ${noise && !noVoice ? `<div class="callout warn">Hay mucho ruido de fondo (${Math.round(m.snr)} dB). Las métricas pueden ser poco confiables.</div>` : ''}
        ${metricsBlock(m, { focus: o.focusMetric })}
        ${result.transcript ? `<details><summary class="small muted" style="cursor:pointer;font-weight:800">Ver transcripción</summary><div class="transcript mt">${transcriptHtml(result.transcript)}</div></details>` : ''}
        <div data-extra></div>
        <div class="row" style="justify-content:flex-end">
          ${o.allowRetry ? '<button class="btn ghost" data-again>Grabar de nuevo</button>' : ''}
          ${o.onContinue ? `<button class="btn go" data-continue>${esc(o.continueLabel || 'Continuar')}</button>` : ''}
        </div></div>`;
      const again = $('[data-again]', el);
      if (again) again.onclick = () => { result = null; idle(); };
      const cont = $('[data-continue]', el);
      if (cont) cont.onclick = () => o.onContinue(result);
    }

    const api = {
      destroy() { destroyed = true; clearTimers(); if (rec && rec.state === 'recording') rec.cancel(); },
      extra(html) { const x = $('[data-extra]', el); if (x) x.innerHTML = html; },
      get result() { return result; }
    };
    idle();
    return api;
  }

})(window.EVCS);

        ${fs.visible ? `<div class="card raised mt" data-firststeps>
          <div class="row between"><div><div class="eyebrow">Primeros pasos · ${fs.doneCount} de ${fs.steps.length}</div><h2 class="display" style="margin-top:6px">Empieza con buen pie</h2></div>
            <button class="link-btn small" data-fs-hide>Ocultar</button></div>
          <div class="bar thin accent mt"><span style="width:${fs.doneCount / fs.steps.length * 100}%"></span></div>
          <div class="list mt">${fs.steps.map(s => `<div class="list-item"><div class="avatar" style="${s.done ? 'opacity:.55' : ''}">${s.done ? '✅' : s.icon}</div>
            <div class="grow"><b style="${s.done ? 'text-decoration:line-through;opacity:.6' : ''}">${s.title}</b>${s.done ? '' : `<div class="small muted">${s.text}</div>`}</div>
            ${s.done ? '' : s.href ? `<a class="btn sm ${s === nextStep ? 'primary' : 'ghost'}" href="${s.href}">${s.cta}</a>` : `<button class="btn sm ${s === nextStep ? 'primary' : 'ghost'}" data-fs="${s.action}">${s.cta}</button>`}</div>`).join('')}</div>
        </div>` : ''}
        ${!base && !fs.visible ? `<div class="hero"><div class="hero-inner row between gap-lg"><div style="max-width:560px"><div class="eyebrow">Paso 1</div><h2 class="display mt">Mide tu punto de partida</h2><p class="muted mt">Tu diagnóstico EVCS-100 personaliza el plan y será la referencia de tu avance. 6 pruebas cortas, unos 20 minutos.</p></div><a class="btn primary big" href="#/diagnostico">Hacer diagnóstico</a></div></div>` : ''}

        <div class="grid grid-3 mt">
          <div class="card raised span-2">
            <div class="row between"><div><div class="eyebrow">Bloque de ${E.planner.BLOCK_LABEL[block].toLowerCase()}</div><h2 class="display" style="margin-top:6px">${E.planner.BLOCK_PURPOSE[block]}</h2></div>
              <div class="chips">${['morning', 'midday', 'night'].map(b => `<span class="tag ${doneBlocks.has(b) ? 'ok' : ''}">${doneBlocks.has(b) ? '✓' : '○'} ${E.planner.BLOCK_LABEL[b]}</span>`).join('')}</div></div>
            ${p.gentle ? '<div class="callout warn mt small">Modo suave activo: sesiones sin potencia ni proyección.</div>' : ''}
            <div class="mt"><div class="small muted" style="font-weight:800">¿Cómo está tu voz hoy? (fatiga 1–10)</div>
              <div class="chips fatigue mt" style="margin-top:8px">${Array.from({ length: 10 }, (_, i) => i + 1).map(n => `<button class="chip ${n > 6 ? 'warn' : ''} ${n === fatigue ? 'on' : ''}" data-f="${n}">${n}</button>`).join('')}</div>
              <div class="small mt" data-fnote style="margin-top:8px"></div></div>
            <div class="mt"><div class="small muted" style="font-weight:800">Tiempo disponible</div>
              <div class="chips" style="margin-top:8px">${[5, 15, 30, 60, 90].map(m => `<button class="chip ${m === minutes ? 'on' : ''}" data-m="${m}">${m} min</button>`).join('')}</div></div>
            <div class="mt-lg"><button class="btn go big block" data-start>▶ Empezar sesión</button></div>
          </div>

          <div class="card stack" style="align-items:center;text-align:center">
            ${E.ui.ring(lv.progress, { size: 140, stroke: 14, label: `<div style="font-size:30px">👑</div><b style="font-size:18px">Nivel ${lv.level}</b><div class="tiny muted">${esc(lv.name)}</div>` })}
            <div class="small muted">${lv.next ? (lv.blockedByIndex ? `Necesitas índice EVCS ≥ ${lv.next.minIndex} para ${esc(lv.next.name)}` : `${fmt.num(lv.next.minXp - lv.xp)} XP para ${esc(lv.next.name)}`) : 'Nivel máximo'}</div>
            <div class="row" style="justify-content:center"><span class="pill fire">🔥 ${streak.current} días</span><span class="pill" title="Comodines de racha esta semana">🛟 ${streak.freezesLeft}</span></div>
            <div class="tiny faint">${streak.todayDone ? 'Hoy ya cuenta para tu racha' : '5 minutos bastan para mantener tu racha'}</div>
          </div>
        </div>

        ${alerts.length ? `<div class="grid grid-${Math.min(3, alerts.length)} mt">${alerts.map((a, i) => `<div class="card row between"><div class="row" style="flex-wrap:nowrap"><div class="avatar">${a.icon}</div><div><div class="card-title">${esc(a.title)}</div><div class="small muted">${esc(a.text)}</div></div></div>${a.href ? `<a class="btn info sm" href="${a.href}">${a.cta}</a>` : `<button class="btn info sm" data-alert="${i}">${a.cta}</button>`}</div>`).join('')}</div>` : ''}

        ${E.cloud && !fs.visible && E.cloud.backupDue() ? `<div class="card mt row between" style="border-color:var(--gold)"><div class="row" style="flex-wrap:nowrap"><div class="avatar">🛟</div><div>
            <div class="card-title">Respalda tu avance</div><div class="small muted">${E.cloud.config().enabled ? 'Tu respaldo en la nube no se ha actualizado en 7 días.' : 'Tu progreso vive sólo en este navegador. Respáldalo para no perderlo.'}</div></div></div>
            <div class="row">${E.cloud.config().enabled ? '<button class="btn sm info" data-bsync>Respaldar ahora</button>' : '<button class="btn sm info" data-bcloud>☁️ Activar nube</button><button class="btn sm ghost" data-bfile>⬇ Archivo</button>'}</div></div>` : ''}

        ${(() => {
          const sod = E.diction.soundOfDay();
          const m = sod && E.diction.soundState(sod.id) ? E.diction.soundState(sod.id).mastery : null;
          return `<div class="card mt row between"><div class="row" style="flex-wrap:nowrap"><div class="avatar">🗣️</div><div>
            <div class="eyebrow">Modo Dicción</div>
            <div class="card-title" style="margin-top:2px">${sod ? `Sonido del día: ${esc(sod.name)}` : 'Haz tu chequeo de sonidos'}</div>
            <div class="small muted">${sod ? `Dominio ${m === null ? '—' : m} · 8–10 minutos` : '5 minutos para medir los 11 sonidos difíciles del español'}</div></div></div>
            <a class="btn ${sod ? 'go' : 'primary'}" href="${sod ? `#/diccion/sonido/${sod.id}` : '#/diccion/chequeo'}">${sod ? 'Entrenar' : 'Hacer chequeo'}</a></div>`;
        })()}

        <div class="grid grid-3 mt">
          <div class="card">
            <div class="eyebrow">Foco de la semana</div>
            <div class="card-title mt">${esc(mdef.label)}</div>
            <div class="row mt" style="align-items:baseline"><span class="kpi-value">${focusVal === null ? '—' : fmt.metric(W.metric, focusVal)}</span><span class="tag ${E.ui.metricStatus(W.metric, focusVal)}">${E.ui.targetText(W.metric)}</span></div>
            <p class="small muted mt">${focusVal === null ? 'Aún no hay grabaciones esta semana.' : 'Promedio de los últimos 7 días.'}</p>
            <p class="small mt">🎧 ${esc(W.question)}</p>
          </div>
          <div class="card">
            <div class="eyebrow">Esta semana</div>
            <div class="card-title mt">${esc(W.title)}</div>
            <ul class="small muted" style="padding-left:18px;margin:10px 0">${W.objectives.map(o => `<li>${esc(o)}</li>`).join('')}</ul>
            <a class="link-btn small" href="#/plan">Ver plan completo →</a>
          </div>
          <div class="card">
            <div class="eyebrow">Transferencia</div>
            <div class="card-title mt">Exposición real</div>
            <p class="small muted mt">${esc(W.task)}</p>
            <div class="row mt"><button class="btn sm" data-expo>Registrar exposición</button><button class="btn ghost sm" data-prep>Rutina 90 s</button><a class="btn ghost sm" href="#/escenario/preguntas">🔥 Preguntas difíciles</a></div>
          </div>
        </div>

        ${recentBadges.length ? `<div class="section-title"><h2 class="display">Logros recientes</h2><a class="link-btn small" href="#/progreso">Ver todos</a></div>
          <div class="badges">${recentBadges.map(b => `<div class="badge on"><div class="b-ico">${b.icon}</div><div class="b-name">${esc(b.name)}</div></div>`).join('')}</div>` : ''}
      `;

      const fnote = $('[data-fnote]', el);
      const setFatigueNote = () => {
        fnote.innerHTML = fatigue > 6 ? '<span class="tag bad">Fatiga alta</span> <span class="muted">Hoy toca sesión suave de 5 minutos. Descansar también suma XP.</span>' : '';
      };
      setFatigueNote();
      $$('[data-f]', el).forEach(b => b.onclick = () => {
        fatigue = +b.dataset.f;
        $$('[data-f]', el).forEach(x => x.classList.toggle('on', +x.dataset.f === fatigue));
        E.store.update(s => { s.dailyLogs[today] = Object.assign({}, s.dailyLogs[today], { fatigue }); });
        setFatigueNote();
      });
      $$('[data-m]', el).forEach(b => b.onclick = () => { minutes = +b.dataset.m; $$('[data-m]', el).forEach(x => x.classList.toggle('on', +x.dataset.m === minutes)); });
      $('[data-start]', el).onclick = () => {
        const recentPain = Object.entries(st.dailyLogs).some(([d, v]) => v.pain && (Date.now() - new Date(d + 'T12:00:00')) < 2 * 864e5);
        const plan = E.planner.build({ week, minutes, fatigue, soft: p.gentle || recentPain, block, day: today });
        E.store.update(s => {
          s.dailyLogs[today] = Object.assign({}, s.dailyLogs[today], { fatigue });
          s.activeSession = { id: E.store.uid(), startedAt: new Date().toISOString(), day: today, block, fatigue, plan, index: 0 };
        });
        E.app.go('#/sesion');
      };
      const discard = $('[data-discard]', el);
      if (discard) discard.onclick = () => { E.store.update(s => { s.activeSession = null; }); E.app.render(); };
      $('[data-expo]', el).onclick = () => E.forms.exposure(() => E.app.render());
      const fsHide = $('[data-fs-hide]', el);
      if (fsHide) fsHide.onclick = () => { E.store.update(s => { s.profile.firstStepsDismissed = true; }); E.ui.toast('Puedes volver a verlos en Perfil'); E.app.render(); };
      $$('[data-fs]', el).forEach(b => b.onclick = () => {
        const a = b.dataset.fs;
        if (a === 'scroll') { const t = $('[data-start]', el); if (t) { t.scrollIntoView({ behavior: 'smooth', block: 'center' }); t.focus(); } }
        if (a === 'install') { E.app.showInstall(); }
        if (a === 'backup') {
          E.ui.modal({
            title: 'Respalda tu avance',
            body: '<p class="muted">Tu progreso vive en este navegador. Elige cómo protegerlo:</p><div class="stack mt"><div class="callout info small"><b>☁️ En la nube</b> (recomendado): se respalda solo cada vez que practicas y lo recuperas en cualquier teléfono con tu código.</div><div class="callout small"><b>⬇ Archivo</b>: descargas una copia ahora; tendrás que repetirlo cada semana.</div></div>',
            actions: [{ label: '⬇ Archivo', cls: 'ghost', onClick: () => { E.cloud.downloadBackup(); E.ui.toast('Respaldo descargado', 'ok'); E.app.render(); } },
              { label: '☁️ En la nube', cls: 'info', onClick: () => { setTimeout(() => E.forms.cloudEnable(() => E.app.render()), 50); } }]
          });
        }
      });
      const bsync = $('[data-bsync]', el); if (bsync) bsync.onclick = async () => { const ok = await E.cloud.push(); E.ui.toast(ok ? 'Respaldado en la nube' : 'No se pudo respaldar ahora', ok ? 'ok' : 'error'); E.app.render(); };
      const bcloud = $('[data-bcloud]', el); if (bcloud) bcloud.onclick = () => E.forms.cloudEnable(() => E.app.render());
      const bfile = $('[data-bfile]', el); if (bfile) bfile.onclick = () => { E.cloud.downloadBackup(); E.ui.toast('Respaldo descargado', 'ok'); E.app.render(); };
      $('[data-prep]', el).onclick = () => E.forms.preScene();
      $$('[data-alert]', el).forEach(b => b.onclick = () => { if (alerts[+b.dataset.alert].action === 'review') E.forms.review(() => E.app.render()); });
    }
  };
})(window.EVCS);

</script>
  <script>/* js/views/assessment.js */
/* EVCS Web · Vistas: diagnóstico EVCS-100 y resultado */
(function (E) {
  'use strict';
  E.views = E.views || {};
  const { esc, $, $$, fmt, isNum } = E.ui;
  const STEPS = E.data.ASSESSMENT_STEPS;

  const ANCHOR_HINTS = {
    clarity: 'Te entienden a la primera, sin repetir',
    articulation: 'Cada sonido completo, también rápido',
    resonance: 'Voz llena que no se cansa',
    authority: 'Sueno seguro: cierres firmes, sin muletillas',
    presence: 'Me ven estable, con mirada y energía',
    persuasion: 'Mi mensaje cambia lo que la gente hace',
    vocabulary: 'Uso palabras precisas y variadas',
    speed: 'Controlo el ritmo según el contenido',
    expressivity: 'Mi voz tiene melodía y color'
  };

  function findInProgress() {
    const st = E.store.get();
    return st.assessments.find(a => a.status === 'in_progress' && (Date.now() - new Date(a.date)) < 7 * 864e5) || null;
  }

  function saveAssessment(a) {
    E.store.update(s => {
      const i = s.assessments.findIndex(x => x.id === a.id);
      if (i >= 0) s.assessments[i] = a; else s.assessments.push(a);
    });
  }

  E.views.diagnostico = {
    render(el, route) {
      const st = E.store.get();
      const hasBase = !!E.game.baseline();
      let a = findInProgress();
      let panel = null;
      const destroyPanel = () => { if (panel) { panel.destroy(); panel = null; } };

      E.app.setTitle(`<div class="eyebrow">Diagnóstico</div><h1 class="display" style="margin-top:6px">EVCS-100</h1>`);

      function intro() {
        const kind = hasBase ? 'reassessment' : 'baseline';
        el.innerHTML = `<div class="hero"><div class="hero-inner">
            <div class="eyebrow">${kind === 'baseline' ? 'Línea base' : `Reevaluación · semana ${st.program.week}`}</div>
            <h2 class="display mt">${kind === 'baseline' ? 'Vamos a medir tu punto de partida' : 'Mide cuánto has avanzado'}</h2>
            <p class="muted mt">6 pruebas cortas, unos 20 minutos. Busca un lugar silencioso, usa el micrófono del equipo (no audífonos Bluetooth) y habla a 30–50 cm.</p>
          </div></div>
          <div class="grid grid-3 mt">${STEPS.map(s => `<div class="card"><div class="row"><div class="avatar">${s.n}</div><div><div class="card-title">${esc(s.title)}</div><div class="small muted">${s.time}</div></div></div></div>`).join('')}</div>
          ${E.audio.srAvailable() ? '' : '<div class="callout warn mt">Tu navegador no tiene reconocimiento de voz. Podrás hacer el diagnóstico, pero claridad, muletillas y vocabulario se medirán de forma parcial. Para la medición completa usa Chrome o Edge.</div>'}
          <div class="mt-lg row"><button class="btn primary big" data-begin>Comenzar</button><a class="btn ghost" href="#/hoy">Ahora no</a></div>`;
        $('[data-begin]', el).onclick = () => {
          a = { id: E.store.uid(), kind, week: st.program.week, date: new Date().toISOString(), status: 'in_progress', steps: {}, selfRatings: null };
          saveAssessment(a);
          next();
        };
      }

      function nextStepNumber() {
        for (const s of STEPS) if (!a.steps[s.n]) return s.n;
        return null;
      }

      function next() {
        destroyPanel();
        const n = nextStepNumber();
        if (n === null) return a.selfRatings ? compute() : selfRating();
        renderStep(n);
      }

      function header(n) {
        const s = STEPS[n - 1];
        return `<div class="session-progress">${STEPS.map(x => `<span class="${a.steps[x.n] ? 'done' : x.n === n ? 'cur' : ''}"></span>`).join('')}<span class="${a.selfRatings ? 'done' : ''}"></span></div>
          <div class="row between"><div><div class="eyebrow">Prueba ${n} de 6 · ${s.time}</div><h2 class="display" style="margin-top:6px">${esc(s.title)}</h2></div>
          <button class="link-btn small" data-skip>Omitir esta prueba</button></div>
          <p class="muted mt">${esc(s.instruction)}</p>`;
      }

      function completeStep(n, metrics, recIds) {
        a.steps[n] = { metrics, recIds: recIds || [], date: new Date().toISOString() };
        saveAssessment(a);
        next();
      }

      function bindSkip(n) {
        $('[data-skip]', el).onclick = async () => {
          if (await E.ui.confirmDialog('Si omites esta prueba, las dimensiones que dependen de ella se calcularán con menos datos.', { okLabel: 'Omitir' })) {
            a.steps[n] = { metrics: null, skipped: true };
            saveAssessment(a);
            next();
          }
        };
      }

      function renderStep(n) {
        const s = STEPS[n - 1];
        el.innerHTML = `${header(n)}<div class="card raised mt" data-body></div>`;
        bindSkip(n);
        const body = $('[data-body]', el);
        const label = `Diagnóstico · ${s.title}`;

        if (n === 1) {
          const attempts = [];
          const draw = () => {
            destroyPanel();
            const best = attempts.length ? Math.max(...attempts.map(x => x.mpt)) : null;
            body.innerHTML = `<div class="row between"><div class="chips">${attempts.map((x, i) => `<span class="tag ${x.mpt === best ? 'ok' : ''}">Intento ${i + 1}: ${fmt.num(x.mpt, 1)} s</span>`).join('') || '<span class="muted small">Sin intentos aún</span>'}</div>
              ${attempts.length ? `<button class="btn go" data-done>Continuar con ${fmt.num(best, 1)} s</button>` : ''}</div>
              <div class="mt" data-rec></div>`;
            if (attempts.length < s.attempts) {
              panel = E.ui.recordPanel($('[data-rec]', body), {
                kind: 'mpt', source: 'assessment', label, maxSec: s.maxSec, withSR: false, showResult: false, allowRetry: false,
                promptHtml: '<div class="center"><span class="display" style="font-size:40px">/a/</span><div class="muted small">Sostén la vocal con calma, sin apretar</div></div>',
                onResult: res => { attempts.push({ mpt: res.metrics.mpt || 0, id: res.rec && res.rec.id }); draw(); }
              });
            }
            const done = $('[data-done]', body);
            if (done) done.onclick = () => completeStep(1, { mpt: best }, attempts.map(x => x.id));
          };
          draw();
        } else if (n === 2) {
          panel = E.ui.recordPanel(body, {
            kind: 'reading', source: 'assessment', label, textId: 'base', refText: E.data.TEXTS.base, maxSec: s.maxSec, minSec: s.minSec,
            promptHtml: esc(E.data.TEXTS.base), promptClass: 'reading', focusMetric: 'accuracy', continueLabel: 'Siguiente prueba',
            onContinue: res => completeStep(2, res.metrics, [res.rec && res.rec.id])
          });
        } else if (n === 3) {
          panel = E.ui.recordPanel(body, {
            kind: 'ddk', source: 'assessment', label, maxSec: s.maxSec, autoStop: true, countdown: s.countdown, withSR: false, focusMetric: 'ddk',
            promptHtml: '<div class="center"><span class="display" style="font-size:40px">pa · ta · ka</span><div class="muted small">Rápido y preciso, durante 5 segundos</div></div>',
            continueLabel: 'Siguiente prueba', onContinue: res => completeStep(3, res.metrics, [res.rec && res.rec.id])
          });
        } else if (n === 4) {
          const topics = E.data.TEXTS.topics;
          panel = E.ui.recordPanel(body, {
            kind: 'spontaneous', source: 'assessment', label, topic: topics[Math.floor(Math.random() * topics.length)], prep: s.prep,
            maxSec: s.maxSec, minSec: s.minSec, focusMetric: 'fillersPerMin', continueLabel: 'Siguiente prueba',
            onContinue: res => completeStep(4, res.metrics, [res.rec && res.rec.id])
          });
        } else if (n === 5) {
          const words = E.audio.text.tokenize(E.data.TEXTS.speeds).length;
          const results = [];
          const drawSpeed = () => {
            destroyPanel();
            const k = results.length;
            if (k === 3) {
              const hits = results.filter(r => r.hit).length;
              body.innerHTML = `<div class="stack">${results.map((r, i) => `<div class="row between"><b>${['Lento', 'Medio', 'Rápido'][i]} · objetivo ${s.targets[i]} ppm</b><span class="tag ${r.hit ? 'ok' : 'warn'}">${r.hit ? '✓' : '✗'} ${fmt.num(r.wpm)} ppm</span></div>`).join('')}
                <div class="callout ${hits >= 2 ? '' : 'warn'}">Lograste ${hits} de 3 velocidades dentro de ±10%.</div>
                <div class="row" style="justify-content:flex-end"><button class="btn ghost" data-redo>Repetir las tres</button><button class="btn go" data-done>Siguiente prueba</button></div></div>`;
              $('[data-redo]', body).onclick = () => { results.length = 0; drawSpeed(); };
              $('[data-done]', body).onclick = () => completeStep(5, { wpms: results.map(r => r.wpm), hits, accuracyFast: results[2].accuracy }, results.map(r => r.id));
              return;
            }
            const target = s.targets[k];
            body.innerHTML = `<div class="row between"><div class="chips">${s.targets.map((t, i) => `<span class="tag ${i < k ? (results[i].hit ? 'ok' : 'warn') : i === k ? 'warn' : ''}">${['Lento', 'Medio', 'Rápido'][i]} ${t} ppm${i < k ? ` → ${fmt.num(results[i].wpm)}` : ''}</span>`).join('')}</div></div><div class="mt" data-rec></div>`;
            panel = E.ui.recordPanel($('[data-rec]', body), {
              kind: 'speeds', source: 'assessment', label: `${label} (${target} ppm)`, refText: E.data.TEXTS.speeds, textId: 'speeds',
              promptHtml: esc(E.data.TEXTS.speeds), promptClass: 'reading', pace: { words, wpm: target }, maxSec: Math.ceil(words / target * 60 * 1.8),
              showResult: false, allowRetry: false,
              onResult: res => {
                const m = res.metrics;
                const sec = m.speechSec || res.durationMs / 1000;
                const wpm = sec > 0 ? words / (sec / 60) : 0;
                results.push({ wpm: Math.round(wpm), hit: Math.abs(wpm - target) / target <= 0.10, accuracy: m.accuracy, id: res.rec && res.rec.id });
                drawSpeed();
              }
            });
          };
          drawSpeed();
        } else if (n === 6) {
          panel = E.ui.recordPanel(body, {
            kind: 'presentation', source: 'assessment', label, maxSec: s.maxSec, minSec: s.minSec, focusMetric: 'fallingPct',
            promptHtml: `<b>${esc(E.data.TEXTS.gateTopic)}</b><div class="small muted mt">Estructura sugerida: gancho → problema → propuesta → 2 pruebas → llamado a la acción. Ponte de pie.</div>`,
            continueLabel: 'Ir a la autoevaluación', onContinue: res => completeStep(6, res.metrics, [res.rec && res.rec.id])
          });
        }
      }

      function selfRating() {
        const vals = {};
        E.data.DIMENSIONS.forEach(d => { vals[d.key] = 50; });
        const pres = (E.store.get().practice.presence || []).slice(-3).map(x => x.score);
        const presRef = pres.length ? Math.round(pres.reduce((a, b) => a + b, 0) / pres.length) : null;
        if (presRef) vals.presence = presRef;
        el.innerHTML = `<div class="session-progress">${STEPS.map(() => '<span class="done"></span>').join('')}<span class="cur"></span></div>
          <div class="eyebrow">Último paso</div><h2 class="display" style="margin-top:6px">Autoevaluación</h2>
          <p class="muted mt">Califícate con honestidad de 1 a 100. 50 = competente en situaciones cómodas. Se usa como el 40% subjetivo mientras no tengas evaluadores externos.</p>
          <div class="card raised mt stack">${E.data.DIMENSIONS.map(d => `<div><div class="slider-row"><b>${d.label}</b><input type="range" min="1" max="100" value="${vals[d.key]}" data-r="${d.key}"><b data-v="${d.key}" class="center">${vals[d.key]}</b></div><div class="tiny faint" style="margin-left:0">100 = ${esc(ANCHOR_HINTS[d.key])}${d.key === 'presence' && presRef ? ` · <b>sugerido por tus videos de presencia: ${presRef}</b>` : ''}</div></div>`).join('')}</div>
          <div class="mt-lg row" style="justify-content:flex-end"><button class="btn primary big" data-calc>Calcular mi EVCS-100</button></div>`;
        $$('[data-r]', el).forEach(r => r.oninput = () => { vals[r.dataset.r] = +r.value; $(`[data-v="${r.dataset.r}"]`, el).textContent = r.value; });
        $('[data-calc]', el).onclick = () => { a.selfRatings = vals; saveAssessment(a); compute(); };
      }

      function compute() {
        const sex = (E.store.get().profile || {}).sex || 'na';
        const r = E.scoring.compute(a.steps, a.selfRatings, sex);
        a.scores = r.scores; a.index = r.index; a.provisional = r.provisional; a.variables = r.variables; a.dims = r.dims;
        a.status = 'completed'; a.completedAt = new Date().toISOString();
        saveAssessment(a);
        const xp = E.game.award('assessment', 100, a.id);
        E.app.go(`#/resultado/${a.id}`);
        setTimeout(() => E.app.rewards({ xp, icon: '📏', title: r.index !== null ? `Tu EVCS-100: ${Math.round(r.index)}` : 'Diagnóstico completo', text: r.index !== null ? `Nivel ${E.scoring.band(r.index).name}.` : 'Faltan datos para calcular el índice: completa más pruebas en tu próxima evaluación.' }), 250);
      }

      if (a && (route.query.tipo !== 'reevaluacion' || a.kind === 'reassessment')) {
        el.innerHTML = `<div class="card raised row between"><div><div class="card-title">Tienes un diagnóstico sin terminar</div><p class="muted small">${Object.keys(a.steps).length} de 6 pruebas completadas · ${fmt.date(a.date)}</p></div>
          <div class="row"><button class="btn ghost" data-new>Empezar de nuevo</button><button class="btn primary" data-resume>Continuar</button></div></div>`;
        $('[data-resume]', el).onclick = next;
        $('[data-new]', el).onclick = () => { E.store.update(s => { const x = s.assessments.find(z => z.id === a.id); if (x) x.status = 'void'; }); a = null; intro(); };
      } else intro();

      return destroyPanel;
    }
  };

  // ---------- Resultado ----------
  E.views.resultado = {
    render(el, route) {
      const st = E.store.get();
      const a = st.assessments.find(x => x.id === route.params[0]) || E.game.latestAssessment();
      if (!a || a.status !== 'completed') { el.innerHTML = '<div class="empty"><span class="e-ico">📏</span>No hay resultados todavía. <a href="#/diagnostico">Haz tu diagnóstico</a>.</div>'; return; }
      const base = E.game.baseline();
      const compare = base && base.id !== a.id ? base : null;
      const band = E.scoring.band(a.index);
      const { strengths, priorities } = E.scoring.ranking(a.scores);
      const v = a.variables || {};
      E.app.setTitle(`<div class="eyebrow">${a.kind === 'baseline' ? 'Línea base' : 'Reevaluación'} · ${fmt.date(a.completedAt || a.date)}</div><h1 class="display" style="margin-top:6px">Resultado EVCS-100</h1>`);
      const delta = compare && isNum(a.index) && isNum(compare.index) ? a.index - compare.index : null;
      const values = obj => { const o = {}; E.data.DIMENSIONS.forEach(d => { o[d.key] = obj.scores[d.key] && obj.scores[d.key].D; }); return o; };
      const varRows = [
        ['Precisión de lectura', v.a_r, '%', 1], ['Precisión a velocidad rápida', v.a_f, '%', 1], ['Pa-ta-ka (secuencias en 5 s)', v.d, '', 0],
        ['Tiempo máximo de fonación', v.t, 's', 1], ['Cierres descendentes', v.p, '%', 0], ['Muletillas por minuto', v.u, '/min', 1],
        ['Diversidad léxica (MATTR)', v.m, '', 2], ['Velocidades logradas', v.h, 'de 3', 0], ['Variación de tono', v.s, 'st', 1]
      ];

      el.innerHTML = `
        <div class="grid grid-3">
          <div class="card raised stack" style="align-items:center;text-align:center">
            ${E.ui.ring(isNum(a.index) ? a.index / 100 : 0, { size: 190, stroke: 16, label: `<div class="kpi-value" style="font-size:54px">${isNum(a.index) ? Math.round(a.index) : '—'}</div><div class="small muted">de 100</div>` })}
            <div class="row" style="justify-content:center">${band ? `<span class="tag ok" style="font-size:14px">${band.name}</span>` : ''}${a.provisional ? '<span class="tag warn">Provisional</span>' : ''}</div>
            ${delta !== null ? `<div class="kpi-label">vs. línea base: <b class="delta ${delta >= 0 ? 'up' : 'down'}">${delta >= 0 ? '+' : ''}${fmt.num(delta, 1)}</b> ${Math.abs(delta) >= E.scoring.MDC.index ? '<span class="tag ok">mejora real</span>' : '<span class="tag">dentro del margen</span>'}</div>` : ''}
          </div>
          <div class="card span-2">
            <div class="card-head"><div class="card-title">Tus 9 dimensiones</div><div class="legend"><span><i style="background:var(--accent)"></i>Esta evaluación</span>${compare ? '<span><i style="background:var(--blue)"></i>Línea base</span>' : ''}</div></div>
            ${E.ui.radar([...(compare ? [{ values: values(compare), color: 'var(--blue)', fill: 0.06, dash: true }] : []), { values: values(a), color: 'var(--accent)' }])}
          </div>
        </div>
        <div class="grid grid-2 mt">
          <div class="card"><div class="card-title">💪 Fortalezas</div><div class="stack mt">${strengths.map(s => `<div class="row between"><b>${s.label}</b><span class="tag ok">${Math.round(s.D)}</span></div>`).join('')}</div></div>
          <div class="card"><div class="card-title">🎯 Prioridades del plan</div><div class="stack mt">${priorities.map(s => `<div class="row between"><b>${s.label}</b><span class="tag warn">${Math.round(s.D)}</span></div>`).join('')}</div>
            <p class="small muted mt">El plan diario añade ejercicios para estas dimensiones.</p></div>
        </div>
        <div class="card mt">
          <div class="card-head"><div class="card-title">Detalle por dimensión</div><span class="small muted">D = 0.6·Objetivo + 0.4·Subjetivo</span></div>
          ${E.data.DIMENSIONS.map(d => {
            const sc = a.scores[d.key] || {};
            const prev = compare && compare.scores[d.key] ? compare.scores[d.key].D : null;
            return `<div class="dim-row"><b>${d.label} ${E.ui.helpBtn(d.key, 'dim')}</b><div><div class="bar ${isNum(sc.D) && sc.D < 50 ? 'accent' : ''}"><span style="width:${isNum(sc.D) ? sc.D : 0}%"></span></div>
              <div class="tiny faint" style="margin-top:4px">Objetivo ${isNum(sc.O) ? Math.round(sc.O) : '—'} · Subjetivo ${isNum(sc.S) ? Math.round(sc.S) : '—'}${isNum(prev) && isNum(sc.D) ? ` · <span class="delta ${sc.D >= prev ? 'up' : 'down'}">${sc.D >= prev ? '+' : ''}${fmt.num(sc.D - prev, 1)}</span>` : ''}${!isNum(sc.O) && ['presence', 'persuasion'].includes(d.key) ? ' · requiere video o evaluadores' : ''}</div></div>
              <b class="center">${isNum(sc.D) ? Math.round(sc.D) : '—'}</b></div>`;
          }).join('')}
        </div>
        <div class="card mt">
          <div class="card-title">Mediciones de la batería</div>
          <table class="cmp mt"><thead><tr><th>Variable</th><th>Valor</th></tr></thead><tbody>
            ${varRows.map(([l, val, u, d]) => `<tr><td>${l}</td><td>${isNum(val) ? fmt.num(val, d) + (u ? ' ' + u : '') : '<span class="faint">sin dato</span>'}</td></tr>`).join('')}
          </tbody></table>
          ${a.provisional ? '<p class="small muted mt">Resultado provisional: el componente subjetivo usa tu autoevaluación (×0.8) y presencia y persuasión no tienen medición objetiva en esta versión.</p>' : ''}
        </div>
        <div class="row mt-lg" style="justify-content:flex-end"><a class="btn ghost" href="#/progreso">Ver progreso</a><a class="btn primary big" href="#/hoy">Ir a mi plan de hoy</a></div>`;
    }
  };
})(window.EVCS);

</script>
  <script>/* js/views/plan.js */
/* EVCS Web · Vistas: plan de 13 semanas, compuertas de fase y formularios compartidos */
(function (E) {
  'use strict';
  E.views = E.views || {};
  E.forms = E.forms || {};
  const { esc, $, $$, fmt, isNum } = E.ui;

  const gatePassed = n => { const g = E.store.get().program.gates[n]; return !!(g && g.passed); };
  const phaseOfWeek = w => E.data.PHASES.find(p => w >= p.weeks[0] && w <= p.weeks[1]);
  const isGateWeek = w => E.data.PHASES.some(p => p.weeks[1] === w);

  function daysPracticedThisWeek() {
    const st = E.store.get();
    const since = E.store.dayKey(st.program.weekStartedAt);
    return new Set(st.sessions.filter(s => s.completed && s.day >= since).map(s => s.day)).size;
  }

  // ---------- Formulario: exposición real ----------
  E.forms.exposure = function (onSaved) {
    const W = E.data.WEEKS[E.store.get().program.week - 1];
    const situations = ['Junta', 'Presentación', 'Llamada', 'Negociación', 'Entrevista', 'Otra'];
    const d = { situation: 'Junta', result: 'yes', before: 6, after: 4 };
    E.ui.modal({
      title: 'Exposición real',
      body: `<div class="stack">
        <p class="muted small">Una situación real por semana, con un único objetivo técnico. Sugerencia de esta semana: ${esc(W.task)}</p>
        <div><div class="small" style="font-weight:800">Situación</div><div class="chips mt" style="margin-top:8px">${situations.map(s => `<button class="chip ${s === d.situation ? 'on' : ''}" data-sit="${s}">${s}</button>`).join('')}</div></div>
        <label class="field">Objetivo técnico<input type="text" data-goal value="${esc(W.question.replace(/^¿|\?$/g, ''))}" maxlength="140"></label>
        <div class="slider-row"><b>Nervios antes</b><input type="range" min="1" max="10" value="6" data-before><b data-bv class="center">6</b></div>
        <div><div class="small" style="font-weight:800">¿Cumpliste el objetivo?</div><div class="chips" style="margin-top:8px">${[['yes', 'Sí'], ['partial', 'Parcial'], ['no', 'No']].map(([k, t]) => `<button class="chip ${k === d.result ? 'on' : ''}" data-res="${k}">${t}</button>`).join('')}</div></div>
        <div class="slider-row"><b>Nervios después</b><input type="range" min="1" max="10" value="4" data-after><b data-av class="center">4</b></div>
        <label class="field">Aprendizaje en una línea<input type="text" data-learn maxlength="200" placeholder="¿Qué harías distinto?"></label>
      </div>`,
      actions: [{ label: 'Cancelar', cls: 'ghost' }, {
        label: 'Guardar', cls: 'go', onClick: m => {
          const exp = {
            id: E.store.uid(), date: new Date().toISOString(), day: E.store.dayKey(), situation: d.situation,
            goal: $('[data-goal]', m.el).value.trim(), nervesBefore: d.before, nervesAfter: d.after, result: d.result, learning: $('[data-learn]', m.el).value.trim()
          };
          E.store.update(s => s.exposures.push(exp));
          const xp = E.game.award('exposure', 50, exp.id);
          setTimeout(() => E.app.rewards({ xp }), 50);
          onSaved && onSaved(exp);
        }
      }],
      onMount: m => {
        $$('[data-sit]', m).forEach(b => b.onclick = () => { d.situation = b.dataset.sit; $$('[data-sit]', m).forEach(x => x.classList.toggle('on', x === b)); });
        $$('[data-res]', m).forEach(b => b.onclick = () => { d.result = b.dataset.res; $$('[data-res]', m).forEach(x => x.classList.toggle('on', x === b)); });
        $('[data-before]', m).oninput = e => { d.before = +e.target.value; $('[data-bv]', m).textContent = d.before; };
        $('[data-after]', m).oninput = e => { d.after = +e.target.value; $('[data-av]', m).textContent = d.after; };
      }
    });
  };

  // ---------- Formulario: rutina pre-escena (90 s) ----------
  E.forms.preScene = function () {
    const steps = [
      ['🌬️', 'Dos suspiros fisiológicos', 'Dos inhalaciones nasales seguidas y una exhalación larga por la boca. Repite.', 25],
      ['🗣️', 'Reevaluación', 'Di en voz baja: "Estoy activado y listo".', 10],
      ['🥤', 'Popote o vibración de labios', 'Sirenas suaves por el popote.', 30],
      ['🎯', 'Primera y última frase', 'Ensaya mentalmente cómo empiezas y cómo cierras.', 15],
      ['🧍', 'Postura base', 'Pies al ancho de cadera, cuello libre, manos disponibles.', 10]
    ];
    let i = -1, left = 0, timer = null;
    const m = E.ui.modal({
      title: 'Rutina pre-escena', body: '<div data-pre class="center"></div>',
      actions: [{ label: 'Cerrar', cls: 'ghost' }], onClose: () => clearInterval(timer)
    });
    const box = $('[data-pre]', m.el);
    const draw = () => {
      if (i < 0) { box.innerHTML = '<p class="muted">90 segundos para llegar con energía, no con prisa.</p><button class="btn go big mt" data-go>Empezar</button>'; $('[data-go]', box).onclick = advance; return; }
      if (i >= steps.length) { box.innerHTML = '<div style="font-size:60px">🎤</div><h2 class="display mt">Listo. Sal y habla.</h2>'; E.ui.chime(); return; }
      const [ico, t, d] = steps[i];
      box.innerHTML = `<div style="font-size:56px">${ico}</div><h2 class="display mt">${t}</h2><p class="muted mt">${d}</p><div class="countdown mt">${left}</div><div class="bar thin accent mt"><span style="width:${(i / steps.length) * 100}%"></span></div>`;
    };
    function advance() {
      i++;
      clearInterval(timer);
      if (i >= steps.length) return draw();
      left = steps[i][3];
      E.ui.beep(700, 120);
      draw();
      timer = setInterval(() => { left--; if (left <= 0) advance(); else draw(); }, 1000);
    }
    draw();
  };

  // ---------- Formulario: revisión semanal ----------
  E.forms.review = function (onDone) {
    const st = E.store.get(), week = st.program.week, W = E.data.WEEKS[week - 1];
    const days = daysPracticedThisWeek();
    const gateBlocked = isGateWeek(week) && !gatePassed(phaseOfWeek(week).n);
    const last = week === 13;
    E.ui.modal({
      title: `Revisión de la semana ${week}`,
      body: `<div class="stack">
        <div class="row"><span class="pill">📅 ${days} días practicados</span><span class="pill">🎤 ${st.exposures.filter(e => e.day >= E.store.dayKey(st.program.weekStartedAt)).length} exposiciones</span></div>
        ${days < 4 ? '<div class="callout warn small">Practicaste menos de 4 días. Te recomendamos repetir la semana para consolidar.</div>' : ''}
        ${gateBlocked ? `<div class="callout info small">Para avanzar a la siguiente fase primero aprueba la <a href="#/compuerta/${phaseOfWeek(week).n}">${esc(phaseOfWeek(week).gate.title)}</a>.</div>` : ''}
        ${W.review.map((q, i) => `<label class="field">${esc(q)}<textarea data-q="${i}" rows="2"></textarea></label>`).join('')}
        <label class="field">¿Cuál es tu único objetivo para la próxima semana?<input type="text" data-next maxlength="160"></label>
      </div>`,
      actions: [
        { label: 'Repetir semana', cls: 'ghost', onClick: m => save(m, false) },
        { label: last ? 'Terminar el programa' : 'Guardar y avanzar', cls: 'go', onClick: m => { if (gateBlocked) { E.ui.toast('Primero aprueba la compuerta de fase'); return false; } save(m, true); } }
      ]
    });
    function save(m, advance) {
      const entry = { week, date: new Date().toISOString(), days, answers: $$('[data-q]', m.el).map(t => t.value.trim()), next: $('[data-next]', m.el).value.trim(), advanced: advance };
      E.store.update(s => {
        s.program.reviewLog = s.program.reviewLog || [];
        s.program.reviewLog.push(entry);
        if (advance) {
          s.program.reviews[week] = entry;
          if (week < 13) { s.program.week = week + 1; s.program.weekStartedAt = new Date().toISOString(); }
          else s.program.completedAt = new Date().toISOString();
        } else {
          s.program.weekStartedAt = new Date().toISOString();
        }
      });
      const xp = E.game.award('review', 30, `w${week}`);
      setTimeout(() => {
        if (advance && last) E.app.rewards({ xp, icon: '🏆', title: '¡Completaste los 90 días!', text: 'Haz tu reevaluación final y compara con tu día 0.' });
        else if (advance) E.app.rewards({ xp, icon: '🗺️', title: `¡Semana ${week + 1} desbloqueada!`, text: esc(E.data.WEEKS[week].title) });
        else E.app.rewards({ xp });
        onDone && onDone();
      }, 60);
    }
  };

  // ---------- Vista: plan ----------
  function weekDetail(n) {
    const st = E.store.get(), cur = st.program.week, W = E.data.WEEKS[n - 1], ph = E.data.PHASES[W.phase - 1];
    const locked = n > cur;
    const mdef = E.data.METRICS[W.metric];
    const weekExpos = n === cur ? st.exposures.filter(e => e.day >= E.store.dayKey(st.program.weekStartedAt)) : [];
    return `<div class="card raised mt">
      <div class="row between"><div><div class="eyebrow">Semana ${n} · Fase ${ph.n} ${esc(ph.name)}</div><h2 class="display" style="margin-top:6px">${esc(W.title)}</h2></div>
        <span class="tag ${n < cur ? 'ok' : n === cur ? 'warn' : ''}">${n < cur ? '✓ Completada' : n === cur ? 'En curso' : '🔒 Bloqueada'}</span></div>
      <div class="grid grid-2 mt">
        <div class="stack">
          <div><div class="card-title">Objetivos</div><ul class="muted" style="padding-left:18px;margin:8px 0 0">${W.objectives.map(o => `<li>${esc(o)}</li>`).join('')}</ul></div>
          <div class="callout info"><b>Teoría</b><p class="small mt" style="margin-top:6px">${esc(W.theory)}</p></div>
          <div><div class="card-title">Tarea</div><p class="muted small mt" style="margin-top:6px">${esc(W.task)}</p></div>
          <div><div class="card-title">Métrica de la semana</div><p class="small mt" style="margin-top:6px"><b>${esc(mdef.label)}</b> · <span class="muted">${E.ui.targetText(W.metric)}</span></p><p class="small muted">🎧 ${esc(W.question)}</p></div>
        </div>
        <div class="stack">
          <div class="card-title">Ejercicios</div>
          ${W.exercises.map(c => { const ex = E.data.EX[c], f = E.data.FAMILIES[ex.family]; return `<button class="queue-item" style="background:var(--surface-2);cursor:pointer;color:var(--text);text-align:left;width:100%" data-ex="${c}"><span class="ex-code" style="background:${f.color}">${c}</span><span><b>${esc(ex.name)}</b><br><span class="small muted">${esc(f.name)} · ${fmt.clock(ex.seconds)}</span></span></button>`; }).join('')}
          <div><div class="card-title mt">Autoevaluación</div><ul class="small muted" style="padding-left:18px;margin:8px 0 0">${W.review.map(q => `<li>${esc(q)}</li>`).join('')}</ul></div>
        </div>
      </div>
      ${locked ? '<div class="callout mt small">Esta semana se desbloquea al cerrar la anterior en la revisión semanal.</div>' : ''}
      ${n === cur ? `<div class="row mt-lg">
          <button class="btn" data-expo>🎤 Registrar exposición</button>
          ${isGateWeek(n) ? `<a class="btn ${gatePassed(ph.n) ? 'ghost' : 'info'}" href="#/compuerta/${ph.n}">${gatePassed(ph.n) ? '✓ Compuerta aprobada' : '🚪 Presentar compuerta'}</a>` : ''}
          <button class="btn primary" data-review>📝 Revisión semanal</button></div>
        ${weekExpos.length ? `<div class="list mt">${weekExpos.map(e => `<div class="list-item"><div class="avatar">🎤</div><div class="grow"><b>${esc(e.situation)}</b> · <span class="muted small">${esc(e.goal)}</span><div class="tiny faint">${fmt.date(e.date)} · nervios ${e.nervesBefore} → ${e.nervesAfter}</div></div><span class="tag ${e.result === 'yes' ? 'ok' : e.result === 'partial' ? 'warn' : 'bad'}">${{ yes: 'Cumplido', partial: 'Parcial', no: 'No' }[e.result]}</span></div>`).join('')}</div>` : ''}` : ''}
    </div>`;
  }

  function renderPlan(el, selected) {
    const st = E.store.get(), cur = st.program.week;
    const sel = selected || cur;
    E.app.setTitle(`<div class="eyebrow">Programa de 13 semanas</div><h1 class="display" style="margin-top:6px">Tu plan</h1>`);
    el.innerHTML = `
      <div class="card"><div class="row between"><b>Semana ${cur} de 13</b><span class="muted small">${st.program.completedAt ? 'Programa completado 🏆' : `${Math.round((cur - 1) / 13 * 100)}% completado`}</span></div>
        <div class="bar accent mt"><span style="width:${((cur - 1) / 13) * 100}%"></span></div></div>
      <div class="phase-track mt">${E.data.PHASES.map(p => {
        const status = gatePassed(p.n) ? 'done' : (cur >= p.weeks[0] && cur <= p.weeks[1]) ? 'current' : '';
        const weeks = []; for (let w = p.weeks[0]; w <= p.weeks[1]; w++) weeks.push(w);
        if (p.n === 4) weeks.push(13);
        return `<div class="phase-card ${status}"><div class="eyebrow">Fase ${p.n} · ${p.layers}</div><div class="card-title" style="margin-top:4px">${esc(p.name)}</div>
          <p class="tiny muted" style="margin-top:4px">${esc(p.objective)}</p>
          <div class="week-pills">${weeks.map(w => `<button class="week-pill ${w < cur || st.program.completedAt ? 'done' : w === cur ? 'current' : ''} ${w === sel ? 'sel' : ''} ${isGateWeek(w) ? 'gate' : ''}" data-week="${w}" title="Semana ${w}${isGateWeek(w) ? ' · compuerta' : ''}">${w}</button>`).join('')}</div>
          <div class="tiny mt">${gatePassed(p.n) ? '<span class="tag ok">✓ Compuerta aprobada</span>' : `<span class="tag">🚪 ${esc(p.gate.title.split('·')[1] || '')}</span>`}</div></div>`;
      }).join('')}</div>
      ${weekDetail(sel)}`;
    $$('[data-week]', el).forEach(b => b.onclick = () => E.app.go(`#/semana/${b.dataset.week}`));
    $$('[data-ex]', el).forEach(b => b.onclick = () => E.forms.exercise(b.dataset.ex));
    const expo = $('[data-expo]', el); if (expo) expo.onclick = () => E.forms.exposure(() => renderPlan(el, sel));
    const rev = $('[data-review]', el); if (rev) rev.onclick = () => E.forms.review(() => renderPlan(el));
  }

  E.views.plan = { render: el => renderPlan(el) };
  E.views.semana = { render: (el, r) => renderPlan(el, Math.max(1, Math.min(13, +r.params[0] || 1))) };

  // ---------- Vista: compuerta de fase ----------
  E.views.compuerta = {
    render(el, route) {
      const n = Math.max(1, Math.min(4, +route.params[0] || 1));
      const P = E.data.PHASES[n - 1], g = P.gate;
      const st = E.store.get();
      const prev = st.program.gates[n];
      const base = E.game.baseline();
      const baseStep = k => base && base.steps && base.steps[k] && base.steps[k].metrics;
      let panel = null;
      const checks = g.checks.map(() => false);
      E.app.setTitle(`<div class="eyebrow">Fase ${n} · ${esc(P.name)}</div><h1 class="display" style="margin-top:6px">${esc(g.title)}</h1>`);

      el.innerHTML = `
        ${prev && prev.passed ? `<div class="callout mt">✓ Aprobaste esta compuerta el ${fmt.date(prev.date)}. Puedes presentarla de nuevo para medirte.</div>` : ''}
        <div class="card raised mt"><p>${esc(g.desc)}</p>
          ${g.checks.length ? `<div class="stack mt">${g.checks.map((c, i) => `<label class="check"><input type="checkbox" data-chk="${i}"><span>${esc(c)}</span></label>`).join('')}</div>` : ''}
        </div>
        <div class="card raised mt" data-test></div>`;
      $$('[data-chk]', el).forEach(c => c.onchange = () => { checks[+c.dataset.chk] = c.checked; c.closest('.check').classList.toggle('on', c.checked); });
      const box = $('[data-test]', el);

      function finish(passed, values, criteria) {
        if (g.checks.length && !checks.every(Boolean)) {
          passed = false;
          criteria.push({ label: 'Confirmación de técnica', ok: false, text: 'Marca las casillas de técnica cuando las cumplas.' });
        }
        E.store.update(s => { s.program.gates[n] = { passed: passed || !!(prev && prev.passed), date: new Date().toISOString(), values, lastAttemptPassed: passed }; });
        if (panel) { panel.destroy(); panel = null; }
        box.innerHTML = `<div class="center"><div style="font-size:56px">${passed ? '🎉' : '🔁'}</div><h2 class="display mt">${passed ? '¡Compuerta aprobada!' : 'Todavía no'}</h2></div>
          <div class="stack mt">${criteria.map(c => `<div class="row between"><span>${esc(c.label)}</span><span class="tag ${c.ok ? 'ok' : 'bad'}">${c.ok ? '✓' : '✗'} ${esc(c.text)}</span></div>`).join('')}</div>
          ${passed ? '' : '<div class="callout warn mt small">Repite la semana con énfasis en el criterio que faltó. No pierdes XP ni racha.</div>'}
          <div class="row mt-lg" style="justify-content:flex-end"><button class="btn ghost" data-again>Intentar de nuevo</button><a class="btn primary" href="#/plan">Volver al plan</a></div>`;
        $('[data-again]', box).onclick = () => E.app.render();
        if (passed) {
          const xp = E.game.award('gate', 200, `phase${n}`);
          setTimeout(() => E.app.rewards({ xp, icon: '🚪', title: `Fase ${n} superada`, text: 'Cierra la semana en la revisión semanal para avanzar.' }), 80);
        }
      }

      if (g.type === 'mpt') {
        const attempts = [];
        const baseMpt = baseStep(1) ? baseStep(1).mpt : null;
        const target = baseMpt ? Math.min(20, baseMpt * 1.1) : 20;
        const draw = () => {
          if (panel) panel.destroy();
          const best = attempts.length ? Math.max(...attempts) : 0;
          box.innerHTML = `<div class="row between"><div><div class="card-title">Fonación sostenida</div><div class="small muted">Meta: ≥ ${fmt.num(target, 1)} s${baseMpt ? ` (línea base ${fmt.num(baseMpt, 1)} s)` : ''}</div></div>
            <div class="chips">${attempts.map((x, i) => `<span class="tag ${x >= target ? 'ok' : ''}">${i + 1}: ${fmt.num(x, 1)} s</span>`).join('')}</div></div>
