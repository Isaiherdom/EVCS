            ${attempts.length ? `<div class="row mt" style="justify-content:flex-end"><button class="btn go" data-eval>Evaluar con ${fmt.num(best, 1)} s</button></div>` : ''}<div class="mt" data-rec></div>`;
          if (attempts.length < 3) {
            panel = E.ui.recordPanel($('[data-rec]', box), {
              kind: 'mpt', source: 'gate', label: 'Compuerta 1 · fonación', maxSec: 45, withSR: false, showResult: false, allowRetry: false,
              promptHtml: '<div class="center"><span class="display" style="font-size:40px">/a/</span></div>',
              onResult: r => { attempts.push(r.metrics.mpt || 0); draw(); }
            });
          }
          const ev = $('[data-eval]', box);
          if (ev) ev.onclick = () => finish(best >= target, { mpt: best }, [{ label: 'Tiempo de fonación', ok: best >= target, text: `${fmt.num(best, 1)} s / meta ${fmt.num(target, 1)} s` }]);
        };
        draw();
      } else if (g.type === 'reading') {
        if (E.audio.srAvailable()) {
          panel = E.ui.recordPanel(box, {
            kind: 'reading', source: 'gate', label: 'Compuerta 2 · lectura', textId: 'base', refText: E.data.TEXTS.base, maxSec: 75, minSec: 20,
            promptHtml: esc(E.data.TEXTS.base), promptClass: 'reading', focusMetric: 'accuracy', continueLabel: 'Evaluar',
            onContinue: r => { const acc = r.metrics.accuracy; finish(isNum(acc) && acc >= 96, { accuracy: acc }, [{ label: 'Precisión de lectura', ok: isNum(acc) && acc >= 96, text: `${fmt.num(acc, 1)}% / meta 96%` }]); }
          });
        } else {
          const baseD = baseStep(3) ? baseStep(3).ddk : null;
          const target = baseD ? Math.ceil(baseD * 1.1) : 10;
          box.innerHTML = `<div class="callout warn small">Sin reconocimiento de voz se evalúa con pa-ta-ka: meta ≥ ${target} secuencias en 5 s.</div><div class="mt" data-rec></div>`;
          panel = E.ui.recordPanel($('[data-rec]', box), {
            kind: 'ddk', source: 'gate', label: 'Compuerta 2 · pa-ta-ka', maxSec: 5, autoStop: true, countdown: 3, withSR: false, focusMetric: 'ddk', continueLabel: 'Evaluar',
            promptHtml: '<div class="center"><span class="display" style="font-size:40px">pa · ta · ka</span></div>',
            onContinue: r => finish(r.metrics.ddk >= target, { ddk: r.metrics.ddk }, [{ label: 'Pa-ta-ka', ok: r.metrics.ddk >= target, text: `${r.metrics.ddk} / meta ${target}` }])
          });
        }
      } else if (g.type === 'spontaneous') {
        const topics = E.data.TEXTS.topics;
        panel = E.ui.recordPanel(box, {
          kind: 'spontaneous', source: 'gate', label: 'Compuerta 3 · fluidez', topic: topics[Math.floor(Math.random() * topics.length)], prep: 10,
          maxSec: 125, minSec: 100, focusMetric: 'fillersPerMin', continueLabel: 'Evaluar',
          onContinue: r => {
            const u = r.metrics.fillersPerMin, p = r.metrics.fallingPct;
            const okU = isNum(u) && u < 2, okP = isNum(p) && p >= 75;
            finish(okU && okP, { fillersPerMin: u, fallingPct: p }, [
              { label: 'Muletillas por minuto', ok: okU, text: `${fmt.num(u, 1)} / meta < 2` },
              { label: 'Cierres descendentes', ok: okP, text: `${fmt.num(p)}% / meta ≥ 75%` }
            ]);
          }
        });
      } else if (g.type === 'presentation') {
        panel = E.ui.recordPanel(box, {
          kind: 'presentation', source: 'gate', label: 'Compuerta 4 · presentación', maxSec: 300, minSec: 180, focusMetric: 'fallingPct', continueLabel: 'Autoevaluar',
          promptHtml: `<b>${esc(E.data.TEXTS.gateTopic)}</b><div class="small muted mt">3 a 5 minutos, de pie, con una idea central y un llamado a la acción.</div>`,
          onContinue: r => {
            const vals = E.data.RUBRIC.map(() => 70);
            box.innerHTML = `<div class="card-title">Rúbrica de la presentación</div><p class="small muted mt">Escucha tu grabación y califica con honestidad (1–100).</p>
              <div class="stack mt">${E.data.RUBRIC.map((q, i) => `<div class="slider-row"><span class="small" style="font-weight:800">${esc(q)}</span><input type="range" min="1" max="100" value="70" data-rb="${i}"><b data-rv="${i}" class="center">70</b></div>`).join('')}</div>
              ${r.rec && r.rec.hasAudio ? '<div class="mt" data-audio></div>' : ''}
              <div class="row mt-lg" style="justify-content:flex-end"><button class="btn go" data-eval>Evaluar</button></div>`;
            if (r.rec && r.rec.hasAudio) E.records.url(r.rec.id).then(u => { const a = $('[data-audio]', box); if (u && a) a.innerHTML = `<audio controls src="${u}"></audio>`; });
            $$('[data-rb]', box).forEach(s => s.oninput = () => { vals[+s.dataset.rb] = +s.value; $(`[data-rv="${s.dataset.rb}"]`, box).textContent = s.value; });
            $('[data-eval]', box).onclick = () => {
              const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
              finish(avg >= 70, { rubric: avg, fallingPct: r.metrics.fallingPct, fillersPerMin: r.metrics.fillersPerMin }, [{ label: 'Rúbrica de presentación', ok: avg >= 70, text: `${Math.round(avg)} / meta 70` }]);
            };
          }
        });
      }
      return () => { if (panel) panel.destroy(); };
    }
  };
})(window.EVCS);

</script>
  <script>/* js/views/library.js */
/* EVCS Web · Vista: biblioteca de ejercicios y detalle con práctica guiada */
(function (E) {
  'use strict';
  E.views = E.views || {};
  E.forms = E.forms || {};
  const { esc, $, $$, fmt } = E.ui;

  const firstWeek = code => { const w = E.data.WEEKS.find(x => x.exercises.includes(code)); return w ? w.n : 1; };
  const dimLabel = k => (E.data.DIMENSIONS.find(d => d.key === k) || {}).label || k;

  function exerciseText(ex) {
    const T = E.data.TEXTS;
    if (ex.text === 'base') return `<div class="rec-prompt reading">${esc(T.base)}</div>`;
    if (ex.text === 'speeds') return `<div class="rec-prompt reading">${esc(T.speeds)}</div>`;
    if (ex.text === 'twister') return `<div class="rec-prompt reading">${T.twisters.map(esc).join('<br><br>')}</div>`;
    if (ex.text === 'topic') return `<div class="rec-prompt"><span class="eyebrow">Tema sorteado</span><div class="display" style="font-size:20px;margin-top:6px">${esc(T.topics[Math.floor(Math.random() * T.topics.length)])}</div></div>`;
    return '';
  }

  function logExercise(code) {
    const day = E.store.dayKey();
    E.store.update(s => {
      s.exerciseLog[code] = s.exerciseLog[code] || [];
      if (!s.exerciseLog[code].includes(day)) s.exerciseLog[code].push(day);
    });
  }

  // Temporizador con anillo, reutilizado en la biblioteca y en la sesión
  function timerRing(left, total) {
    const r = 96, C = 2 * Math.PI * r, p = total ? left / total : 0;
    return `<div class="timer-ring"><svg width="220" height="220"><circle cx="110" cy="110" r="${r}" fill="none" stroke="var(--surface-3)" stroke-width="16"/>
      <circle cx="110" cy="110" r="${r}" fill="none" stroke="var(--accent)" stroke-width="16" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - p)}" style="transition:stroke-dashoffset 1s linear"/></svg>
      <div class="t"><div><b>${fmt.clock(left)}</b><span class="small muted">restante</span></div></div></div>`;
  }

  function metronome(bpm) {
    let t = null, cur = bpm;
    return {
      start() { this.stop(); t = setInterval(() => E.ui.beep(1200, 40, 0.08), 60000 / cur); },
      stop() { clearInterval(t); t = null; },
      set(b) { cur = Math.max(30, Math.min(200, b)); if (t) this.start(); return cur; },
      get bpm() { return cur; }, get on() { return !!t; }
    };
  }

  E.forms.exercise = function (code) {
    const ex = E.data.EX[code];
    if (!ex) return;
    const f = E.data.FAMILIES[ex.family];
    const week = E.store.get().program.week;
    const unlockedWeek = firstWeek(code);
    const gentle = (E.store.get().profile || {}).gentle;
    let timer = null, left = ex.seconds, running = false, metro = ex.metronome ? metronome(ex.metronome) : null, panel = null;

    const m = E.ui.modal({
      wide: true,
      title: `<span class="row" style="flex-wrap:nowrap"><span class="ex-code" style="background:${f.color}">${ex.code}</span><span>${esc(ex.name)}</span></span>`,
      body: `<div class="stack">
        <div class="row"><span class="tag fam" style="background:${f.color}">${esc(f.name)}</span><span class="tag">⏱ ${fmt.clock(ex.seconds)}</span><span class="tag">Nivel ${ex.level}</span>${ex.dims.map(d => `<span class="tag">${esc(dimLabel(d))}</span>`).join('')}</div>
        ${unlockedWeek > week ? `<div class="callout warn small">Este ejercicio entra al plan en la semana ${unlockedWeek}. Puedes explorarlo desde ahora.</div>` : ''}
        ${gentle && ex.intensity >= 3 ? '<div class="callout err small">Modo suave activo: evita este ejercicio de potencia hasta que tu voz esté descansada.</div>' : ''}
        <p class="muted">${esc(ex.summary)}</p>
        <div class="grid grid-2">
          <div><div class="card-title">Pasos</div><ol class="steps-list mt">${ex.steps.map(s => `<li><span>${esc(s)}</span></li>`).join('')}</ol>
            <div class="callout mt small"><b>✓ Bien hecho:</b> ${esc(ex.success)}</div>
            <div class="callout err mt small"><b>✕ Error común:</b> ${esc(ex.error)}</div></div>
          <div class="stack" data-practice>
            ${exerciseText(ex)}
            <div data-timer>${timerRing(left, ex.seconds)}</div>
            ${metro ? `<div class="row" style="justify-content:center"><button class="btn sm ghost" data-bpm="-10">−10</button><button class="btn sm" data-metro>🎵 Metrónomo <span data-bpmv>${metro.bpm}</span></button><button class="btn sm ghost" data-bpm="10">+10</button></div>` : ''}
            <div class="row" style="justify-content:center"><button class="btn go" data-play>▶ Practicar</button><button class="btn ghost" data-reset>Reiniciar</button></div>
            ${ex.record ? '<button class="btn info block" data-record>🎙️ Grabar este ejercicio</button>' : ''}
          </div>
        </div>
      </div>`,
      actions: [{ label: 'Cerrar', cls: 'ghost' }, { label: 'Marcar como hecho', cls: 'primary', onClick: () => { logExercise(code); E.ui.toast('Ejercicio registrado', 'ok'); } }],
      onClose: () => { clearInterval(timer); metro && metro.stop(); panel && panel.destroy(); }
    });

    const el = m.el;
    const draw = () => { $('[data-timer]', el).innerHTML = timerRing(left, ex.seconds); };
    $('[data-play]', el).onclick = e => {
      running = !running;
      e.target.textContent = running ? '⏸ Pausa' : '▶ Continuar';
      if (running) {
        timer = setInterval(() => {
          left--; draw();
          if (left <= 0) { clearInterval(timer); running = false; metro && metro.stop(); E.ui.chime(); logExercise(code); E.ui.toast('¡Ejercicio completado!', 'ok'); e.target.textContent = '▶ Otra vez'; left = ex.seconds; }
        }, 1000);
      } else clearInterval(timer);
    };
    $('[data-reset]', el).onclick = () => { clearInterval(timer); running = false; left = ex.seconds; draw(); $('[data-play]', el).textContent = '▶ Practicar'; };
    if (metro) {
      $('[data-metro]', el).onclick = () => { if (metro.on) metro.stop(); else metro.start(); };
      $$('[data-bpm]', el).forEach(b => b.onclick = () => { $('[data-bpmv]', el).textContent = metro.set(metro.bpm + +b.dataset.bpm); });
    }
    const recBtn = $('[data-record]', el);
    if (recBtn) recBtn.onclick = () => {
      const box = $('[data-practice]', el);
      clearInterval(timer);
      const topicMatch = box.querySelector('.display');
      const kind = ex.text === 'topic' || ex.code === 'E6' || ex.code === 'F6' ? 'spontaneous' : 'exercise';
      box.innerHTML = '';
      panel = E.ui.recordPanel(box, {
        kind, source: 'exercise', label: `${ex.code} · ${ex.name}`, topic: topicMatch ? topicMatch.textContent : null, maxSec: 180,
        onResult: () => { logExercise(code); const xp = E.game.award('recording', 5, code); E.app.rewards({ xp }); }
      });
    };
  };

  E.views.biblioteca = {
    render(el) {
      const week = E.store.get().program.week;
      const open = E.planner.unlocked(week);
      let fam = 'all', q = '';
      E.app.setTitle(`<div class="eyebrow">Biblioteca</div><h1 class="display" style="margin-top:6px">${E.data.EXERCISES.length} ejercicios EVCS</h1>`);
      el.innerHTML = `
        <div class="card"><div class="row between gap-lg">
          <input type="text" data-q placeholder="Buscar por nombre, código o dimensión…" style="max-width:420px">
          <div class="chips"><button class="chip on" data-fam="all">Todos</button>${Object.entries(E.data.FAMILIES).map(([k, f]) => `<button class="chip" data-fam="${k}"><span style="color:${f.color}">●</span> ${f.name}</button>`).join('')}</div>
        </div></div>
        <div class="grid grid-3 mt" data-grid></div>`;
      const grid = $('[data-grid]', el);
      const draw = () => {
        const list = E.data.EXERCISES.filter(ex => (fam === 'all' || ex.family === fam) && (!q || (ex.name + ex.code + ex.summary + ex.dims.map(dimLabel).join(' ')).toLowerCase().includes(q)));
        grid.innerHTML = list.map(ex => {
          const f = E.data.FAMILIES[ex.family], locked = !open.has(ex.code);
          const days = new Set(E.store.get().exerciseLog[ex.code] || []).size;
          return `<div class="card ex-card" data-ex="${ex.code}">${locked ? `<span class="locked" title="Semana ${firstWeek(ex.code)}">🔒</span>` : ''}
            <div class="row" style="flex-wrap:nowrap"><span class="ex-code" style="background:${f.color}">${ex.code}</span><div><div class="card-title">${esc(ex.name)}</div><div class="small muted">${esc(f.name)} · ${fmt.clock(ex.seconds)} · nivel ${ex.level}</div></div></div>
            <p class="small muted">${esc(ex.summary)}</p>
            <div class="row"><span class="tag">${days ? `✓ ${days} día${days > 1 ? 's' : ''}` : 'Sin practicar'}</span>${locked ? `<span class="tag">Semana ${firstWeek(ex.code)}</span>` : ''}</div></div>`;
        }).join('') || '<div class="empty span-2"><span class="e-ico">🔎</span>No hay ejercicios con ese filtro.</div>';
        $$('[data-ex]', grid).forEach(c => c.onclick = () => E.forms.exercise(c.dataset.ex));
      };
      $('[data-q]', el).oninput = e => { q = e.target.value.trim().toLowerCase(); draw(); };
      $$('[data-fam]', el).forEach(b => b.onclick = () => { fam = b.dataset.fam; $$('[data-fam]', el).forEach(x => x.classList.toggle('on', x === b)); draw(); });
      draw();
    }
  };

  E.library = { timerRing, metronome, logExercise, exerciseText };
})(window.EVCS);

</script>
  <script>/* js/views/diction.js */
/* EVCS Web · Vista: Modo Dicción
 * #/diccion                 mapa de sonidos y sonido del día
 * #/diccion/chequeo         chequeo de los 11 sonidos con un párrafo
 * #/diccion/sonido/:id      práctica guiada de un sonido (técnica → palabras → pares → frases → trabalenguas → cierre)
 */
(function (E) {
  'use strict';
  E.views = E.views || {};
  const { esc, $, $$, fmt, isNum } = E.ui;
  const D = () => E.data.DICTION;

  // ---------- lógica de dominio ----------
  const soundState = id => (E.store.get().diction.sounds[id] || null);
  const statusOf = m => (isNum(m) ? D().STATUS.find(s => m >= s.min) : null);

  function updateMastery(id, score, source) {
    let before = null, after = null;
    E.store.update(s => {
      const cur = s.diction.sounds[id] || { mastery: null, sessions: 0, history: [] };
      before = cur.mastery;
      cur.mastery = Math.round(isNum(cur.mastery) ? 0.6 * cur.mastery + 0.4 * score : score);
      after = cur.mastery;
      if (source === 'practice') cur.sessions = (cur.sessions || 0) + 1;
      cur.last = new Date().toISOString();
      cur.history = (cur.history || []).concat({ date: cur.last, score: Math.round(score), source }).slice(-30);
      s.diction.sounds[id] = cur;
    });
    return { before, after };
  }

  // Sonido del día: el de menor dominio; si hay empate, el practicado hace más tiempo
  function soundOfDay() {
    const st = E.store.get().diction;
    if (!st.checks.length) return null;
    return D().SOUNDS.slice().sort((a, b) => {
      const sa = st.sounds[a.id] || {}, sb = st.sounds[b.id] || {};
      const ma = isNum(sa.mastery) ? sa.mastery : 0, mb = isNum(sb.mastery) ? sb.mastery : 0;
      if (ma !== mb) return ma - mb;
      return (sa.last || '').localeCompare(sb.last || '');
    })[0];
  }

  E.diction = { soundOfDay, soundState, statusOf, updateMastery };

  // ---------- piezas de interfaz ----------
  function masteryBar(m) {
    const st = statusOf(m);
    return `<div class="row between small"><span class="tag ${st ? st.cls : ''}">${st ? st.name : 'Sin medir'}</span><b>${isNum(m) ? m : '—'}</b></div>
      <div class="bar thin ${isNum(m) && m < 80 ? 'accent' : ''}" style="margin-top:6px"><span style="width:${isNum(m) ? m : 0}%"></span></div>`;
  }

  function diffHtml(diff) {
    return diff.words.map(w => w.status === 'ok' ? `<span class="dw ok">${esc(w.word)}</span>`
      : `<span class="dw ${w.status}" title="${w.status === 'sub' ? 'Se escuchó: ' + esc(w.heard) : 'No se escuchó'}">${esc(w.word)}${w.status === 'sub' ? `<small>${esc(w.heard)}</small>` : ''}</span>`).join(' ');
  }

  function audioSlot(rec) {
    if (!rec || !rec.hasAudio) return '';
    const id = 'au-' + rec.id;
    E.records.url(rec.id).then(u => { const box = document.getElementById(id); if (box && u) box.innerHTML = `<audio controls src="${u}"></audio>`; });
    return `<div id="${id}" class="mt"></div>`;
  }

  // ---------- inicio del modo ----------
  function home(el) {
    const st = E.store.get(), dic = st.diction, p = st.profile;
    const sod = soundOfDay();
    const lastCheck = dic.checks[dic.checks.length - 1];
    const measured = D().SOUNDS.filter(s => dic.sounds[s.id] && isNum(dic.sounds[s.id].mastery));
    const avg = measured.length ? Math.round(measured.reduce((a, s) => a + dic.sounds[s.id].mastery, 0) / measured.length) : null;
    const mastered = measured.filter(s => dic.sounds[s.id].mastery >= 80).length;
    E.app.setTitle(`<div class="eyebrow">Articulación y dicción</div><h1 class="display" style="margin-top:6px">Modo Dicción</h1>`);

    el.innerHTML = `
      ${!lastCheck ? `<div class="hero"><div class="hero-inner row between gap-lg"><div style="max-width:600px"><div class="eyebrow">Empieza aquí · 5 minutos</div>
          <h2 class="display mt">Chequeo de sonidos</h2>
          <p class="muted mt">Lees un párrafo que contiene los 11 sonidos más difíciles del español, te escuchas y calificas cada uno. Con eso armamos tu mapa y tu sonido del día.</p></div>
          <a class="btn primary big" href="#/diccion/chequeo">Hacer chequeo</a></div></div>`
        : `<div class="grid grid-3">
          <div class="card raised span-2"><div class="eyebrow">Sonido del día · 8–10 min</div>
            <div class="row between mt"><div class="row" style="flex-wrap:nowrap"><span class="ex-code" style="background:var(--accent);width:auto;padding:0 12px;min-width:56px">${esc(sod.label)}</span>
              <div><h2 class="display">${esc(sod.name)}</h2><div class="small muted">${esc(sod.example)}</div></div></div>
              <a class="btn go big" href="#/diccion/sonido/${sod.id}">▶ Entrenar</a></div>
            <div class="mt">${masteryBar(soundState(sod.id) && soundState(sod.id).mastery)}</div></div>
          <div class="card stack" style="justify-content:space-between">
            <div class="kpi"><span class="kpi-label">Dominio promedio</span><span class="kpi-value">${isNum(avg) ? avg : '—'}</span><span class="small muted">${mastered} de ${D().SOUNDS.length} sonidos dominados</span></div>
            <div class="small muted">Último chequeo: ${fmt.date(lastCheck.date)}</div>
            <a class="btn ghost sm" href="#/diccion/chequeo">Repetir chequeo</a></div>
        </div>`}

      <div class="card mt row between"><label class="check ${p.dictionFocus ? 'on' : ''}" style="border:0;padding:0;flex:1"><input type="checkbox" data-focus ${p.dictionFocus ? 'checked' : ''}>
        <span><b>Prioridad a la dicción en mi plan diario</b><br><span class="small muted">Tus sesiones incluirán más ejercicios de articulación (A) y dicción (D) desde la semana 1.</span></span></label></div>

      <div class="section-title"><h2 class="display">Mapa de sonidos</h2><span class="small muted">Toca un sonido para practicarlo</span></div>
      <div class="grid grid-3">${D().SOUNDS.map(s => {
        const ss = dic.sounds[s.id];
        return `<a class="card ex-card" href="#/diccion/sonido/${s.id}" style="color:var(--text)">
          <div class="row" style="flex-wrap:nowrap"><span class="ex-code" style="background:var(--surface-3);color:var(--text);width:auto;min-width:46px;padding:0 10px;font-size:13px">${esc(s.label)}</span>
            <div><div class="card-title">${esc(s.name)}</div><div class="small muted">${esc(s.example)}</div></div></div>
          ${masteryBar(ss && ss.mastery)}
          <div class="tiny faint">${ss && ss.sessions ? `${ss.sessions} práctica${ss.sessions > 1 ? 's' : ''} · última ${fmt.date(ss.last)}` : 'Sin práctica todavía'}</div></a>`;
      }).join('')}</div>

      <div class="grid grid-2 mt">
        <div class="card"><div class="card-title">Cómo escucharte bien</div>
          <ul class="small muted" style="padding-left:18px;margin:10px 0 0;line-height:1.7">
            <li>Usa audífonos al revisar tus grabaciones: oirás detalles que el altavoz esconde.</li>
            <li>Escucha buscando un solo sonido a la vez.</li>
            <li>Lento y preciso primero; la velocidad viene después.</li>
            <li>Compara con tu chequeo anterior en Grabaciones → Dicción.</li></ul></div>
        <div class="card"><div class="card-title">Qué hace el reconocimiento de voz</div>
          <p class="small muted mt">Marca en rojo las palabras que no captó o que entendió como otra. Es una pista, no un veredicto: está hecho para entender incluso habla poco clara. Tu oído decide.</p>
          ${E.audio.srAvailable() ? '<span class="tag ok mt">Disponible en este navegador</span>' : '<span class="tag warn mt">No disponible: usa Chrome o Edge</span>'}</div>
      </div>
      ${dic.checks.length ? `<div class="section-title"><h2 class="display">Chequeos</h2></div>
        <div class="card"><div class="list">${dic.checks.slice().reverse().slice(0, 6).map(c => {
          const n = k => Object.values(c.results).filter(v => v === k).length;
          return `<div class="list-item"><div class="avatar">🗺️</div><div class="grow"><b>${fmt.date(c.date)}</b><div class="tiny faint">${isNum(c.accuracy) ? `Reconocimiento ${fmt.num(c.accuracy)}% · ` : ''}${n('ok')} bien · ${n('doubt')} dudosos · ${n('fail')} con falla</div></div></div>`;
        }).join('')}</div></div>` : ''}`;

    $('[data-focus]', el).onchange = e => {
      E.store.update(s => { s.profile.dictionFocus = e.target.checked; });
      e.target.closest('.check').classList.toggle('on', e.target.checked);
      E.ui.toast(e.target.checked ? 'Tu plan diario dará prioridad a la dicción' : 'Plan diario estándar', 'ok');
    };
  }

  // ---------- chequeo de sonidos ----------
  function check(el) {
    let panel = null;
    const T = D().CHECK_TEXT, KW = D().CHECK_KEYWORDS;
    E.app.setTitle(`<div class="eyebrow">Modo Dicción · 5 minutos</div><h1 class="display" style="margin-top:6px">Chequeo de sonidos</h1>`);
    const highlight = (missed) => {
      const all = new Set(Object.values(KW).flat());
      return T.split(/\s+/).map(w => {
        const n = E.audio.text.normalizeText(w);
        if (!all.has(n)) return esc(w);
        return `<b class="kw ${missed && missed.has(n) ? 'miss' : ''}">${esc(w)}</b>`;
      }).join(' ');
    };
    el.innerHTML = `<div class="card raised"><p class="muted">Lee el párrafo completo en voz alta, a tu ritmo natural, como si se lo explicaras a alguien. Las palabras resaltadas son las que vas a revisar después.</p>
      <div class="mt" data-rec></div></div>`;
    panel = E.ui.recordPanel($('[data-rec]', el), {
      kind: 'reading', source: 'diction', label: 'Dicción · chequeo de sonidos', textId: 'diction-check', refText: T,
      promptHtml: highlight(null), promptClass: 'reading', maxSec: 120, minSec: 20, showResult: false, allowRetry: false,
      onResult: res => review(res)
    });

    function review(res) {
      const diff = res.transcript ? E.audio.text.wordDiff(res.transcript, T) : null;
      const missed = new Set(diff ? diff.words.filter(w => w.status !== 'ok').map(w => E.audio.text.normalizeText(w.word)) : []);
      const results = {};
      el.innerHTML = `<div class="card raised">
          <div class="row between"><div class="card-title">Escúchate y califica cada sonido</div>${diff ? `<span class="tag">Reconocimiento: ${fmt.num(diff.accuracy)}%</span>` : ''}</div>
          <p class="small muted mt">Pon audífonos. ${diff ? 'En rojo, las palabras clave que el reconocimiento no captó: revísalas con atención.' : 'Sin reconocimiento de voz: califica sólo con tu oído.'}</p>
          ${audioSlot(res.rec)}
          <div class="rec-prompt reading mt">${highlight(missed)}</div>
        </div>
        <div class="card mt"><div class="list">${D().SOUNDS.map(s => {
          const kws = KW[s.id], miss = kws.filter(k => missed.has(E.audio.text.normalizeText(k)));
          return `<div class="list-item" style="flex-wrap:wrap"><div class="grow" style="min-width:220px"><b>${esc(s.name)}</b>
              <div class="chips" style="margin-top:6px">${kws.map(k => `<span class="tag ${miss.includes(k) ? 'bad' : ''}">${esc(k)}</span>`).join('')}</div></div>
            <div class="chips" data-sound="${s.id}">
              <button class="chip" data-v="ok">✓ Bien</button><button class="chip" data-v="doubt">? Dudoso</button><button class="chip" data-v="fail">✗ Falla</button></div></div>`;
        }).join('')}</div>
        <div class="row mt" style="justify-content:space-between"><span class="small muted" data-count>0 de ${D().SOUNDS.length} calificados</span>
          <div class="row"><a class="btn ghost" href="#/diccion">Cancelar</a><button class="btn go" data-save disabled>Guardar mi mapa</button></div></div></div>`;
      $$('[data-sound]', el).forEach(g => $$('[data-v]', g).forEach(b => b.onclick = () => {
        results[g.dataset.sound] = b.dataset.v;
        $$('[data-v]', g).forEach(x => x.classList.toggle('on', x === b));
        const n = Object.keys(results).length;
        $('[data-count]', el).textContent = `${n} de ${D().SOUNDS.length} calificados`;
        $('[data-save]', el).disabled = n < D().SOUNDS.length;
      }));
      $('[data-save]', el).onclick = () => {
        const VALUE = { ok: 75, doubt: 55, fail: 35 }; // el dominio (≥ 80) sólo se alcanza practicando
        E.store.update(s => s.diction.checks.push({ date: new Date().toISOString(), results, recId: res.rec && res.rec.id, accuracy: diff ? diff.accuracy : null }));
        Object.entries(results).forEach(([id, v]) => updateMastery(id, VALUE[v], 'check'));
        const xp = E.game.award('diction', 20, 'check');
        E.app.go('#/diccion');
        const sod = soundOfDay();
        setTimeout(() => E.app.rewards({ xp, icon: '🗺️', title: 'Tu mapa de sonidos está listo', text: `Empieza por: <b>${esc(sod.name)}</b>.` }), 120);
      };
    }
    return () => panel && panel.destroy();
  }

  // ---------- práctica de un sonido ----------
  function practice(el, id) {
    const S = D().BY_ID[id];
    if (!S) { home(el); return; }
    const ss = soundState(id);
    const steps = ['tecnica', 'palabras'].concat(S.pairs.length ? ['pares'] : []).concat(['frases', 'trabalenguas', 'cierre']);
    const TITLES = { tecnica: 'Técnica', palabras: 'Palabras', pares: 'Pares mínimos', frases: 'Frases', trabalenguas: 'Trabalenguas', cierre: 'Cierre' };
    const res = { words: null, pairs: null, phrases: null, twister: null, self: null };
    let k = 0, panel = null, metro = null;
    const stopAll = () => { if (panel) { panel.destroy(); panel = null; } if (metro) metro.stop(); };
    E.app.setTitle(`<div class="eyebrow">Modo Dicción · ${esc(S.label)}</div><h1 class="display" style="margin-top:6px">${esc(S.name)}</h1>`);

    function frame(inner) {
      el.innerHTML = `<div class="session-progress">${steps.map((s, i) => `<span class="${i < k ? 'done' : i === k ? 'cur' : ''}"></span>`).join('')}</div>
        <div class="row between"><div class="eyebrow">Paso ${k + 1} de ${steps.length} · ${TITLES[steps[k]]}</div><a class="link-btn small" href="#/diccion">Salir</a></div>
        <div class="card raised mt">${inner}</div>`;
    }
    const next = () => { stopAll(); k++; draw(); };

    // chips que el usuario marca como falla
    function markable(items, preFail) {
      return `<div class="chips mt" data-marks>${items.map((w, i) => `<button class="chip wchip ${preFail.has(i) ? 'fail' : ''}" data-i="${i}">${esc(w)}</button>`).join('')}</div>`;
    }
    function readMarks() {
      const chips = $$('[data-marks] [data-i]', el);
      return { total: chips.length, fails: chips.filter(c => c.classList.contains('fail')).length };
    }

    function recordStep({ items, joiner, label, intro, maxSec, onDone, itemsHtml, keyName }) {
      const ref = items.join(joiner);
      frame(`${intro}${itemsHtml}<div class="mt" data-rec></div>`);
      panel = E.ui.recordPanel($('[data-rec]', el), {
        kind: 'reading', source: 'diction', label: `Dicción · ${S.name} · ${label}`, textId: `dic-${id}-${keyName}`, refText: ref, maxSec, minSec: 3,
        showResult: false, allowRetry: false,
        onResult: r => onDone(r, r.transcript ? E.audio.text.wordDiff(r.transcript, ref) : null)
      });
    }

    function draw() {
      const step = steps[k];
      if (step === 'tecnica') {
        frame(`<div class="grid grid-2">
            <div><div class="card-title">Cómo se produce</div><p class="mt">${esc(S.tip)}</p>
              <div class="mt">${masteryBar(ss && ss.mastery)}</div></div>
            <div><div class="card-title">Errores frecuentes</div><div class="stack mt">${S.errors.map(e => `<div class="callout err small">${esc(e)}</div>`).join('')}</div>
              <div class="card-title mt">Calentamiento sugerido</div><div class="chips mt">${S.exercises.map(c => `<button class="chip" data-ex="${c}">${c} · ${esc(E.data.EX[c].name)}</button>`).join('')}</div></div>
          </div>
          <div class="row mt-lg" style="justify-content:flex-end"><button class="btn go big" data-next>Empezar práctica</button></div>`);
        $$('[data-ex]', el).forEach(b => b.onclick = () => E.forms.exercise(b.dataset.ex));
        $('[data-next]', el).onclick = next;
      } else if (step === 'palabras') {
        recordStep({
          items: S.words, joiner: ', ', label: 'palabras', keyName: 'w', maxSec: 60,
          intro: '<p class="muted">Léelas una vez lento y exagerado sin grabar. Después graba la lista a ritmo normal, con una pequeña pausa entre palabras.</p>',
          itemsHtml: `<div class="rec-prompt reading mt" style="font-size:22px;line-height:1.9">${S.words.map(esc).join(' · ')}</div>`,
          onDone: (r, diff) => {
            const pre = new Set(diff ? diff.words.map((w, i) => (w.status !== 'ok' ? i : -1)).filter(i => i >= 0) : []);
            frame(`<div class="card-title">Marca las palabras donde el sonido falló</div>
              <p class="small muted mt">${diff ? 'Prellenamos en rojo las que el reconocimiento no captó. Escúchate y desmarca las que sí sonaron bien.' : 'Escúchate y toca las palabras donde el sonido no salió limpio.'}</p>
              ${audioSlot(r.rec)}${markable(S.words, pre)}
              <div class="row mt-lg" style="justify-content:flex-end"><button class="btn ghost" data-redo>Grabar de nuevo</button><button class="btn go" data-ok>Continuar</button></div>`);
            $$('[data-marks] [data-i]', el).forEach(c => c.onclick = () => c.classList.toggle('fail'));
            $('[data-redo]', el).onclick = draw;
            $('[data-ok]', el).onclick = () => { const m = readMarks(); res.words = 100 * (m.total - m.fails) / m.total; next(); };
          }
        });
      } else if (step === 'pares') {
        const items = S.pairs.map(p => `${p[0]} – ${p[1]}`);
        recordStep({
          items: S.pairs.map(p => `${p[0]}, ${p[1]}`), joiner: '. ', label: 'pares mínimos', keyName: 'p', maxSec: 45,
          intro: '<p class="muted">Lee cada par marcando bien la diferencia entre las dos palabras. El cambio de un solo sonido cambia el significado.</p>',
          itemsHtml: `<div class="grid grid-2 mt">${S.pairs.map(p => `<div class="rec-prompt reading center" style="font-size:22px">${esc(p[0])} <span class="faint">·</span> ${esc(p[1])}</div>`).join('')}</div>`,
          onDone: r => {
            frame(`<div class="card-title">¿Se distinguió cada par?</div><p class="small muted mt">Escúchate y toca los pares donde las dos palabras sonaron iguales.</p>
              ${audioSlot(r.rec)}${markable(items, new Set())}
              <div class="row mt-lg" style="justify-content:flex-end"><button class="btn ghost" data-redo>Grabar de nuevo</button><button class="btn go" data-ok>Continuar</button></div>`);
            $$('[data-marks] [data-i]', el).forEach(c => c.onclick = () => c.classList.toggle('fail'));
            $('[data-redo]', el).onclick = draw;
            $('[data-ok]', el).onclick = () => { const m = readMarks(); res.pairs = 100 * (m.total - m.fails) / m.total; next(); };
          }
        });
      } else if (step === 'frases') {
        recordStep({
          items: S.phrases, joiner: ' ', label: 'frases', keyName: 'f', maxSec: 90,
          intro: '<p class="muted">Lee las cinco frases seguidas, con intención y a ritmo de conversación. El sonido debe mantenerse limpio dentro de la frase, no sólo en palabras sueltas.</p>',
          itemsHtml: `<div class="rec-prompt reading mt">${S.phrases.map(esc).join('<br>')}</div>`,
          onDone: (r, diff) => {
            frame(`<div class="card-title">Resultado de las frases</div>
              ${diff ? `<div class="row mt"><span class="kpi-value" style="font-size:30px">${fmt.num(diff.accuracy)}%</span><span class="small muted">de palabras reconocidas</span></div>
                <div class="rec-prompt reading mt diff">${diffHtml(diff)}</div>
                <p class="tiny faint mt">Rojo: no se escuchó o se entendió otra palabra (debajo, lo que se oyó). Úsalo como pista y confírmalo con tu oído.</p>`
                : `<p class="small muted mt">Sin reconocimiento de voz. Escúchate y califica qué tan limpio salió el sonido en las frases.</p>
                <div class="slider-row mt"><b>Limpieza del sonido</b><input type="range" min="1" max="100" value="70" data-self><b data-sv class="center">70</b></div>`}
              ${audioSlot(r.rec)}
              <div class="row mt-lg" style="justify-content:flex-end"><button class="btn ghost" data-redo>Grabar de nuevo</button><button class="btn go" data-ok>Continuar</button></div>`);
            const sl = $('[data-self]', el);
            if (sl) sl.oninput = () => { $('[data-sv]', el).textContent = sl.value; };
            $('[data-redo]', el).onclick = draw;
            $('[data-ok]', el).onclick = () => { res.phrases = diff ? diff.accuracy : +sl.value; next(); };
          }
        });
      } else if (step === 'trabalenguas') {
        const m = ss && isNum(ss.mastery) ? ss.mastery : 0;
        const tw = S.twisters[m >= 60 && S.twisters[1] ? 1 : 0];
        metro = E.library.metronome(70);
        frame(`<p class="muted">Protocolo lento-preciso-rápido. Haz las dos primeras rondas sin grabar con el metrónomo (una sílaba por golpe) y graba la ronda rápida.</p>
          <div class="rec-prompt reading mt" style="font-size:22px">${esc(tw)}</div>
          <div class="row mt" style="justify-content:center">${[['Lento', 70], ['Medio', 100], ['Rápido', 130]].map(([t, b]) => `<button class="chip" data-bpm="${b}">🎵 ${t} · ${b}</button>`).join('')}<button class="chip" data-mstop>⏹ Parar</button></div>
          <div class="mt" data-rec></div>`);
        $$('[data-bpm]', el).forEach(b => b.onclick = () => { metro.set(+b.dataset.bpm); metro.start(); $$('[data-bpm]', el).forEach(x => x.classList.toggle('on', x === b)); });
        $('[data-mstop]', el).onclick = () => { metro.stop(); $$('[data-bpm]', el).forEach(x => x.classList.remove('on')); };
        panel = E.ui.recordPanel($('[data-rec]', el), {
          kind: 'reading', source: 'diction', label: `Dicción · ${S.name} · trabalenguas`, textId: `dic-${id}-t`, refText: tw, maxSec: 30, minSec: 2, showResult: false, allowRetry: false,
          onResult: r => {
            metro.stop();
            const diff = r.transcript ? E.audio.text.wordDiff(r.transcript, tw) : null;
            frame(`<div class="card-title">¿Cuántos errores tuvo la ronda rápida?</div>
              ${audioSlot(r.rec)}
              ${diff ? `<div class="rec-prompt reading mt diff">${diffHtml(diff)}</div>` : ''}
              <div class="chips mt">${[0, 1, 2, 3].map(n => `<button class="chip" data-err="${n}">${n === 3 ? '3 o más' : n}</button>`).join('')}</div>
              <div class="row mt-lg" style="justify-content:flex-end"><button class="btn ghost" data-redo>Grabar de nuevo</button><button class="btn go" data-ok disabled>Continuar</button></div>`);
            let errs = null;
            $$('[data-err]', el).forEach(b => b.onclick = () => { errs = +b.dataset.err; $$('[data-err]', el).forEach(x => x.classList.toggle('on', x === b)); $('[data-ok]', el).disabled = false; });
            $('[data-redo]', el).onclick = draw;
            $('[data-ok]', el).onclick = () => {
              res.twister = [100, 75, 50, 25][errs];
              E.library.logExercise('D3');
              next();
            };
          }
        });
      } else if (step === 'cierre') {
        frame(`<div class="center"><div style="font-size:52px">🗣️</div><h2 class="display mt">¿Cómo salió hoy tu ${esc(S.name.toLowerCase())}?</h2>
            <div class="chips mt" style="justify-content:center">${[1, 2, 3, 4, 5].map(n => `<button class="chip" data-self="${n}" style="font-size:22px">${'★'.repeat(n)}</button>`).join('')}</div>
            <button class="btn go big mt-lg" data-save disabled>Guardar práctica</button></div>`);
        $$('[data-self]', el).forEach(b => b.onclick = () => { res.self = +b.dataset.self; $$('[data-self]', el).forEach(x => x.classList.toggle('on', x === b)); $('[data-save]', el).disabled = false; });
        $('[data-save]', el).onclick = save;
      }
    }

    function save() {
      // Puntaje de la práctica: palabras 35%, pares 15%, frases 25%, trabalenguas 25% (renormalizado) y 15% autoevaluación
      const parts = [[res.words, 0.35], [res.pairs, 0.15], [res.phrases, 0.25], [res.twister, 0.25]].filter(([v]) => isNum(v));
      const w = parts.reduce((a, [, x]) => a + x, 0);
      const objective = w ? parts.reduce((a, [v, x]) => a + v * x, 0) / w : 60;
      const score = 0.85 * objective + 0.15 * (res.self * 20);
      const { before, after } = updateMastery(id, score, 'practice');
      E.store.update(s => s.diction.sessions.push({ date: new Date().toISOString(), day: E.store.dayKey(), sound: id, score: Math.round(score), detail: res }));
      const xp = E.game.award('diction', 20, id);
      E.app.go('#/diccion');
      setTimeout(() => E.app.rewards({
        xp, icon: after >= 80 ? '🏅' : '🗣️', title: `${S.name}: ${after}`,
        text: isNum(before) ? `Dominio ${before} → ${after} (${after - before >= 0 ? '+' : ''}${after - before}). Puntaje de hoy: ${Math.round(score)}.` : `Puntaje de hoy: ${Math.round(score)}.`
      }), 120);
    }

    draw();
    return stopAll;
  }

  E.views.diccion = {
    render(el, route) {
      const [sub, id] = route.params;
      if (sub === 'chequeo') return check(el);
      if (sub === 'sonido') return practice(el, id);
      return home(el);
    }
  };
})(window.EVCS);

</script>
  <script>/* js/views/stage.js */
/* EVCS Web · Vista: Escenario (práctica para situaciones reales sin coach)
 * #/escenario                      inicio con las 4 herramientas
 * #/escenario/preguntas            simulador de preguntas difíciles (con voz)
 * #/escenario/presentaciones       mis presentaciones
 * #/escenario/presentacion/:id     editor de una presentación
 * #/escenario/ensayo/:id           ensayo grabado de una presentación
 * #/escenario/video                presencia en video
 * #/escenario/ciegas               evaluación a ciegas con otra persona
 */
(function (E) {
  'use strict';
  E.views = E.views || {};
  const { esc, $, $$, fmt, isNum } = E.ui;
  const P = () => E.data.PRACTICE;
  const pr = () => E.store.get().practice;
  const avg = a => (a.length ? a.reduce((x, y) => x + y, 0) / a.length : null);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];

  function stars(name, value) {
    return `<div class="chips" data-stars="${name}">${[1, 2, 3, 4, 5].map(n => `<button class="chip sm ${value === n ? 'on' : ''}" data-n="${n}">${n}</button>`).join('')}</div>`;
  }
  function bindStars(root, onChange) {
    $$('[data-stars]', root).forEach(g => $$('[data-n]', g).forEach(b => b.onclick = () => {
      $$('[data-n]', g).forEach(x => x.classList.toggle('on', x === b));
      onChange(g.dataset.stars, +b.dataset.n);
    }));
  }
  function audioOf(rec, tag = 'audio') {
    if (!rec || !rec.hasAudio) return '';
    const id = 'm-' + rec.id + '-' + Math.random().toString(36).slice(2, 6);
    E.records.url(rec.id).then(u => { const box = document.getElementById(id); if (box && u) box.innerHTML = `<${tag} controls src="${u}" ${tag === 'video' ? 'playsinline style="width:100%;border-radius:16px;background:#000"' : ''}></${tag}>`; });
    return `<div id="${id}" class="mt"></div>`;
  }
  const back = (href = '#/escenario', label = 'Escenario') => `<a class="link-btn small" href="${href}">← ${label}</a>`;

  // ---------- inicio ----------
  function hub(el) {
    const p = pr();
    const qaLast = p.qa.slice(-5).map(q => q.score);
    const presLast = p.presence[p.presence.length - 1];
    const blindWins = p.blind.filter(b => b.preferredAfter).length;
    E.app.setTitle(`<div class="eyebrow">Práctica para situaciones reales</div><h1 class="display" style="margin-top:6px">Escenario</h1>`);
    const card = (href, icon, title, text, stat) => `<a class="card ex-card" href="${href}" style="color:var(--text)">
      <div class="row" style="flex-wrap:nowrap"><div class="avatar" style="font-size:26px">${icon}</div><div class="card-title">${title}</div></div>
      <p class="small muted">${text}</p><div class="row"><span class="tag">${stat}</span></div></a>`;
    el.innerHTML = `<p class="muted">Entrena lo que de verdad importa: responder bajo presión, presentar tus temas reales, verte como te ven los demás y comprobar tu avance con oídos ajenos.</p>
      <div class="grid grid-2 mt">
        ${card('#/escenario/preguntas', '🔥', 'Preguntas difíciles', 'La app te hace en voz alta preguntas incómodas y mide cómo respondes: pausa, conclusión primero, brevedad y seguridad.', p.qa.length ? `${p.qa.length} respuesta${p.qa.length > 1 ? 's' : ''} · promedio reciente ${Math.round(avg(qaLast))}` : 'Sin respuestas todavía')}
        ${card('#/escenario/presentaciones', '📑', 'Mis presentaciones', 'Arma tus presentaciones reales con estructura de élite, imprime tu tarjeta y ensáyalas grabando.', `${p.presentations.length} presentaci${p.presentations.length === 1 ? 'ón' : 'ones'}`)}
        ${card('#/escenario/video', '🎥', 'Presencia en video', 'Grábate con la cámara y evalúa postura, mirada y gestos con una guía. Primero sin sonido, luego con sonido.', presLast ? `Último puntaje de presencia: ${Math.round(presLast.score)}` : 'Sin videos todavía')}
        ${card('#/escenario/ciegas', '🙈', 'Evaluación a ciegas', 'Otra persona escucha tu grabación de antes y la de ahora sin saber cuál es cuál. La prueba más honesta de tu avance.', p.blind.length ? `${blindWins} de ${p.blind.length} oyente${p.blind.length > 1 ? 's' : ''} prefiri${p.blind.length > 1 ? 'eron' : 'ó'} tu versión actual` : 'Sin evaluaciones todavía')}
      </div>`;
  }

  // ---------- preguntas difíciles ----------
  function speak(text, onEnd) {
    const synth = window.speechSynthesis;
    if (!synth || !window.SpeechSynthesisUtterance) { onEnd && onEnd(false); return; }
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'es-MX'; u.rate = 0.98;
    const voices = synth.getVoices();
    const v = voices.find(x => x.lang === 'es-MX') || voices.find(x => x.lang && x.lang.startsWith('es'));
    if (v) u.voice = v;
    let done = false;
    const finish = ok => { if (!done) { done = true; onEnd && onEnd(ok); } };
    u.onend = () => finish(true);
    u.onerror = () => finish(false);
    synth.speak(u);
    setTimeout(() => finish(false), Math.max(6000, text.length * 120)); // respaldo si no hay voz instalada
  }

  function questions(el) {
    let ctxId = (pr().qa[pr().qa.length - 1] || {}).ctx || P().QA_CONTEXTS[0].id;
    let voiceOn = true, panel = null;
    const used = new Set();
    const stop = () => { if (panel) { panel.destroy(); panel = null; } if (window.speechSynthesis) speechSynthesis.cancel(); };
    E.app.setTitle(`<div class="eyebrow">Escenario</div><h1 class="display" style="margin-top:6px">Preguntas difíciles</h1>`);

    function choose() {
      stop();
      const recent = pr().qa.slice(-8).reverse();
      el.innerHTML = `${back()}
        <div class="card raised mt"><div class="card-title">Elige el escenario</div>
          <div class="option-grid mt">${P().QA_CONTEXTS.map(c => `<button class="option ${c.id === ctxId ? 'on' : ''}" data-ctx="${c.id}">${c.icon} ${esc(c.name)}</button>`).join('')}</div>
          <label class="check mt ${voiceOn ? 'on' : ''}"><input type="checkbox" data-voice ${voiceOn ? 'checked' : ''}><span>Leer la pregunta en voz alta y empezar a grabar al terminar<br><span class="small muted">Así la app mide tu pausa real antes de responder.</span></span></label>
          <div class="callout info mt small"><b>Método de 5 pasos:</b> pausa de 1–2 s · reformula en neutro · conclusión primero · una prueba · puente a tu mensaje. Meta: 60 segundos o menos.</div>
          <button class="btn go big block mt-lg" data-ask>🔥 Hazme una pregunta</button></div>
        ${recent.length ? `<div class="section-title"><h2 class="display">Respuestas recientes</h2></div><div class="card"><div class="list">${recent.map(q => `<div class="list-item"><div class="avatar">${(P().QA_CONTEXTS.find(c => c.id === q.ctx) || {}).icon || '🔥'}</div><div class="grow"><b class="small">${esc(q.question)}</b><div class="tiny faint">${fmt.dateTime(q.date)} · ${fmt.num(q.durationSec)} s</div></div><span class="tag ${q.score >= 70 ? 'ok' : q.score >= 50 ? 'warn' : 'bad'}">${Math.round(q.score)}</span></div>`).join('')}</div></div>` : ''}`;
      $$('[data-ctx]', el).forEach(b => b.onclick = () => { ctxId = b.dataset.ctx; $$('[data-ctx]', el).forEach(x => x.classList.toggle('on', x === b)); used.clear(); });
      $('[data-voice]', el).onchange = e => { voiceOn = e.target.checked; e.target.closest('.check').classList.toggle('on', voiceOn); };
      $('[data-ask]', el).onclick = () => ask();
    }

    function ask(fixed) {
      stop();
      const ctx = P().QA_CONTEXTS.find(c => c.id === ctxId);
      let q = fixed;
      if (!q) {
        const pool = ctx.questions.filter(x => !used.has(x));
        if (!pool.length) used.clear();
        q = pick(pool.length ? pool : ctx.questions);
      }
      used.add(q);
      el.innerHTML = `${back('#/escenario/preguntas', 'Preguntas difíciles')}
        <div class="card raised mt"><div class="eyebrow">${ctx.icon} ${esc(ctx.name)}</div>
          <h2 class="display mt" style="font-size:clamp(22px,3vw,30px)">"${esc(q)}"</h2>
          <p class="small muted mt">💡 ${esc(ctx.hint)}</p>
          <div class="mt" data-rec></div></div>`;
      panel = E.ui.recordPanel($('[data-rec]', el), {
        kind: 'spontaneous', source: 'stage', label: `Pregunta · ${ctx.name}`, maxSec: 120, minSec: 5, showResult: false, allowRetry: false,
        onResult: r => review(ctx, q, r)
      });
      if (voiceOn) {
        speak(q, () => { const s = $('[data-start]', el); if (s) s.click(); });
      }
    }

    function review(ctx, q, r) {
      const m = r.metrics;
      const total = (m.speechStartSec || 0) + (m.speechSec || 0);
      const pauseOk = isNum(m.speechStartSec) && m.speechStartSec >= 0.8 && m.speechStartSec <= 3.5;
      const briefOk = total > 0 && total <= 62;
      const checks = { pause: pauseOk, brief: briefOk };
      el.innerHTML = `${back('#/escenario/preguntas', 'Preguntas difíciles')}
        <div class="card raised mt"><div class="eyebrow">${ctx.icon} ${esc(ctx.name)}</div><h2 class="display mt" style="font-size:22px">"${esc(q)}"</h2>
          ${audioOf(r.rec)}
          <div class="metric-grid mt">
            <div class="metric ${pauseOk ? '' : 'focus'}"><div class="l">Pausa antes de responder</div><div class="v">${fmt.num(m.speechStartSec, 1)} s</div><div class="s"><span class="tag ${pauseOk ? 'ok' : 'warn'}">meta 1–2 s</span></div></div>
            <div class="metric"><div class="l">Duración de la respuesta</div><div class="v">${fmt.num(total)} s</div><div class="s"><span class="tag ${briefOk ? 'ok' : 'warn'}">meta ≤ 60 s</span></div></div>
          </div>
          <div class="mt">${E.ui.metricsBlock(m, { keys: ['fillersPerMin', 'fallingPct', 'wpm'] })}</div>
          <div class="card-title mt-lg">Revisa tu respuesta con el método</div>
          <p class="small muted mt">Escúchate y marca lo que sí hiciste. Las casillas automáticas ya están medidas.</p>
          <div class="stack mt">${P().QA_METHOD.map(c => `<label class="check ${checks[c.id] ? 'on' : ''}"><input type="checkbox" data-c="${c.id}" ${checks[c.id] ? 'checked' : ''} ${c.auto ? 'disabled' : ''}><span>${esc(c.label)}${c.auto ? ' <span class="tag">medido</span>' : ''}</span></label>`).join('')}</div>
          ${r.transcript ? `<details class="mt"><summary class="small muted" style="cursor:pointer;font-weight:800">Ver transcripción</summary><div class="transcript mt">${E.ui.transcriptHtml(r.transcript)}</div></details>` : ''}
          <div class="row mt-lg" style="justify-content:flex-end"><button class="btn ghost" data-again>Repetir esta pregunta</button><button class="btn go" data-save>Guardar y otra pregunta</button></div></div>`;
      $$('[data-c]', el).forEach(c => c.onchange = () => { checks[c.dataset.c] = c.checked; c.closest('.check').classList.toggle('on', c.checked); });
      $('[data-again]', el).onclick = () => ask(q);
      $('[data-save]', el).onclick = () => {
        const methodPct = 100 * P().QA_METHOD.filter(c => checks[c.id]).length / P().QA_METHOD.length;
        const A = E.data.ANCHORS;
        const parts = [[methodPct, 0.7], [isNum(m.fillersPerMin) ? E.scoring.interp(m.fillersPerMin, A.fillers) : null, 0.15], [isNum(m.fallingPct) ? E.scoring.interp(m.fallingPct, A.falling) : null, 0.15]].filter(([v]) => isNum(v));
        const w = parts.reduce((a, [, x]) => a + x, 0);
        const score = parts.reduce((a, [v, x]) => a + v * x, 0) / w;
        E.store.update(s => s.practice.qa.push({ date: new Date().toISOString(), ctx: ctx.id, question: q, checks, score, durationSec: Math.round(total), recId: r.rec && r.rec.id, fillersPerMin: m.fillersPerMin, fallingPct: m.fallingPct }));
        const xp = E.game.award('recording', 5, r.rec && r.rec.id);
        E.ui.toast(`Respuesta: ${Math.round(score)} / 100${xp ? ` · +${xp} XP` : ''}`, score >= 70 ? 'ok' : '');
        E.app.refreshChrome();
        ask();
      };
    }

    choose();
    return stop;
  }

  // ---------- presentaciones ----------
  const wordCount = t => (t || '').trim().split(/\s+/).filter(Boolean).length;
  function newPresentation() {
    return { id: E.store.uid(), created: new Date().toISOString(), updated: new Date().toISOString(), title: 'Nueva presentación', audience: '', goal: '', central: '', hook: '',
      points: [{ point: '', proof: '' }, { point: '', proof: '' }, { point: '', proof: '' }], story: '', objection: '', answer: '', cta: '', minutes: 5, ethos: 5, pathos: 5, logos: 5, rehearsals: [] };
  }
  const getPres = id => pr().presentations.find(x => x.id === id);
  function savePres(p) {
    p.updated = new Date().toISOString();
    E.store.update(s => { const i = s.practice.presentations.findIndex(x => x.id === p.id); if (i >= 0) s.practice.presentations[i] = p; else s.practice.presentations.push(p); });
  }
  function readiness(p) {
    const wc = wordCount(p.central);
    return [
      { ok: wc > 0 && wc <= 15, label: 'Idea central en 15 palabras o menos' },
      { ok: !!p.hook.trim(), label: 'Gancho de apertura' },
      { ok: p.points.filter(x => x.point.trim()).length >= 2, label: 'Al menos 2 puntos clave' },
      { ok: p.points.filter(x => x.point.trim()).every(x => x.proof.trim()), label: 'Cada punto con su prueba' },
      { ok: !!p.cta.trim(), label: 'Llamado a la acción' }
    ];
  }

  function presList(el) {
    const list = pr().presentations.slice().sort((a, b) => b.updated.localeCompare(a.updated));
    E.app.setTitle(`<div class="eyebrow">Escenario</div><h1 class="display" style="margin-top:6px">Mis presentaciones</h1>`);
    el.innerHTML = `${back()}<div class="row between mt"><p class="muted">Tus presentaciones reales: juntas, reportes, propuestas, capacitaciones.</p><button class="btn primary" data-new>+ Nueva presentación</button></div>
      <div class="grid grid-2 mt">${list.map(p => {
        const last = p.rehearsals[p.rehearsals.length - 1];
        const ready = readiness(p).filter(x => x.ok).length;
        return `<a class="card ex-card" href="#/escenario/presentacion/${p.id}" style="color:var(--text)"><div class="card-title">${esc(p.title)}</div>
          <p class="small muted">${esc(p.central || 'Sin idea central todavía')}</p>
          <div class="row"><span class="tag ${ready === 5 ? 'ok' : 'warn'}">Estructura ${ready}/5</span><span class="tag">${p.rehearsals.length} ensayos</span>${last ? `<span class="tag ${last.rubric >= 70 ? 'ok' : ''}">Último ensayo ${Math.round(last.rubric)}</span>` : ''}</div></a>`;
      }).join('') || '<div class="empty span-2"><span class="e-ico">📑</span>Crea tu primera presentación: la próxima junta o reporte que tengas que dar.</div>'}</div>`;
    $('[data-new]', el).onclick = () => { const p = newPresentation(); savePres(p); E.app.go(`#/escenario/presentacion/${p.id}`); };
  }

  function presEditor(el, id) {
    const p = getPres(id);
    if (!p) return presList(el);
    E.app.setTitle(`<div class="eyebrow">Mis presentaciones</div><h1 class="display" style="margin-top:6px">${esc(p.title)}</h1>`);
    const f = (key, label, ph, area) => `<label class="field">${label}${area ? `<textarea data-k="${key}" rows="3" placeholder="${esc(ph)}">${esc(p[key])}</textarea>` : `<input type="text" data-k="${key}" value="${esc(p[key])}" placeholder="${esc(ph)}">`}</label>`;
    el.innerHTML = `${back('#/escenario/presentaciones', 'Mis presentaciones')}
      <div class="grid grid-3 mt">
        <div class="card raised span-2 stack">
          ${f('title', 'Título', 'Ej. Resultados del trimestre')}
          <div class="grid grid-2">${f('audience', 'Audiencia', '¿Quién escucha?')}<label class="field">Duración objetivo (min)<input type="number" min="1" max="60" data-k="minutes" value="${p.minutes}"></label></div>
          ${f('goal', '¿Qué quieres que hagan o decidan al final?', 'Ej. Aprobar el presupuesto de la fase 2')}
          <label class="field">Idea central <span class="small" data-wc></span><input type="text" data-k="central" value="${esc(p.central)}" placeholder="Tu mensaje completo en 15 palabras o menos"></label>
          ${f('hook', 'Gancho de apertura', 'Una pregunta, un dato que sorprenda o una historia de 20 segundos', true)}
          <div class="card-title mt">Tres puntos clave</div>
          ${p.points.map((x, i) => `<div class="grid grid-2"><label class="field">Punto ${i + 1}<input type="text" data-pt="${i}" data-f="point" value="${esc(x.point)}"></label><label class="field">Prueba (dato, ejemplo, testimonio)<input type="text" data-pt="${i}" data-f="proof" value="${esc(x.proof)}"></label></div>`).join('')}
          ${f('story', 'Historia (situación → complicación → giro → lección)', 'Una historia real que pruebe tu idea central', true)}
          <div class="grid grid-2">${f('objection', 'Objeción más probable', '¿Qué te van a cuestionar?')}${f('answer', 'Tu respuesta a esa objeción', 'Conclusión primero y una prueba')}</div>
          ${f('cta', 'Llamado a la acción', 'Lo que pides, concreto y con fecha')}
          <div class="card-title mt">Auditoría ethos · pathos · logos (1–10)</div>
          ${[['ethos', '¿Por qué deben creerte?'], ['pathos', '¿Por qué les debe importar?'], ['logos', '¿Qué evidencia lo prueba?']].map(([k, t]) => `<div class="slider-row"><span class="small" style="font-weight:800">${t}</span><input type="range" min="1" max="10" value="${p[k]}" data-k="${k}"><b class="center" data-v="${k}">${p[k]}</b></div>`).join('')}
        </div>
        <div class="stack">
          <div class="card"><div class="card-title">Lista para ensayar</div><div class="stack mt" data-ready></div></div>
          <a class="btn go big block" href="#/escenario/ensayo/${p.id}">🎙️ Ensayar</a>
          <button class="btn block" data-print>🖨️ Tarjeta del orador</button>
          <div class="card"><div class="card-title">Ensayos</div>${p.rehearsals.length ? `<div class="mt">${E.ui.spark(p.rehearsals.map(r => r.rubric), { target: 70 })}</div><div class="list mt">${p.rehearsals.slice().reverse().slice(0, 5).map(r => `<div class="list-item"><div class="grow"><b class="small">${fmt.dateTime(r.date)}</b><div class="tiny faint">${fmt.clock(r.durationSec)} · muletillas ${fmt.num(r.fillersPerMin, 1)}/min</div></div><span class="tag ${r.rubric >= 70 ? 'ok' : 'warn'}">${Math.round(r.rubric)}</span></div>`).join('')}</div>` : '<p class="small muted mt">Aún no hay ensayos.</p>'}</div>
          <button class="btn danger sm" data-del>Borrar presentación</button>
        </div>
      </div>`;
    const drawReady = () => {
      $('[data-ready]', el).innerHTML = readiness(p).map(r => `<div class="row small"><span class="tag ${r.ok ? 'ok' : ''}">${r.ok ? '✓' : '○'}</span>${esc(r.label)}</div>`).join('');
      const wc = wordCount(p.central), w = $('[data-wc]', el);
      w.innerHTML = `<span class="tag ${wc && wc <= 15 ? 'ok' : wc ? 'bad' : ''}">${wc}/15 palabras</span>`;
    };
    let t = null;
    const persist = () => { clearTimeout(t); t = setTimeout(() => savePres(p), 400); drawReady(); };
    $$('[data-k]', el).forEach(i => i.oninput = () => {
      const k = i.dataset.k;
      p[k] = i.type === 'range' || i.type === 'number' ? +i.value : i.value;
      const v = $(`[data-v="${k}"]`, el); if (v) v.textContent = i.value;
      persist();
    });
    $$('[data-pt]', el).forEach(i => i.oninput = () => { p.points[+i.dataset.pt][i.dataset.f] = i.value; persist(); });
    $('[data-print]', el).onclick = () => { savePres(p); printCard(p); };
    $('[data-del]', el).onclick = async () => {
      if (await E.ui.confirmDialog('Se borrará la presentación y su historial de ensayos (las grabaciones se conservan).', { okLabel: 'Borrar', danger: true })) {
        E.store.update(s => { s.practice.presentations = s.practice.presentations.filter(x => x.id !== p.id); });
        E.app.go('#/escenario/presentaciones');
      }
    };
    drawReady();
    return () => { clearTimeout(t); savePres(p); };
  }

  function cardHtml(p, compact) {
    const pts = p.points.filter(x => x.point.trim());
    return `<div class="${compact ? '' : 'print-card'}">
      ${compact ? '' : `<h1 style="font-family:Georgia,serif;margin:0 0 4px">${esc(p.title)}</h1><div style="color:#666;margin-bottom:18px">${esc(p.audience)}${p.audience ? ' · ' : ''}${p.minutes} min</div>`}
      <div class="eyebrow">Idea central</div><div class="display" style="font-size:${compact ? 20 : 24}px;margin:6px 0 14px">${esc(p.central || '—')}</div>
      ${p.hook ? `<div class="eyebrow">Apertura</div><p style="margin:6px 0 14px">${esc(p.hook)}</p>` : ''}
      <div class="eyebrow">Puntos</div><ol style="margin:6px 0 14px;padding-left:20px">${pts.map(x => `<li style="margin-bottom:6px"><b>${esc(x.point)}</b>${x.proof ? `<br><span style="opacity:.75">Prueba: ${esc(x.proof)}</span>` : ''}</li>`).join('')}</ol>
      ${p.story && !compact ? `<div class="eyebrow">Historia</div><p style="margin:6px 0 14px">${esc(p.story)}</p>` : ''}
      ${p.objection && !compact ? `<div class="eyebrow">Si preguntan</div><p style="margin:6px 0 14px"><b>${esc(p.objection)}</b><br>${esc(p.answer)}</p>` : ''}
      <div class="eyebrow">Cierre</div><p style="margin:6px 0 0"><b>${esc(p.cta || '—')}</b></p></div>`;
  }

  function printCard(p) {
    const w = window.open('', '_blank');
    if (!w) { E.ui.toast('Permite ventanas emergentes para imprimir la tarjeta'); return; }
    w.document.write(`<!doctype html><html lang="es"><head><meta charset="utf-8"><title>${esc(p.title)}</title>
      <style>body{font-family:system-ui,sans-serif;max-width:720px;margin:32px auto;padding:0 20px;color:#1F1B24;line-height:1.5}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:11px;font-weight:800;color:#C9621F}.display{font-family:Georgia,serif;font-weight:600}</style></head>
      <body>${cardHtml(p, false)}<script>window.onload=function(){window.print()}<\/script></body></html>`);
    w.document.close();
  }

  function rehearsal(el, id) {
    const p = getPres(id);
    if (!p) return presList(el);
    let panel = null;
    E.app.setTitle(`<div class="eyebrow">Ensayo · ${p.minutes} min</div><h1 class="display" style="margin-top:6px">${esc(p.title)}</h1>`);
    el.innerHTML = `${back(`#/escenario/presentacion/${p.id}`, 'Editar presentación')}
      <div class="player mt"><div class="card raised"><div class="card-title">De pie, como si estuviera tu audiencia</div><p class="small muted mt">Haz tu rutina pre-escena, planta los pies y espera 2 segundos antes de la primera frase.</p><div class="mt" data-rec></div></div>
        <div class="card">${cardHtml(p, true)}<button class="btn ghost sm mt" data-prep>Rutina pre-escena (90 s)</button></div></div>`;
    $('[data-prep]', el).onclick = () => E.forms.preScene();
    panel = E.ui.recordPanel($('[data-rec]', el), {
      kind: 'presentation', source: 'stage', label: `Ensayo · ${p.title}`, maxSec: Math.round(p.minutes * 60 * 1.3), minSec: Math.min(30, p.minutes * 30), showResult: false, allowRetry: false,
      onResult: r => {
        const m = r.metrics, dur = r.durationMs / 1000, target = p.minutes * 60;
        const timeOk = Math.abs(dur - target) / target <= 0.15;
        const vals = E.data.RUBRIC.map(() => 70);
        el.querySelector('[data-rec]').innerHTML = `
          <div class="metric-grid"><div class="metric ${timeOk ? '' : 'focus'}"><div class="l">Duración</div><div class="v">${fmt.clock(dur)}</div><div class="s"><span class="tag ${timeOk ? 'ok' : 'warn'}">objetivo ${fmt.clock(target)} ±15%</span></div></div></div>
          <div class="mt">${E.ui.metricsBlock(m, { keys: ['fillersPerMin', 'fallingPct', 'f0SdSt', 'longPausesPerMin', 'wpm'] })}</div>
          ${audioOf(r.rec)}
          <div class="card-title mt-lg">Escúchate y califica (1–100)</div>
          <div class="stack mt">${E.data.RUBRIC.map((q, i) => `<div class="slider-row"><span class="small" style="font-weight:800">${esc(q)}</span><input type="range" min="1" max="100" value="70" data-rb="${i}"><b data-rv="${i}" class="center">70</b></div>`).join('')}</div>
          <div class="row mt-lg" style="justify-content:flex-end"><a class="btn ghost" href="#/escenario/ensayo/${p.id}">Ensayar de nuevo</a><button class="btn go" data-save>Guardar ensayo</button></div>`;
        $$('[data-rb]', el).forEach(s => s.oninput = () => { vals[+s.dataset.rb] = +s.value; $(`[data-rv="${s.dataset.rb}"]`, el).textContent = s.value; });
        $('[data-save]', el).onclick = () => {
          const rubric = avg(vals);
          const cur = getPres(p.id);
          cur.rehearsals.push({ date: new Date().toISOString(), recId: r.rec && r.rec.id, durationSec: Math.round(dur), rubric, fillersPerMin: m.fillersPerMin, fallingPct: m.fallingPct });
          savePres(cur);
          const xp = E.game.award('recording', 5, r.rec && r.rec.id);
          E.app.go(`#/escenario/presentacion/${p.id}`);
          setTimeout(() => E.app.rewards({ xp }), 100);
        };
      }
    });
    return () => panel && panel.destroy();
  }

  // ---------- presencia en video ----------
  function pickMime(kind) {
    if (typeof MediaRecorder === 'undefined') return '';
    const list = kind === 'video' ? ['video/webm;codecs=vp8,opus', 'video/webm', 'video/mp4'] : ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4'];
    return list.find(m => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) || '';
  }

  function video(el) {
    let stream = null, vRec = null, aRec = null, timer = null, t0 = 0;
    const cleanup = () => { clearInterval(timer); [vRec, aRec].forEach(r => { try { if (r && r.state === 'recording') r.stop(); } catch (e) { /* noop */ } }); if (stream) stream.getTracks().forEach(t => t.stop()); stream = null; };
    E.app.setTitle(`<div class="eyebrow">Escenario</div><h1 class="display" style="margin-top:6px">Presencia en video</h1>`);
    const presList2 = pr().presentations.filter(p => p.central);
    const topic = { text: pick(E.data.TEXTS.topics) };

    function intro() {
      cleanup();
      const hist = pr().presence.slice().reverse();
      el.innerHTML = `${back()}
        <div class="grid grid-3 mt">
          <div class="card raised span-2">
            <div class="card-title">Qué vas a hacer</div>
            <ol class="steps-list mt"><li><span>Colócate a 1–1.5 m de la cámara, de pie si puedes, con la cámara a la altura de tus ojos.</span></li><li><span>Habla 1–3 minutos sobre el tema mirando a la lente.</span></li><li><span>Revisa el video <b>sin sonido</b> y califica tu cuerpo; después escucha tus métricas de voz.</span></li></ol>
            <div class="mt"><div class="small" style="font-weight:800">Tema</div>
              <div class="chips mt" style="margin-top:8px"><button class="chip on" data-topic="random">🎲 Tema sorteado</button>${presList2.map(p => `<button class="chip" data-topic="${p.id}">📑 ${esc(p.title)}</button>`).join('')}</div>
              <div class="rec-prompt mt" data-topic-text>${esc(topic.text)}</div></div>
            <button class="btn go big block mt-lg" data-cam>🎥 Encender cámara</button>
          </div>
          <div class="card"><div class="card-title">Tu presencia</div>
            ${hist.length ? `<div class="mt">${E.ui.spark(pr().presence.map(x => x.score), { target: 70 })}</div><div class="list mt">${hist.slice(0, 6).map(x => `<div class="list-item"><div class="grow"><b class="small">${fmt.dateTime(x.date)}</b><div class="tiny faint">${x.durationSec ? fmt.clock(x.durationSec) : ''}</div></div><span class="tag ${x.score >= 70 ? 'ok' : 'warn'}">${Math.round(x.score)}</span>${x.recId ? `<button class="btn sm ghost" data-watch="${x.recId}">▶</button>` : ''}</div>`).join('')}</div>` : '<p class="small muted mt">Tu puntaje de presencia aparecerá aquí y se usará como referencia en tu próxima autoevaluación EVCS-100.</p>'}</div>
        </div>`;
      $$('[data-topic]', el).forEach(b => b.onclick = () => {
        $$('[data-topic]', el).forEach(x => x.classList.toggle('on', x === b));
        const p = presList2.find(x => x.id === b.dataset.topic);
        topic.text = p ? `${p.title}: ${p.central}` : pick(E.data.TEXTS.topics);
        $('[data-topic-text]', el).textContent = topic.text;
      });
      $$('[data-watch]', el).forEach(b => b.onclick = () => {
        const m = E.ui.modal({ title: 'Tu video', body: '<div data-v></div>', wide: true });
        E.records.url(b.dataset.watch).then(u => { const box = $('[data-v]', m.el); if (box) box.innerHTML = u ? `<video controls playsinline src="${u}" style="width:100%;border-radius:16px;background:#000"></video>` : '<p class="muted">Video no disponible.</p>'; });
      });
      $('[data-cam]', el).onclick = camera;
    }

    async function camera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'user' }, audio: { echoCancellation: false, noiseSuppression: true, autoGainControl: false } });
      } catch (err) {
        el.innerHTML = `${back()}<div class="card mt"><div class="callout err"><b>No se pudo usar la cámara.</b><br><span class="small">${esc(err.message || err)}. Revisa el permiso de cámara del navegador.</span></div><button class="btn mt" data-retry>Reintentar</button></div>`;
        $('[data-retry]', el).onclick = intro;
        return;
      }
      el.innerHTML = `${back()}<div class="card raised mt">
        <div class="rec-prompt"><span class="eyebrow">Tema</span><div style="margin-top:6px;font-weight:800">${esc(topic.text)}</div></div>
        <video data-live autoplay muted playsinline style="width:100%;max-height:60vh;border-radius:18px;background:#000;transform:scaleX(-1);margin-top:14px"></video>
        <div class="rec-stage"><div class="rec-time" data-t>0:00</div><button class="rec-btn" data-go aria-label="Grabar">🎥</button><div class="small muted">Máximo 3:00 · mínimo 0:20</div></div></div>`;
      $('[data-live]', el).srcObject = stream;
      $('[data-go]', el).onclick = startRec;
    }

    function startRec() {
      const vChunks = [], aChunks = [];
      const vm = pickMime('video'), am = pickMime('audio');
      vRec = new MediaRecorder(stream, Object.assign({ videoBitsPerSecond: 700000 }, vm ? { mimeType: vm } : {}));
      aRec = new MediaRecorder(new MediaStream(stream.getAudioTracks()), am ? { mimeType: am } : undefined);
      vRec.ondataavailable = e => e.data.size && vChunks.push(e.data);
      aRec.ondataavailable = e => e.data.size && aChunks.push(e.data);
      const stopped = Promise.all([new Promise(r => { vRec.onstop = r; }), new Promise(r => { aRec.onstop = r; })]);
      vRec.start(500); aRec.start(500); t0 = performance.now();
      E.ui.beep(880, 150);
      const btn = $('[data-go]', el);
      btn.className = 'rec-btn stop live'; btn.textContent = '';
      timer = setInterval(() => {
        const s = (performance.now() - t0) / 1000;
        const t = $('[data-t]', el); if (t) t.textContent = fmt.clock(s);
        if (s >= 180) finish();
      }, 250);
      async function finish() {
        const s = (performance.now() - t0) / 1000;
        clearInterval(timer);
        vRec.stop(); aRec.stop();
        await stopped;
        stream.getTracks().forEach(t => t.stop()); stream = null;
        const vBlob = new Blob(vChunks, { type: vRec.mimeType || 'video/webm' });
        const aBlob = new Blob(aChunks, { type: aRec.mimeType || 'audio/webm' });
        reviewVideo(vBlob, aBlob, s);
      }
      btn.onclick = () => { if ((performance.now() - t0) / 1000 < 20) { E.ui.toast('Graba al menos 20 segundos'); return; } finish(); };
    }

    async function reviewVideo(vBlob, aBlob, durationSec) {
      const url = URL.createObjectURL(vBlob);
      const rubric = {};
      el.innerHTML = `${back()}<div class="grid grid-2 mt">
        <div class="card raised"><div class="eyebrow">Paso 1 · Sin sonido</div><div class="card-title mt">Observa sólo tu cuerpo</div>
          <video data-rv src="${url}" controls muted playsinline style="width:100%;border-radius:16px;background:#000;margin-top:12px"></video>
          <p class="tiny faint mt">El video está silenciado a propósito: así juzgas tu presencia sin que la voz te distraiga.</p></div>
        <div class="card raised"><div class="card-title">Califica de 1 a 5</div><div class="stack mt">${P().PRESENCE_RUBRIC.map(r => `<div><div class="row between"><b class="small">${esc(r.label)}</b>${stars(r.id, null)}</div><div class="tiny faint">${esc(r.desc)}</div></div>`).join('')}</div>
          <div class="eyebrow mt-lg">Paso 2 · Con sonido</div><div class="mt" data-voice><div class="row"><div class="spinner" style="width:22px;height:22px;border-width:3px"></div><span class="small muted">Analizando tu voz…</span></div></div>
          <button class="btn go block mt-lg" data-save disabled>Guardar evaluación</button></div></div>`;
      bindStars(el, (k, n) => { rubric[k] = n; $('[data-save]', el).disabled = Object.keys(rubric).length < P().PRESENCE_RUBRIC.length; });
      let metrics = {};
      try {
        metrics = await E.audio.analyzeBlob(aBlob, { sex: (E.store.get().profile || {}).sex || 'na', kind: 'presentation' });
        $('[data-voice]', el).innerHTML = `${E.ui.metricsBlock(metrics, { keys: ['fallingPct', 'f0SdSt', 'longPausesPerMin', 'fillersPerMin', 'wpm'] })}<button class="btn sm ghost mt" data-unmute>🔊 Ver con sonido</button>`;
        $('[data-unmute]', el).onclick = () => { const v = $('[data-rv]', el); v.muted = false; v.currentTime = 0; v.play(); };
      } catch (e) {
        $('[data-voice]', el).innerHTML = '<p class="small muted">No se pudo analizar el audio de este video.</p>';
      }
      $('[data-save]', el).onclick = async () => {
        const score = avg(Object.values(rubric)) * 20;
        const rec = await E.records.save({ blob: vBlob, durationMs: durationSec * 1000, metrics, kind: 'video', source: 'stage', label: 'Presencia en video' });
        E.store.update(s => s.practice.presence.push({ date: new Date().toISOString(), recId: rec.id, rubric, score, durationSec: Math.round(durationSec) }));
        URL.revokeObjectURL(url);
        const xp = E.game.award('recording', 5, rec.id);
        intro();
        E.app.rewards({ xp, icon: '🎥', title: `Presencia: ${Math.round(score)}`, text: 'Se usará como referencia en tu próxima autoevaluación EVCS-100.' });
      };
    }

    intro();
    return cleanup;
  }

  // ---------- evaluación a ciegas ----------
  function blind(el) {
    const recs = E.store.get().recordings.filter(r => r.hasAudio && r.kind !== 'mpt' && r.kind !== 'ddk').sort((a, b) => a.date.localeCompare(b.date));
    const pair = E.records.readingPair();
    let beforeId = pair ? pair[0].id : (recs[0] || {}).id, afterId = pair ? pair[1].id : (recs[recs.length - 1] || {}).id;
    E.app.setTitle(`<div class="eyebrow">Escenario</div><h1 class="display" style="margin-top:6px">Evaluación a ciegas</h1>`);

    function setup() {
      const results = pr().blind.slice().reverse();
      const opt = sel => recs.map(r => `<option value="${r.id}" ${r.id === sel ? 'selected' : ''}>${fmt.dateTime(r.date)} · ${esc(r.label)}</option>`).join('');
      el.innerHTML = `${back()}
        ${recs.length < 2 ? '<div class="card mt"><div class="empty"><span class="e-ico">🎙️</span>Necesitas al menos dos grabaciones con audio. Lo ideal: tu lectura del Texto Base del diagnóstico y una reciente.</div></div>' : `
        <div class="card raised mt"><p class="muted">Pide a alguien (familia, colega, amistad) que escuche dos grabaciones tuyas <b>sin decirle cuál es la reciente</b>. La app las presenta como A y B en orden aleatorio.</p>
          <div class="grid grid-2 mt"><label class="field">Grabación de antes<select data-b>${opt(beforeId)}</select></label><label class="field">Grabación de ahora<select data-a>${opt(afterId)}</select></label></div>
          <p class="tiny faint mt">Para una comparación justa, elige grabaciones del mismo texto o tipo (por ejemplo, dos lecturas del Texto Base).</p>
          <button class="btn go big block mt-lg" data-start>Entregar al oyente</button></div>`}
        ${results.length ? `<div class="section-title"><h2 class="display">Resultados</h2><span class="small muted">${results.filter(b => b.preferredAfter).length} de ${results.length} prefirieron tu versión actual</span></div>
          <div class="card"><div class="list">${results.map(b => `<div class="list-item"><div class="avatar">${b.preferredAfter ? '✅' : '↩️'}</div><div class="grow"><b class="small">${esc(b.listener || 'Oyente anónimo')}</b><div class="tiny faint">${fmt.date(b.date)} · antes ${fmt.num(b.avgBefore, 1)} → ahora ${fmt.num(b.avgAfter, 1)} (de 5)</div></div><span class="tag ${b.preferredAfter ? 'ok' : 'warn'}">${b.preferredAfter ? 'Prefirió la actual' : 'Prefirió la anterior'}</span></div>`).join('')}</div></div>` : ''}`;
      if (recs.length < 2) return;
      $('[data-b]', el).onchange = e => { beforeId = e.target.value; };
      $('[data-a]', el).onchange = e => { afterId = e.target.value; };
      $('[data-start]', el).onclick = () => {
        if (beforeId === afterId) { E.ui.toast('Elige dos grabaciones distintas'); return; }
        listener();
      };
    }

    function listener() {
      const flip = Math.random() < 0.5;
      const A = flip ? afterId : beforeId, B = flip ? beforeId : afterId;
      const scores = { A: {}, B: {} };
      let preferred = null;
      el.innerHTML = `<div class="card raised"><div class="eyebrow">Para el oyente</div><h2 class="display mt">Escucha dos grabaciones</h2>
          <p class="muted mt">Escucha A y B completas (con audífonos si puedes). Califica cada una de 1 a 5 y elige la que suena mejor.</p>
          <label class="field mt">Tu nombre (opcional)<input type="text" data-name maxlength="40"></label></div>
        <div class="grid grid-2 mt">${['A', 'B'].map(k => `<div class="card raised"><div class="row between"><h2 class="display">Grabación ${k}</h2></div><div data-au="${k}"><div class="spinner" style="width:22px;height:22px;border-width:3px"></div></div>
          <div class="stack mt">${P().BLIND_CRITERIA.map(c => `<div><div class="small" style="font-weight:800">${esc(c.label)}</div>${stars(`${k}-${c.id}`, null)}</div>`).join('')}</div></div>`).join('')}</div>
        <div class="card raised mt center"><div class="card-title">¿Cuál suena mejor en general?</div>
          <div class="chips mt" style="justify-content:center"><button class="chip" data-pref="A" style="font-size:18px;padding:12px 26px">A</button><button class="chip" data-pref="B" style="font-size:18px;padding:12px 26px">B</button></div>
          <button class="btn go big mt-lg" data-reveal disabled>Ver resultado</button></div>`;
      [['A', A], ['B', B]].forEach(([k, id]) => E.records.url(id).then(u => { const box = $(`[data-au="${k}"]`, el); if (box) box.innerHTML = u ? `<audio controls src="${u}"></audio>` : '<p class="small muted">Audio no disponible.</p>'; }));
      const check = () => {
        const n = P().BLIND_CRITERIA.length;
        $('[data-reveal]', el).disabled = !(preferred && Object.keys(scores.A).length === n && Object.keys(scores.B).length === n);
      };
      bindStars(el, (key, v) => { const [k, c] = key.split('-'); scores[k][c] = v; check(); });
      $$('[data-pref]', el).forEach(b => b.onclick = () => { preferred = b.dataset.pref; $$('[data-pref]', el).forEach(x => x.classList.toggle('on', x === b)); check(); });
      $('[data-reveal]', el).onclick = () => {
        const afterKey = A === afterId ? 'A' : 'B', beforeKey = afterKey === 'A' ? 'B' : 'A';
        const avgAfter = avg(Object.values(scores[afterKey])), avgBefore = avg(Object.values(scores[beforeKey]));
        const preferredAfter = preferred === afterKey;
        const listenerName = $('[data-name]', el).value.trim();
        E.store.update(s => s.practice.blind.push({ date: new Date().toISOString(), listener: listenerName, beforeId, afterId, preferredAfter, scoresBefore: scores[beforeKey], scoresAfter: scores[afterKey], avgBefore, avgAfter }));
        el.innerHTML = `<div class="card raised center"><div style="font-size:60px">${preferredAfter ? '🎉' : '🧭'}</div>
